AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Support Chat Service API for Beezey
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - dev-be
    - prod
    Description: Environment name
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool for authorization
  CognitoUserPoolId:
    Type: String
    Description: ID of the Cognito User Pool
    Default: eu-south-1_0oK9agPYd
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        SUPPORT_CHATS_TABLE_NAME:
          Fn::Sub: ${Environment}-SupportChats
        SUPPORT_MESSAGES_TABLE_NAME:
          Fn::Sub: ${Environment}-SupportMessages
        CONNECTION_MANAGER_TABLE_NAME:
          Fn::Sub: ${Environment}-ConnectionManager
        CHAT_ATTACHMENTS_BUCKET_NAME:
          Fn::Sub: ${Environment}-beezey-chat-attachments
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: support-chat
        POWERTOOLS_METRICS_NAMESPACE: Beezey
    Layers:
    - Ref: ChatSharedLayer
Resources:
  ChatSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${Environment}-support-chat-shared-layer
      Description: Shared models and DB manager for support chat service
      ContentUri: s3://beezey-prod/support-chat/20260420-111800/787be58adeb0c43123fc5c01a3b256bb
      CompatibleRuntimes:
      - python3.13
      - python3.12
      - python3.11
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.13
      CompatibleRuntimes:
      - python3.13
      - python3.12
      - python3.11
      RetentionPolicy: Retain
      SamResourceId: ChatSharedLayer
  SupportChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-support-chat-api
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,PATCH,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
        MaxAge: '''600'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Ref: CognitoUserPoolArn
      TracingEnabled: true
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: SupportChatApi
  SupportChatWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-support-chat-websocket-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: SupportChatWebSocketApi
  SupportChatWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: SupportChatWebSocketApi
      StageName:
        Ref: Environment
      AutoDeploy: true
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: SupportChatWebSocketStage
  CreateSupportChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-chat-create
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/49f8c362aee8c21432dabe114af50f07
      Handler: app.handler
      Description: Create a new support chat ticket
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      Events:
        CreateSupportChatEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats
            Method: POST
        CreateSupportChatEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats
            Method: POST
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: CreateSupportChatFunction
  InitiateSupportChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-chat-initiate
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/a10b2eddbc6e85e79e3bf41a5e06f724
      Handler: app.handler
      Description: Backoffice initiates support chat with a user by email
      Environment:
        Variables:
          COGNITO_USER_POOL_ID:
            Ref: CognitoUserPoolId
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportMessages
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
            Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        InitiateSupportChatEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/initiate
            Method: POST
        InitiateSupportChatEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/initiate
            Method: POST
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: InitiateSupportChatFunction
  GetMySupportChatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-chats-list
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/90fee7e8800a35901b9c25a729989c67
      Handler: app.handler
      Description: Get support chats for authenticated user
      Environment:
        Variables:
          USER_POOL_ID:
            Ref: CognitoUserPoolId
          PROFILE_PHOTOS_BUCKET:
            Fn::Sub: ${Environment}-beezey-profiles
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: ${Environment}-beezey-profiles
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-SupportChats/index/*
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: ${CognitoUserPoolArn}
      Events:
        GetMySupportChatsEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats
            Method: GET
        GetMySupportChatsEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: GetMySupportChatsFunction
  GetSupportMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-messages-list
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/e07850cc8ec13a8a937c535d5fd39a15
      Handler: app.handler
      Description: Get messages for a support chat
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportMessages
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-SupportMessages/index/*
      Events:
        GetSupportMessagesEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}/messages
            Method: GET
        GetSupportMessagesEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}/messages
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: GetSupportMessagesFunction
  SendSupportMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-send-message
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/5521effbe5948ff2b50e5b68324b81f7
      Handler: app.handler
      Description: Send a message in support chat with WebSocket broadcast
      Timeout: 60
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportMessages
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      Events:
        SendSupportMessageEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}/messages
            Method: POST
        SendSupportMessageEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}/messages
            Method: POST
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: SendSupportMessageFunction
  UpdateSupportMessageStateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-message-state
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/7853fe990176c29dc06b75c5b8c980b3
      Handler: app.handler
      Description: Update state of support message (sent/delivered/read)
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportMessages
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-SupportMessages/index/*
      Events:
        UpdateStateEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}/messages/{messageId}/state
            Method: PUT
        UpdateStateEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}/messages/{messageId}/state
            Method: PUT
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: UpdateSupportMessageStateFunction
  SetSupportStickerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-message-sticker
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/5bcce78d53d856012e02edc8068774ec
      Handler: app.handler
      Description: Add emoji/sticker to support message
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportMessages
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-SupportMessages/index/*
      Events:
        SetStickerEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}/messages/{messageId}/sticker
            Method: PUT
        SetStickerEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}/messages/{messageId}/sticker
            Method: PUT
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: SetSupportStickerFunction
  GetSupportUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-upload-url
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/e1dc8642ec62f47b51c5cd910a63d6c2
      Handler: app.handler
      Description: Get presigned S3 URL for support chat attachment
      Timeout: 30
      Policies:
      - S3CrudPolicy:
          BucketName:
            Fn::Sub: ${Environment}-beezey-chat-attachments
      Events:
        GetUploadUrlEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}/upload-url
            Method: POST
        GetUploadUrlEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}/upload-url
            Method: POST
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: GetSupportUploadUrlFunction
  GetSupportDownloadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-download-url
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/910067800acbd8666ff1fd4e72d2fccb
      Handler: app.lambda_handler
      Description: Get presigned S3 URL for downloading support chat attachment
      Timeout: 30
      Environment:
        Variables:
          CHAT_ATTACHMENTS_BUCKET:
            Fn::Sub: ${Environment}-beezey-chat-attachments
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportMessages
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportMessages
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: ${Environment}-beezey-chat-attachments
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-SupportMessages/index/*
      Events:
        GetDownloadUrlEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}/download-url
            Method: GET
        GetDownloadUrlEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}/download-url
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: GetSupportDownloadUrlFunction
  DeleteSupportChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-chat-delete
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/d6d1f99c99b18aa364abd23f0f8322c0
      Handler: app.handler
      Description: Delete (soft-delete) a support chat
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      Events:
        DeleteChatEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}
            Method: DELETE
        DeleteChatEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}
            Method: DELETE
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: DeleteSupportChatFunction
  UpdateSupportChatStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-chat-update-status
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/df2c0fa4127dd813a1eb785f552d4564
      Handler: app.handler
      Description: Update support chat status (open, in_progress, resolved, closed,
        archived)
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-SupportChats
      Events:
        UpdateStatusEventLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /support-chats/{supportChatId}/status
            Method: PATCH
        UpdateStatusEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: SupportChatApi
            Path: /v1/support-chats/{supportChatId}/status
            Method: PATCH
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: UpdateSupportChatStatusFunction
  OnConnectSupportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-on-connect
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/acbbc99caef008b23d410db76a3f9b0a
      Handler: app.handler
      Description: Handle WebSocket connection for support chat
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: OnConnectSupportFunction
  OnDisconnectSupportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-support-on-disconnect
      CodeUri: s3://beezey-prod/support-chat/20260420-111800/7028d2bc75ff952c0dd46cea9ca62860
      Handler: app.handler
      Description: Handle WebSocket disconnection for support chat
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: SupportChat
    Metadata:
      SamResourceId: OnDisconnectSupportFunction
  OnConnectSupportIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SupportChatWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnConnectSupportFunction.Arn}/invocations
    Metadata:
      SamResourceId: OnConnectSupportIntegration
  OnConnectSupportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SupportChatWebSocketApi
      RouteKey: $connect
      Target:
        Fn::Sub: integrations/${OnConnectSupportIntegration}
    Metadata:
      SamResourceId: OnConnectSupportRoute
  OnConnectSupportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: OnConnectSupportFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SupportChatWebSocketApi}/*/*
    Metadata:
      SamResourceId: OnConnectSupportPermission
  OnDisconnectSupportIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SupportChatWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnDisconnectSupportFunction.Arn}/invocations
    Metadata:
      SamResourceId: OnDisconnectSupportIntegration
  OnDisconnectSupportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SupportChatWebSocketApi
      RouteKey: $disconnect
      Target:
        Fn::Sub: integrations/${OnDisconnectSupportIntegration}
    Metadata:
      SamResourceId: OnDisconnectSupportRoute
  OnDisconnectSupportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: OnDisconnectSupportFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SupportChatWebSocketApi}/*/*
    Metadata:
      SamResourceId: OnDisconnectSupportPermission
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId:
        Ref: SupportChatApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault4XX
  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId:
        Ref: SupportChatApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault5XX
Outputs:
  SupportChatApiUrl:
    Description: URL base dell'API Gateway REST per Support Chat
    Value:
      Fn::Sub: https://${SupportChatApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
    Export:
      Name:
        Fn::Sub: ${Environment}-SupportChatApiUrl
  SupportChatApiId:
    Description: ID dell'API Gateway REST per Support Chat
    Value:
      Ref: SupportChatApi
    Export:
      Name:
        Fn::Sub: ${Environment}-SupportChatApiId
  SupportChatWebSocketApiUrl:
    Description: URL WebSocket API Gateway per Support Chat
    Value:
      Fn::Sub: wss://${SupportChatWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${Environment}-SupportChatWebSocketApiUrl
  SupportChatWebSocketApiId:
    Description: ID dell'API Gateway WebSocket per Support Chat
    Value:
      Ref: SupportChatWebSocketApi
    Export:
      Name:
        Fn::Sub: ${Environment}-SupportChatWebSocketApiId
