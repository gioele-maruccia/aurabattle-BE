AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: User API - Profile and preferences management
Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
    - dev-aurabattle
    - prod-aurabattle
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID
  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN
  UserProfilesTableName:
    Type: String
    Description: DynamoDB User Profiles table name
  BattlesTableName:
    Type: String
    Description: DynamoDB Battles table name
Globals:
  Function:
    Runtime: python3.10
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        USER_PROFILES_TABLE:
          Ref: UserProfilesTableName
        USER_POOL_ID:
          Ref: UserPoolId
Resources:
  UserAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: Environment
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn:
              Ref: UserPoolArn
      Cors:
        AllowMethods: '''*'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
    Metadata:
      SamResourceId: UserAPI
  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-get-profile
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/24bf344397ca0f65e038ca613c1f38c9
      Handler: app.handler
      Timeout: 30
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/profile
            Method: GET
    Metadata:
      SamResourceId: GetProfileFunction
  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-update-profile
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/0c8f13c74b5e7e0964a6d1a14750bc37
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminUpdateUserAttributes
          Resource:
            Ref: UserPoolArn
      Events:
        Update:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/profile
            Method: PUT
    Metadata:
      SamResourceId: UpdateProfileFunction
  UpdateSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-update-settings
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/be4e7fff132cdefcde3d8a75d221425c
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Update:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/settings
            Method: PATCH
    Metadata:
      SamResourceId: UpdateSettingsFunction
  DeleteAccountSimpleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-delete-account-simple
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/410d146a606989b724af217cda95071d
      Handler: app.handler
      Timeout: 10
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/profile/delete-account-simple
            Method: POST
    Metadata:
      SamResourceId: DeleteAccountSimpleFunction
  RegisterFcmTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-register-fcm-token
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/d9398057352b7cbef83c228ffaad5f3b
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/users/{userId}/fcm-token
            Method: POST
    Metadata:
      SamResourceId: RegisterFcmTokenFunction
  AddBookmarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-add-bookmark
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/b256c66ddf2ed4a1f58661e4591a7a9d
      Handler: app.handler
      Environment:
        Variables:
          BATTLES_TABLE:
            Ref: BattlesTableName
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/bookmarks/battles/{battleId}
            Method: POST
    Metadata:
      SamResourceId: AddBookmarkFunction
  RemoveBookmarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-remove-bookmark
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/ca458ade5a67f7d1502659a395c74e6c
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/bookmarks/battles/{battleId}
            Method: DELETE
    Metadata:
      SamResourceId: RemoveBookmarkFunction
  ListBookmarksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-api-list-bookmarks
      CodeUri: s3://aurabattle-prod-artifacts/user-api-prod-aurabattle/20260928-105140/58483b9c334f84d43cb3915ab3578a82
      Handler: app.handler
      Environment:
        Variables:
          BATTLES_TABLE:
            Ref: BattlesTableName
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: UserProfilesTableName
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: UserAPI
            Path: /v1/bookmarks/battles
            Method: GET
    Metadata:
      SamResourceId: ListBookmarksFunction
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId:
        Ref: UserAPI
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault4XX
  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId:
        Ref: UserAPI
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault5XX
Outputs:
  ApiEndpoint:
    Value:
      Fn::Sub: https://${UserAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ApiId:
    Value:
      Ref: UserAPI
  DeleteAccountSimpleFunctionArn:
    Description: ARN of DeleteAccountSimple stub Lambda function
    Value:
      Fn::GetAtt:
      - DeleteAccountSimpleFunction
      - Arn
