AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: User API - Profile and preferences management

Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
      - dev-aurabattle
      - prod-aurabattle

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID

  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN

  UserProfilesTableName:
    Type: String
    Description: DynamoDB User Profiles table name

  BattlesTableName:
    Type: String
    Description: DynamoDB Battles table name

Globals:
  Function:
    Runtime: python3.10
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        USER_PROFILES_TABLE: !Ref UserProfilesTableName
        USERNAMES_TABLE: !Sub ${Environment}-Usernames
        USER_POOL_ID: !Ref UserPoolId
        REPORTS_TABLE: !Sub ${Environment}-Reports
        USER_BLOCKS_TABLE: !Sub ${Environment}-UserBlocks

Resources:
  UserAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !Ref UserPoolArn
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # GET /profile - Ottieni profilo completo
  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-get-profile
      CodeUri: ../../../src/lambdas/services/user-api/get-profile/
      Handler: app.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/profile
            Method: GET

  # PUT /profile - Aggiorna profilo completo (Cognito + DynamoDB)
  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-update-profile
      CodeUri: ../../../src/lambdas/services/user-api/update-profile/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBCrudPolicy:
            TableName: !Sub ${Environment}-Usernames
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !Ref UserPoolArn
      Events:
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/profile
            Method: PUT

  # PATCH /settings - Aggiorna preferenze (notifiche + localizzazione)
  UpdateSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-update-settings
      CodeUri: ../../../src/lambdas/services/user-api/update-settings/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Update:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/settings
            Method: PATCH

  # Richiesta di eliminazione account: registra la richiesta, la cancellazione
  # la esegue a mano il super admin (vedi backoffice /v1/admin/deletion-requests)
  DeleteAccountSimpleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-delete-account-simple
      CodeUri: ../../../src/lambdas/services/user-api/delete-account-simple/
      Handler: app.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/profile/delete-account-simple
            Method: POST

  # POST /users/{userId}/fcm-token - Registra FCM token per notifiche push
  RegisterFcmTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-register-fcm-token
      CodeUri: ../../../src/lambdas/services/user-api/register-fcm-token/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/users/{userId}/fcm-token
            Method: POST

  # POST /bookmarks/battles/{battleId} - Aggiungi battle ai bookmark
  AddBookmarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-add-bookmark
      CodeUri: ../../../src/lambdas/services/user-api/add-bookmark/
      Handler: app.handler
      Environment:
        Variables:
          BATTLES_TABLE: !Ref BattlesTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/bookmarks/battles/{battleId}
            Method: POST

  # DELETE /bookmarks/battles/{battleId} - Rimuovi battle dai bookmark
  RemoveBookmarkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-remove-bookmark
      CodeUri: ../../../src/lambdas/services/user-api/remove-bookmark/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/bookmarks/battles/{battleId}
            Method: DELETE

  # GET /bookmarks/battles - Lista battle salvate nei bookmark
  ListBookmarksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-list-bookmarks
      CodeUri: ../../../src/lambdas/services/user-api/list-bookmarks/
      Handler: app.handler
      Environment:
        Variables:
          BATTLES_TABLE: !Ref BattlesTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/bookmarks/battles
            Method: GET

  # GET /users/search?q=... - Cerca utenti registrati per display_name (picker partecipanti)
  SearchUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-search-users
      CodeUri: ../../../src/lambdas/services/user-api/search-users/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Sub ${Environment}-Usernames
        - DynamoDBReadPolicy:
            TableName: !Sub ${Environment}-UserBlocks
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/users/search
            Method: GET

  # GET /users/username-available?u=... - Verifica formato/disponibilita' username (PUBBLICO: usato in registrazione)
  CheckUsernameFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-check-username
      CodeUri: ../../../src/lambdas/services/user-api/check-username/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub ${Environment}-Usernames
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/users/username-available
            Method: GET
            Auth:
              Authorizer: NONE

  # ============================================================
  # MODERAZIONE - segnalazioni, blocchi, accettazione Termini
  # Le decisioni (rimozioni, sospensioni) le prende il super admin dal
  # backoffice: qui nessuna azione automatica sui contenuti.
  # ============================================================

  # POST /reports (utente loggato) e POST /public/reports (visitatore, device_id)
  CreateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-create-report
      CodeUri: ../../../src/lambdas/services/user-api/create-report/
      Handler: app.handler
      Environment:
        Variables:
          BATTLES_TABLE: !Ref BattlesTableName
          MATCHUPS_TABLE: !Sub ${Environment}-Matchups
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBReadPolicy:
            TableName: !Sub ${Environment}-Matchups
        - DynamoDBCrudPolicy:
            TableName: !Sub ${Environment}-Reports
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/reports
            Method: POST
        PublicPost:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/public/reports
            Method: POST
            Auth:
              Authorizer: NONE

  # GET /blocks - Utenti bloccati dall'utente loggato
  ListBlocksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-list-blocks
      CodeUri: ../../../src/lambdas/services/user-api/list-blocks/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Sub ${Environment}-UserBlocks
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/blocks
            Method: GET

  # PUT /blocks/{userId} - Blocca un utente (crea anche una segnalazione per il team)
  BlockUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-block-user
      CodeUri: ../../../src/lambdas/services/user-api/block-user/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBCrudPolicy:
            TableName: !Sub ${Environment}-UserBlocks
        - DynamoDBCrudPolicy:
            TableName: !Sub ${Environment}-Reports
      Events:
        Put:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/blocks/{userId}
            Method: PUT

  # DELETE /blocks/{userId} - Sblocca un utente
  UnblockUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-unblock-user
      CodeUri: ../../../src/lambdas/services/user-api/unblock-user/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub ${Environment}-UserBlocks
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/blocks/{userId}
            Method: DELETE

  # POST /profile/accept-terms - Registra la versione dei Termini accettata
  AcceptTermsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-user-api-accept-terms
      CodeUri: ../../../src/lambdas/services/user-api/accept-terms/
      Handler: app.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref UserAPI
            Path: /v1/profile/accept-terms
            Method: POST

  # CORS: assicura header CORS anche nelle risposte di errore generate da API Gateway (es. 401, 403, 500)
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref UserAPI
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref UserAPI
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${UserAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  ApiId:
    Value: !Ref UserAPI
  DeleteAccountSimpleFunctionArn:
    Description: ARN of DeleteAccountSimple Lambda function (records deletion requests)
    Value: !GetAtt DeleteAccountSimpleFunction.Arn
