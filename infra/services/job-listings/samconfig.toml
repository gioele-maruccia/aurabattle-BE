version = 0.1

# ============================================
# DEFAULT CONFIGURATION (DEV)
# ============================================

[default]

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "dev-job-listings"
template_file = "infra/services/job-listings/template.yaml"
resolve_s3 = false
s3_prefix = "job-listings"
s3_bucket = "beezey-dev"
region = "eu-south-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM"
parameter_overrides = [
    "Environment=dev",
    "UserPoolId=eu-south-1_0oK9agPYd",
    "CognitoUserPoolArn=arn:aws:cognito-idp:eu-south-1:881962383770:userpool/eu-south-1_0oK9agPYd"
]


# ============================================
# DEV ENVIRONMENT
# ============================================

[dev]

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "dev-job-listings"
