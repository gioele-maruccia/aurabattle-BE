AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Companies API service for seasonal job platform
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - dev-be
    - staging
    - prod
    Description: Environment name
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool for authorization
  CompaniesAssetsBucketName:
    Type: String
    Description: S3 bucket name for company assets
    Default: ''
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        COMPANIES_TABLE_NAME:
          Fn::Sub: ${Environment}-Companies
        COMPANIES_BUCKET_NAME:
          Ref: CompaniesAssetsBucketName
        ATECO_CATEGORIES_TABLE_NAME:
          Fn::Sub: ${Environment}-AtecoCategories
        JOB_ROLES_TABLE_NAME:
          Fn::Sub: ${Environment}-JobRoles
        LOG_LEVEL: INFO
Resources:
  CompaniesApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-companies-api
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Ref: CognitoUserPoolArn
      TracingEnabled: true
    Metadata:
      SamResourceId: CompaniesApi
  CreateCompanyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-companies-create
      CodeUri: s3://beezey-prod/companies/20260420-112247/3b19a9985d87b7e7ae78a86fe6b3b02f
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-AtecoCategories
      - S3CrudPolicy:
          BucketName:
            Ref: CompaniesAssetsBucketName
      Events:
        CreateCompanyLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /companies
            Method: POST
        CreateCompany:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /v1/companies
            Method: POST
    Metadata:
      SamResourceId: CreateCompanyFunction
  GetCompanyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-companies-get
      CodeUri: s3://beezey-prod/companies/20260420-112247/77ecb45ccd4a0b71c167cde0d3f7cf4f
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - S3ReadPolicy:
          BucketName:
            Ref: CompaniesAssetsBucketName
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: ${Environment}-beezey-profiles
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
            Ref: CognitoUserPoolArn
      Environment:
        Variables:
          REGION:
            Ref: AWS::Region
          COMPANIES_BUCKET_NAME:
            Ref: CompaniesAssetsBucketName
          PROFILE_PHOTOS_BUCKET:
            Fn::Sub: ${Environment}-beezey-profiles
          USER_POOL_ID:
            Fn::Select:
            - 1
            - Fn::Split:
              - /
              - Ref: CognitoUserPoolArn
      Events:
        GetCompanyLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /companies/{userId}
            Method: GET
        GetCompany:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /v1/companies/{userId}
            Method: GET
    Metadata:
      SamResourceId: GetCompanyFunction
  GetCompanyByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-companies-get-by-id
      CodeUri: s3://beezey-prod/companies/20260420-112247/909a151ebf2475d86cc109db0546e4b3
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - S3ReadPolicy:
          BucketName:
            Ref: CompaniesAssetsBucketName
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: ${Environment}-beezey-profiles
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
            Ref: CognitoUserPoolArn
      Environment:
        Variables:
          REGION:
            Ref: AWS::Region
          COMPANIES_BUCKET_NAME:
            Ref: CompaniesAssetsBucketName
          PROFILE_PHOTOS_BUCKET:
            Fn::Sub: ${Environment}-beezey-profiles
          USER_POOL_ID:
            Fn::Select:
            - 1
            - Fn::Split:
              - /
              - Ref: CognitoUserPoolArn
      Events:
        GetCompanyByIdLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /companies/public/{companyId}
            Method: GET
            Auth:
              Authorizer: NONE
        GetCompanyById:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /v1/companies/public/{companyId}
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: GetCompanyByIdFunction
  UpdateCompanyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-companies-update
      CodeUri: s3://beezey-prod/companies/20260420-112247/d20b963f37b068bef09d2f644456c9af
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - S3CrudPolicy:
          BucketName:
            Ref: CompaniesAssetsBucketName
      Events:
        UpdateCompanyLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /companies/{userId}
            Method: PUT
        UpdateCompany:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /v1/companies/{userId}
            Method: PUT
    Metadata:
      SamResourceId: UpdateCompanyFunction
  ListCompaniesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-companies-list
      CodeUri: s3://beezey-prod/companies/20260420-112247/726c82117e51c58941ca5acab77049bc
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      Events:
        ListCompaniesLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /companies
            Method: GET
        ListCompanies:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /v1/companies
            Method: GET
    Metadata:
      SamResourceId: ListCompaniesFunction
  DeleteCompanyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-companies-delete
      CodeUri: s3://beezey-prod/companies/20260420-112247/fe3ddb18d0bd5607ed2c5cd452d431b8
      Handler: app.lambda_handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      Events:
        DeleteCompanyLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /companies/{userId}
            Method: DELETE
        DeleteCompany:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /v1/companies/{userId}
            Method: DELETE
    Metadata:
      SamResourceId: DeleteCompanyFunction
  GetMyApplicableJobRolesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-companies-get-my-applicable-job-roles
      CodeUri: s3://beezey-prod/companies/20260420-112247/4a6df1d4b3819927f74421e6e10a5ff0
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobRoles
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-AtecoCategories
      Events:
        GetMyApplicableJobRolesLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /companies/my-applicable-job-roles
            Method: GET
        GetMyApplicableJobRoles:
          Type: Api
          Properties:
            RestApiId:
              Ref: CompaniesApi
            Path: /v1/companies/my-applicable-job-roles
            Method: GET
    Metadata:
      SamResourceId: GetMyApplicableJobRolesFunction
  CompaniesApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
    Metadata:
      SamResourceId: CompaniesApiRole
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId:
        Ref: CompaniesApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault4XX
  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId:
        Ref: CompaniesApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault5XX
Outputs:
  CompaniesApiUrl:
    Description: API Gateway endpoint URL for Companies API
    Value:
      Fn::Sub: https://${CompaniesApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${Environment}-CompaniesApiUrl
  CompaniesApiId:
    Description: API Gateway ID
    Value:
      Ref: CompaniesApi
    Export:
      Name:
        Fn::Sub: ${Environment}-CompaniesApiId
  CreateCompanyFunctionArn:
    Description: ARN of CreateCompany Lambda function
    Value:
      Fn::GetAtt:
      - CreateCompanyFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ${Environment}-CreateCompanyFunctionArn
  GetCompanyFunctionArn:
    Description: ARN of GetCompany Lambda function
    Value:
      Fn::GetAtt:
      - GetCompanyFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ${Environment}-GetCompanyFunctionArn
  UpdateCompanyFunctionArn:
    Description: ARN of UpdateCompany Lambda function
    Value:
      Fn::GetAtt:
      - UpdateCompanyFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ${Environment}-UpdateCompanyFunctionArn
  GetMyApplicableJobRolesFunctionArn:
    Description: ARN of GetMyApplicableJobRoles Lambda function
    Value:
      Fn::GetAtt:
      - GetMyApplicableJobRolesFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ${Environment}-GetMyApplicableJobRolesFunctionArn
