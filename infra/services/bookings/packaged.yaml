      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
          - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatWebSocketApiId}/${Environment}/POST/@connections/*
      - Statement:
