        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: UpdateBookingDatesFunction
  ConfirmBookingDatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-confirm-dates
      CodeUri: s3://beezey-prod/bookings/20260420-111321/dcaf8f498f176c606382cf896a489ca6
      Handler: app.lambda_handler
      Description: Confirm proposed booking dates (company representative only)
      Environment:
