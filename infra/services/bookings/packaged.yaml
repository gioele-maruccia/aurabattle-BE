          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Bookings/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Chats/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-ConnectionManager/index/*
      Events:
        UpdateBookingDatesLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /bookings/{bookingId}/dates
            Method: PATCH
        UpdateBookingDates:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /v1/bookings/{bookingId}/dates
            Method: PATCH
      Tags:
