AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bookings API service for Beezey seasonal job platform
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - dev-be
    - prod
    Description: Environment name
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool for authorization
  CognitoUserPoolId:
    Type: String
    Description: ID of the Cognito User Pool for AdminGetUser calls
    Default: eu-south-1_0oK9agPYd
  ChatSharedLayerArn:
    Type: String
    Description: ARN of the Chat Shared Layer (from chat service stack)
  ChatWebSocketApiId:
    Type: String
    Description: ID of the Chat WebSocket API Gateway (for notifications)
    Default: ''
  FirebaseAdminLayerArn:
    Type: String
    Description: ARN of the Firebase Admin SDK layer (from chat service stack)
    Default: ''
Conditions:
  HasChatSharedLayerArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: ChatSharedLayerArn
      - ''
  HasFirebaseAdminLayerArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: FirebaseAdminLayerArn
      - ''
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        BOOKINGS_TABLE_NAME:
          Fn::Sub: ${Environment}-Bookings
        JOB_LISTINGS_TABLE_NAME:
          Fn::Sub: ${Environment}-JobListings
        COMPANIES_TABLE_NAME:
          Fn::Sub: ${Environment}-Companies
        REVIEWS_TABLE_NAME:
          Fn::Sub: ${Environment}-Reviews
        USER_PROFILES_TABLE_NAME:
          Fn::Sub: ${Environment}-UserProfiles
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: bookings
        POWERTOOLS_METRICS_NAMESPACE: Beezey
Resources:
  BookingsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-bookings-api
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,PATCH,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
        MaxAge: '''600'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Ref: CognitoUserPoolArn
      TracingEnabled: true
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: BookingsApi
  CreateBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-create
      CodeUri: s3://beezey-prod/bookings/20260420-111321/ac5e729da64bb1c7badb5fe36743ce91
      Handler: app.lambda_handler
      Description: Create a new booking/application for a job listing
      Environment:
        Variables:
          CREATE_CHAT_FUNCTION_NAME:
            Fn::Sub: ${Environment}-chat-create
          USER_PROFILES_TABLE_NAME:
            Fn::Sub: ${Environment}-UserProfiles
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-UserProfiles
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Bookings/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-JobListings/index/*
        - Effect: Allow
          Action:
          - lambda:InvokeFunction
          Resource:
          - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-chat-create
      Events:
        CreateBookingLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /bookings
            Method: POST
        CreateBooking:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /v1/bookings
            Method: POST
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: CreateBookingFunction
  GetBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-get
      CodeUri: s3://beezey-prod/bookings/20260420-111321/a6294b6d44bef829f3a4b1d7a0b32537
      Handler: app.lambda_handler
      Description: Get booking details by ID
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-UserProfiles
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
      Environment:
        Variables:
          USER_POOL_ID:
            Ref: CognitoUserPoolId
      Events:
        GetBookingLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /bookings/{bookingId}
            Method: GET
        GetBooking:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /v1/bookings/{bookingId}
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: GetBookingFunction
  ListWorkerBookingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-list-worker
      CodeUri: s3://beezey-prod/bookings/20260420-111321/add33e3303939160422cbe41f9bf99bd
      Handler: app.lambda_handler
      Description: List all bookings for a worker
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Bookings/index/workerId-startDate-index
      Events:
        ListWorkerBookingsLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /bookings/worker/{workerId}
            Method: GET
        ListWorkerBookings:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /v1/bookings/worker/{workerId}
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: ListWorkerBookingsFunction
  ListCompanyBookingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-list-company
      CodeUri: s3://beezey-prod/bookings/20260420-111321/b81644de3d3822b16baa64a0943cb980
      Handler: app.lambda_handler
      Description: List all bookings for a company
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-UserProfiles
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Bookings/index/companyId-*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Companies/index/*
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
      Environment:
        Variables:
          USER_POOL_ID:
            Ref: CognitoUserPoolId
      Events:
        ListCompanyBookingsLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /bookings/company/{companyId}
            Method: GET
        ListCompanyBookings:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /v1/bookings/company/{companyId}
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: ListCompanyBookingsFunction
  ListListingBookingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-list-listing
      CodeUri: s3://beezey-prod/bookings/20260420-111321/aa233262d0e2b4ee0e812fa15c9715e7
      Handler: app.lambda_handler
      Description: List all bookings for a specific job listing
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Bookings/index/listingId-startDate-index
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Companies/index/*
      Events:
        ListListingBookingsLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /bookings/listing/{listingId}
            Method: GET
        ListListingBookings:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /v1/bookings/listing/{listingId}
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: ListListingBookingsFunction
  UpdateBookingStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-update-status
      CodeUri: s3://beezey-prod/bookings/20260420-111321/01d83838bcc59bc67af2136fdbd5d058
      Handler: app.lambda_handler
      Description: Update booking status (accept/reject)
      Environment:
        Variables:
          BOOKINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-Bookings
          JOB_LISTINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-JobListings
          COMPANIES_TABLE_NAME:
            Fn::Sub: ${Environment}-Companies
          USER_PROFILES_TABLE_NAME:
            Fn::Sub: ${Environment}-UserProfiles
          CHATS_TABLE_NAME:
            Fn::Sub: ${Environment}-Chats
          MESSAGES_TABLE_NAME:
            Fn::Sub: ${Environment}-Messages
          CONNECTION_MANAGER_TABLE_NAME:
            Fn::Sub: ${Environment}-ConnectionManager
          WEBSOCKET_API_ENDPOINT:
            Fn::Sub: https://${ChatWebSocketApiId}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          USER_POOL_ID:
            Ref: CognitoUserPoolId
      Layers:
      - Fn::If:
        - HasChatSharedLayerArn
        - Ref: ChatSharedLayerArn
        - Ref: AWS::NoValue
      - Fn::If:
        - HasFirebaseAdminLayerArn
        - Ref: FirebaseAdminLayerArn
        - Ref: AWS::NoValue
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-UserProfiles
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
          - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatWebSocketApiId}/${Environment}/POST/@connections/*
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Chats/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Companies/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-ConnectionManager/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Bookings/index/*
      Events:
        UpdateBookingStatusLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /bookings/{bookingId}/status
            Method: PATCH
        UpdateBookingStatus:
          Type: Api
          Properties:
            RestApiId:
              Ref: BookingsApi
            Path: /v1/bookings/{bookingId}/status
            Method: PATCH
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Bookings
    Metadata:
      SamResourceId: UpdateBookingStatusFunction
  UpdateBookingDatesFunction:
