    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-bookings-update-dates
      CodeUri: s3://beezey-prod/bookings/20260420-111321/469b27ba2105367f277b90a3929788d5
      Handler: app.lambda_handler
      Description: Update booking dates (worker only, pending bookings)
