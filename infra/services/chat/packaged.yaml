AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Chat Service API for Beezey
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - dev-be
    - prod
    Description: Environment name
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool for authorization
  CognitoUserPoolId:
    Type: String
    Description: ID of the Cognito User Pool
    Default: eu-south-1_0oK9agPYd
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        CHATS_TABLE_NAME:
          Fn::Sub: ${Environment}-Chats
        MESSAGES_TABLE_NAME:
          Fn::Sub: ${Environment}-Messages
        CONNECTION_MANAGER_TABLE_NAME:
          Fn::Sub: ${Environment}-ConnectionManager
        CHAT_ATTACHMENTS_BUCKET_NAME:
          Fn::Sub: ${Environment}-beezey-chat-attachments
        LOG_LEVEL: INFO
        POWERTOOLS_SERVICE_NAME: chat
        POWERTOOLS_METRICS_NAMESPACE: Beezey
    Layers:
    - Ref: ChatSharedLayer
    - Ref: FirebaseAdminLayer
Resources:
  ChatSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${Environment}-chat-shared-layer
      Description: Shared models and DB manager for chat service
      ContentUri: s3://beezey-prod/chat/20260420-110801/787be58adeb0c43123fc5c01a3b256bb
      CompatibleRuntimes:
      - python3.13
      - python3.12
      - python3.11
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.13
      SamResourceId: ChatSharedLayer
  FirebaseAdminLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${Environment}-firebase-admin-layer
      Description: Firebase Admin SDK for push notifications
      ContentUri: s3://beezey-prod/chat/20260420-110801/7c32cc8214cbf50b93fdb2475d3aa9c6
      CompatibleRuntimes:
      - python3.13
      - python3.12
      - python3.11
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.13
      SamResourceId: FirebaseAdminLayer
  ChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-chat-api
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,PATCH,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
        MaxAge: '''600'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Ref: CognitoUserPoolArn
      TracingEnabled: true
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: ChatApi
  ChatWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-chat-websocket-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: ChatWebSocketApi
  ChatWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: ChatWebSocketApi
      StageName:
        Ref: Environment
      AutoDeploy: true
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: ChatWebSocketStage
  CreateChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-chat-create
      CodeUri: s3://beezey-prod/chat/20260420-110801/33a66218018e7e40722c32b04f8a37bf
      Handler: app.lambda_handler
      Description: Create a new chat when a booking is created
      Environment:
        Variables:
          USER_PROFILES_TABLE:
            Fn::Sub: ${Environment}-UserProfiles
          FIREBASE_SERVICE_ACCOUNT_PATH: /opt/python/beebusy-99d60-firebase-adminsdk-fbsvc-b37bca6781.json
          USER_POOL_ID:
            Ref: CognitoUserPoolId
          WEBSOCKET_API_ENDPOINT:
            Fn::Sub: https://${ChatWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          COMPANIES_TABLE_NAME:
            Fn::Sub: ${Environment}-Companies
          BOOKINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-Bookings
          JOB_LISTINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-JobListings
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-UserProfiles
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Chats/index/*
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: ${CognitoUserPoolArn}
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
          - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatWebSocketApi}/${Environment}/POST/@connections/*
      Events:
        CreateChatLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /chats
            Method: POST
        CreateChat:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /v1/chats
            Method: POST
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: CreateChatFunction
  GetMyChatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-chat-get-my-chats
      CodeUri: s3://beezey-prod/chat/20260420-110801/d1bbe85076be784518ca7c23503661ce
      Handler: app.lambda_handler
      Description: Get list of user chats with profile photos
      Environment:
        Variables:
          COMPANIES_TABLE_NAME:
            Fn::Sub: ${Environment}-Companies
          BOOKINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-Bookings
          JOB_LISTINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-JobListings
          PROFILE_PHOTOS_BUCKET:
            Fn::Sub: ${Environment}-beezey-profiles
          USER_POOL_ID:
            Ref: CognitoUserPoolId
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - S3ReadPolicy:
          BucketName:
            Fn::Sub: ${Environment}-beezey-profiles
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Chats/index/*
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: ${CognitoUserPoolArn}
      Events:
        GetMyChatsLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /chats
            Method: GET
        GetMyChats:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /v1/chats
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: GetMyChatsFunction
  GetUnreadCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-chat-get-unread-count
      CodeUri: s3://beezey-prod/chat/20260420-110801/abdfe9d586bfa4c266ac10fedf8b2b87
      Handler: app.lambda_handler
      Description: Get total unread message count across all user chats
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Chats/index/*
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Messages/index/*
      Events:
        GetUnreadCountLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /chats/unread-count
            Method: GET
        GetUnreadCount:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /v1/chats/unread-count
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: GetUnreadCountFunction
  GetMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-chat-get-messages
      CodeUri: s3://beezey-prod/chat/20260420-110801/bcdfd17b7d9d87437f7eea3b090cab4e
      Handler: app.lambda_handler
      Description: Get messages for a chat with pagination
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      Events:
        GetMessagesLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /chats/{chat_id}/messages
            Method: GET
        GetMessages:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /v1/chats/{chat_id}/messages
            Method: GET
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: GetMessagesFunction
  SendMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-chat-send-message
      CodeUri: s3://beezey-prod/chat/20260420-110801/2ba850ebbb98d74816f2269bdffacbfe
      Handler: app.lambda_handler
      Description: Send a message in a chat
      Environment:
        Variables:
          USER_PROFILES_TABLE:
            Fn::Sub: ${Environment}-UserProfiles
          FIREBASE_SERVICE_ACCOUNT_PATH: /opt/python/beebusy-99d60-firebase-adminsdk-fbsvc-b37bca6781.json
          USER_POOL_ID:
            Ref: CognitoUserPoolId
          WEBSOCKET_API_ENDPOINT:
            Fn::Sub: https://${ChatWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          CONNECTION_MANAGER_TABLE_NAME:
            Fn::Sub: ${Environment}-ConnectionManager
          COMPANIES_TABLE_NAME:
            Fn::Sub: ${Environment}-Companies
          BOOKINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-Bookings
          JOB_LISTINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-JobListings
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-UserProfiles
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: ${CognitoUserPoolArn}
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
          - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatWebSocketApi}/${Environment}/POST/@connections/*
      Events:
        SendMessageLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /chats/{chat_id}/messages
            Method: POST
        SendMessage:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /v1/chats/{chat_id}/messages
            Method: POST
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: SendMessageFunction
  UpdateMessageStateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-chat-update-message-state
      CodeUri: s3://beezey-prod/chat/20260420-110801/9e73627722604c3236e19f1c97d4aebb
      Handler: app.lambda_handler
      Description: Update message state (delivered/read)
      Environment:
        Variables:
          WEBSOCKET_API_ENDPOINT:
            Fn::Sub: https://${ChatWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          CONNECTION_MANAGER_TABLE_NAME:
            Fn::Sub: ${Environment}-ConnectionManager
          COMPANIES_TABLE_NAME:
            Fn::Sub: ${Environment}-Companies
          BOOKINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-Bookings
          JOB_LISTINGS_TABLE_NAME:
            Fn::Sub: ${Environment}-JobListings
          USER_POOL_ID:
            Ref: CognitoUserPoolId
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Chats
      - DynamoDBCrudPolicy:
          TableName:
            Fn::Sub: ${Environment}-Messages
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-ConnectionManager
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Bookings
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-JobListings
      - Statement:
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          Resource:
          - Fn::Sub: ${CognitoUserPoolArn}
        - Effect: Allow
          Action:
          - dynamodb:Query
          Resource:
          - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Environment}-Messages/index/*
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
          - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ChatWebSocketApi}/${Environment}/POST/@connections/*
      Events:
        UpdateMessageStateLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /chats/{chat_id}/messages/{message_id}/state
            Method: PATCH
        UpdateMessageState:
          Type: Api
          Properties:
            RestApiId:
              Ref: ChatApi
            Path: /v1/chats/{chat_id}/messages/{message_id}/state
            Method: PATCH
      Tags:
        Environment:
          Ref: Environment
        Application: Beezey
        Service: Chat
    Metadata:
      SamResourceId: UpdateMessageStateFunction
  SetStickerFunction:
