  DeleteChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-chat-delete
      CodeUri: s3://beezey-prod/chat/20260420-110801/ce649d886a800e08433ebc0a220a7f90
