AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Battles API - Create, browse and manage battles
Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
    - dev-aurabattle
    - prod-aurabattle
  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN
  BattlesTableName:
    Type: String
    Description: DynamoDB Battles table name
  UserProfilesTableName:
    Type: String
    Description: DynamoDB User Profiles table name
  BattleCoversBucketName:
    Type: String
    Description: S3 bucket name for battle cover uploads
Globals:
  Function:
    Runtime: python3.10
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        BATTLES_TABLE:
          Ref: BattlesTableName
        USER_PROFILES_TABLE:
          Ref: UserProfilesTableName
Resources:
  PillowLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${Environment}-pillow-layer
      Description: Pillow (image processing) for battle cover resize
      ContentUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/52a64ecf6d7d9ff9c0348a7734758eeb
      CompatibleRuntimes:
      - python3.10
      RetentionPolicy: Retain
    Metadata:
      SamResourceId: PillowLayer
  BattlesApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: Environment
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn:
              Ref: UserPoolArn
      Cors:
        AllowMethods: '''*'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
    Metadata:
      SamResourceId: BattlesApi
  CreateBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-create
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/084d22efe2c8a4dc2654699cf922a4de
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BattlesTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId:
              Ref: BattlesApi
            Path: /v1/battles
            Method: POST
    Metadata:
      SamResourceId: CreateBattleFunction
  ListBattlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-list
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/6b0b3748668e2029fedfa7102f05471b
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: BattlesApi
            Path: /v1/battles
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: ListBattlesFunction
  GetMyBattlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-get-my
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/1abbff270f9c2ba69b2f86bbbdb96bb1
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: BattlesApi
            Path: /v1/battles/my
            Method: GET
    Metadata:
      SamResourceId: GetMyBattlesFunction
  GetBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-get
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/b7122822f808c08f08ebab7ecd190d74
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: BattlesApi
            Path: /v1/battles/{battleId}
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: GetBattleFunction
  UpdateBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-update
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/72917b5d7dc74afef621f1b7aed44469
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BattlesTableName
      Events:
        Put:
          Type: Api
          Properties:
            RestApiId:
              Ref: BattlesApi
            Path: /v1/battles/{battleId}
            Method: PUT
    Metadata:
      SamResourceId: UpdateBattleFunction
  DeleteBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-delete
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/a328deb10dd03548065d6e6535f859e9
      Handler: app.handler
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BattlesTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId:
              Ref: BattlesApi
            Path: /v1/battles/{battleId}
            Method: DELETE
    Metadata:
      SamResourceId: DeleteBattleFunction
  RequestCoverUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-request-cover-upload-url
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/4b4197f798e9aebcff9c1b6701bfe55d
      Handler: app.handler
      Environment:
        Variables:
          BATTLE_COVERS_BUCKET:
            Ref: BattleCoversBucketName
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      - Statement:
        - Effect: Allow
          Action:
          - s3:PutObject
          Resource:
            Fn::Sub: arn:aws:s3:::${BattleCoversBucketName}/uploads/*
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId:
              Ref: BattlesApi
            Path: /v1/battles/{battleId}/cover-upload-url
            Method: POST
    Metadata:
      SamResourceId: RequestCoverUploadUrlFunction
  ProcessCoverUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-battles-process-cover-upload
      CodeUri: s3://aurabattle-prod-artifacts/battles-prod-aurabattle/20261001-174451/a91b3561ae204dfed0e75a66f677984b
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Layers:
      - Ref: PillowLayer
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: BattlesTableName
      - Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          - s3:DeleteObject
          Resource:
            Fn::Sub: arn:aws:s3:::${BattleCoversBucketName}/uploads/*
        - Effect: Allow
          Action:
          - s3:PutObject
          Resource:
            Fn::Sub: arn:aws:s3:::${BattleCoversBucketName}/covers/*
    Metadata:
      SamResourceId: ProcessCoverUploadFunction
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId:
        Ref: BattlesApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault4XX
  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId:
        Ref: BattlesApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault5XX
Outputs:
  ApiEndpoint:
    Value:
      Fn::Sub: https://${BattlesApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ApiId:
    Value:
      Ref: BattlesApi
  ProcessCoverUploadFunctionArn:
    Description: ARN of the S3-triggered cover resize Lambda (wired to the bucket
      post-deploy)
    Value:
      Fn::GetAtt:
      - ProcessCoverUploadFunction
      - Arn
  ProcessCoverUploadFunctionName:
    Value:
      Ref: ProcessCoverUploadFunction
