AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Battles API - Create, browse and manage battles

Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
      - dev-aurabattle
      - prod-aurabattle

  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN

  BattlesTableName:
    Type: String
    Description: DynamoDB Battles table name

  UserProfilesTableName:
    Type: String
    Description: DynamoDB User Profiles table name

  BattleCoversBucketName:
    Type: String
    Description: S3 bucket name for battle cover uploads

  MatchupsTableName:
    Type: String
    Description: DynamoDB Matchups table name (opened/closed together with the battle)

  MatchupConnectionsTableName:
    Type: String
    Description: DynamoDB table of the matchups WebSocket connections

  MatchupsWebSocketApiEndpoint:
    Type: String
    Default: ''
    Description: >
      https:// management endpoint of the matchups WebSocket API
      (https://{apiId}.execute-api.{region}.amazonaws.com/{stage}).
      Empty until the matchups stack exists: matchups are still opened/closed,
      connected clients just are not pushed a matchup_update.

Globals:
  Function:
    Runtime: python3.10
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        BATTLES_TABLE: !Ref BattlesTableName
        USER_PROFILES_TABLE: !Ref UserProfilesTableName

Resources:
  PillowLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${Environment}-pillow-layer'
      Description: Pillow (image processing) for battle cover resize
      ContentUri: ../../../src/lambdas/layers/pillow/
      CompatibleRuntimes:
        - python3.10
      RetentionPolicy: Retain

  # ============================================================
  # IAM Role - EventBridge Scheduler -> Lambda invocation
  # Usato dagli schedule one-time "battle-live-{battle_id}" e
  # "battle-close-{battle_id}": fanno scattare il passaggio published -> live
  # all'orario di inizio e live -> closed a quello di fine, insieme ai matchup
  # (vedi create/update/delete-battle).
  # ============================================================
  BattleLiveSchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-battle-live-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSetBattleLive
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt SetBattleLiveFunction.Arn
                  - !GetAtt SetBattleClosedFunction.Arn

  BattlesApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !Ref UserPoolArn
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # POST /battles - Crea una nuova battle (auth richiesta)
  CreateBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-create
      CodeUri: ../../../src/lambdas/services/battles/create-battle/
      Handler: app.handler
      Environment:
        Variables:
          SCHEDULER_ROLE_ARN: !GetAtt BattleLiveSchedulerExecutionRole.Arn
          SET_BATTLE_LIVE_FUNCTION_ARN: !GetAtt SetBattleLiveFunction.Arn
          SET_BATTLE_CLOSED_FUNCTION_ARN: !GetAtt SetBattleClosedFunction.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
              Resource:
                - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/battle-live-*'
                - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/battle-close-*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt BattleLiveSchedulerExecutionRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref BattlesApi
            Path: /v1/battles
            Method: POST

  # GET /battles - Lista pubblica delle battle pubblicate (no auth)
  ListBattlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-list
      CodeUri: ../../../src/lambdas/services/battles/list-battles/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref BattlesApi
            Path: /v1/battles
            Method: GET
            Auth:
              Authorizer: NONE

  # GET /battles/my - Le mie battle (auth richiesta)
  GetMyBattlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-get-my
      CodeUri: ../../../src/lambdas/services/battles/get-my-battles/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref BattlesApi
            Path: /v1/battles/my
            Method: GET

  # GET /battles/{battleId} - Dettaglio battle (no auth)
  GetBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-get
      CodeUri: ../../../src/lambdas/services/battles/get-battle/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref BattlesApi
            Path: /v1/battles/{battleId}
            Method: GET
            Auth:
              Authorizer: NONE

  # PUT /battles/{battleId} - Aggiorna battle (solo host)
  UpdateBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-update
      CodeUri: ../../../src/lambdas/services/battles/update-battle/
      Handler: app.handler
      Environment:
        Variables:
          SCHEDULER_ROLE_ARN: !GetAtt BattleLiveSchedulerExecutionRole.Arn
          SET_BATTLE_LIVE_FUNCTION_ARN: !GetAtt SetBattleLiveFunction.Arn
          SET_BATTLE_CLOSED_FUNCTION_ARN: !GetAtt SetBattleClosedFunction.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BattlesTableName
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource:
                - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/battle-live-*'
                - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/battle-close-*'
            # Transizione manuale (host): set-battle-live / set-battle-closed
            # aprono e chiudono i matchup, in asincrono.
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt SetBattleLiveFunction.Arn
                - !GetAtt SetBattleClosedFunction.Arn
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt BattleLiveSchedulerExecutionRole.Arn
      Events:
        Put:
          Type: Api
          Properties:
            RestApiId: !Ref BattlesApi
            Path: /v1/battles/{battleId}
            Method: PUT

  # DELETE /battles/{battleId} - Elimina battle (solo host)
  DeleteBattleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-delete
      CodeUri: ../../../src/lambdas/services/battles/delete-battle/
      Handler: app.handler
      Environment:
        Variables:
          SET_BATTLE_LIVE_FUNCTION_ARN: !GetAtt SetBattleLiveFunction.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:DeleteSchedule
              Resource:
                - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/battle-live-*'
                - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/battle-close-*'
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref BattlesApi
            Path: /v1/battles/{battleId}
            Method: DELETE

  # POST /battles/{battleId}/cover-upload-url - Presigned URL per upload copertina custom (solo host)
  RequestCoverUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-request-cover-upload-url
      CodeUri: ../../../src/lambdas/services/battles/request-cover-upload-url/
      Handler: app.handler
      Environment:
        Variables:
          BATTLE_COVERS_BUCKET: !Ref BattleCoversBucketName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${BattleCoversBucketName}/uploads/*'
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref BattlesApi
            Path: /v1/battles/{battleId}/cover-upload-url
            Method: POST

  # Triggerata da S3 (uploads/*): ridimensiona a 1200x675 e pubblica su covers/{battleId}.jpg
  # L'evento S3 viene collegato manualmente dopo il deploy (vedi deploy-*-aurabattle.ps1),
  # perché il bucket vive in uno stack separato (infra/data/battle-covers).
  ProcessCoverUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-process-cover-upload
      CodeUri: ../../../src/lambdas/services/battles/process-cover-upload/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref PillowLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BattlesTableName
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub 'arn:aws:s3:::${BattleCoversBucketName}/uploads/*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub 'arn:aws:s3:::${BattleCoversBucketName}/covers/*'

  # Triggerata da EventBridge Scheduler all'orario di event_datetime (o da
  # update-battle su transizione manuale): passa la battle da 'published' a
  # 'live' e apre i suoi matchup. Nessun endpoint HTTP.
  SetBattleLiveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-set-live
      CodeUri: ../../../src/lambdas/services/battles/set-battle-live/
      Handler: app.handler
      Environment:
        Variables:
          MATCHUPS_TABLE: !Ref MatchupsTableName
          MATCHUP_CONNECTIONS_TABLE: !Ref MatchupConnectionsTableName
          WEBSOCKET_API_ENDPOINT: !Ref MatchupsWebSocketApiEndpoint
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupConnectionsTableName
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/POST/@connections/*'

  # Triggerata da EventBridge Scheduler all'orario di end_datetime (o da
  # update-battle su transizione manuale): chiude la battle e tutti i suoi
  # matchup, calcolando vincitore e aura_stats. Nessun endpoint HTTP.
  SetBattleClosedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-battles-set-closed
      CodeUri: ../../../src/lambdas/services/battles/set-battle-closed/
      Handler: app.handler
      Environment:
        Variables:
          MATCHUPS_TABLE: !Ref MatchupsTableName
          MATCHUP_CONNECTIONS_TABLE: !Ref MatchupConnectionsTableName
          WEBSOCKET_API_ENDPOINT: !Ref MatchupsWebSocketApiEndpoint
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupConnectionsTableName
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/${Environment}/POST/@connections/*'

  # CORS su risposte di errore API Gateway
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref BattlesApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref BattlesApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${BattlesApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  ApiId:
    Value: !Ref BattlesApi
  ProcessCoverUploadFunctionArn:
    Description: ARN of the S3-triggered cover resize Lambda (wired to the bucket post-deploy)
    Value: !GetAtt ProcessCoverUploadFunction.Arn
  ProcessCoverUploadFunctionName:
    Value: !Ref ProcessCoverUploadFunction
