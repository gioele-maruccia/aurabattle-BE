AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Email Notifications Service — SES-based transactional & marketing emails

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, dev-be, prod]

  UserProfilesTableName:
    Type: String
    Description: DynamoDB User Profiles table name

  JobListingsTableName:
    Type: String
    Description: DynamoDB Job Listings table name

  BookingsTableName:
    Type: String
    Description: DynamoDB Bookings table name

  CompaniesTableName:
    Type: String
    Description: DynamoDB Companies table name

  SesFromAddress:
    Type: String
    Default: noreply@girolavoro.it
    Description: SES verified sender address (must be verified in SES)

  SesRegion:
    Type: String
    Default: eu-south-1
    Description: AWS region where SES identity is verified

Globals:
  Function:
    Runtime: python3.13
    Timeout: 300
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        USER_PROFILES_TABLE: !Ref UserProfilesTableName
        JOB_LISTINGS_TABLE: !Ref JobListingsTableName
        BOOKINGS_TABLE: !Ref BookingsTableName
        COMPANIES_TABLE: !Ref CompaniesTableName
        SES_FROM_ADDRESS: !Ref SesFromAddress
        SES_REGION: !Ref SesRegion
        SEND_EMAIL_FUNCTION: !Sub '${Environment}-email-send'

Resources:

  # ──────────────────────────────────────────────────────────────────
  # Core sender: invoked by all other Lambdas to call SES
  # ──────────────────────────────────────────────────────────────────
  SendEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-email-send'
      CodeUri: ../../../src/lambdas/services/email-notifications/send-email/
      Handler: app.handler
      Description: Generic SES email sender — invoked by other Lambdas
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  # ──────────────────────────────────────────────────────────────────
  # App-update broadcast — triggered manually from AWS Console / Test
  # (or connect an EventBridge rule when a new release is deployed)
  # ──────────────────────────────────────────────────────────────────
  AppUpdateBroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-email-app-update-broadcast'
      CodeUri: ../../../src/lambdas/services/email-notifications/app-update-broadcast/
      Handler: app.lambda_handler
      Description: >
        Sends an app-update email to ALL active users.
        Trigger manually from AWS Console Test with:
        {"version":"x.y.z","notes_html":"<ul><li>...</li></ul>"}
      Timeout: 600
      MemorySize: 512
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserProfilesTableName}'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt SendEmailFunction.Arn

  # ──────────────────────────────────────────────────────────────────
  # Weekly Thursday 09:00 UTC — upgrade reminder to basic users
  # ──────────────────────────────────────────────────────────────────
  WeeklyUpgradeReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-email-weekly-upgrade-reminder'
      CodeUri: ../../../src/lambdas/services/email-notifications/weekly-upgrade-reminder/
      Handler: app.lambda_handler
      Description: Weekly (Thu 09:00 UTC) upgrade-to-premium reminder for basic users
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserProfilesTableName}'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt SendEmailFunction.Arn
      Events:
        WeeklyThursday:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 ? * 5 *)
            Name: !Sub '${Environment}-email-upgrade-reminder-weekly'
            Description: Thursday 09:00 UTC — upgrade reminder for basic users
            Enabled: true

  # ──────────────────────────────────────────────────────────────────
  # Weekly Monday 08:00 UTC — remind company users with no listings
  # ──────────────────────────────────────────────────────────────────
  WeeklyCompanyNoListingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-email-weekly-company-no-listing'
      CodeUri: ../../../src/lambdas/services/email-notifications/weekly-company-no-listing/
      Handler: app.lambda_handler
      Description: Weekly (Mon 08:00 UTC) nudge to company users who have no listings yet
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref JobListingsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref CompaniesTableName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserProfilesTableName}'
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${JobListingsTableName}/index/companyId-createdAt-index'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CompaniesTableName}'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt SendEmailFunction.Arn
      Events:
        WeeklyMonday:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 ? * 2 *)
            Name: !Sub '${Environment}-email-company-no-listing-weekly'
            Description: Monday 08:00 UTC — nudge company users with no listings
            Enabled: true

  # ──────────────────────────────────────────────────────────────────
  # Weekly Friday 08:00 UTC — remind worker users with no applications
  # ──────────────────────────────────────────────────────────────────
  WeeklyWorkerNoApplicationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-email-weekly-worker-no-application'
      CodeUri: ../../../src/lambdas/services/email-notifications/weekly-worker-no-application/
      Handler: app.lambda_handler
      Description: Weekly (Fri 08:00 UTC) nudge to workers who have never applied
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTableName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserProfilesTableName}'
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BookingsTableName}/index/workerId-startDate-index'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt SendEmailFunction.Arn
      Events:
        WeeklyFriday:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 ? * 6 *)
            Name: !Sub '${Environment}-email-worker-no-application-weekly'
            Description: Friday 08:00 UTC — nudge workers with no applications
            Enabled: true

Outputs:
  SendEmailFunctionArn:
    Description: ARN of the generic SES sender Lambda
    Value: !GetAtt SendEmailFunction.Arn

  AppUpdateBroadcastFunctionArn:
    Description: ARN of the app-update broadcast Lambda
    Value: !GetAtt AppUpdateBroadcastFunction.Arn
