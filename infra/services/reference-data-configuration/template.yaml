AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Get Reference Data Lambda - Retrieves job roles, contracts, categories, and employment types

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name (dev, staging, prod)
    AllowedValues:
      - dev
      - dev-be
      - staging
      - prod
  
  JobRolesTableName:
    Type: String
    Default: dev-JobRoles
    Description: Name of the JobRoles DynamoDB table
  
  ContractsTableName:
    Type: String
    Default: dev-Contracts
    Description: Name of the Contracts DynamoDB table
  
  JobCategoriesTableName:
    Type: String
    Default: dev-JobCategories
    Description: Name of the JobCategories DynamoDB table
  
  EmploymentTypesTableName:
    Type: String
    Default: dev-EmploymentTypes
    Description: Name of the EmploymentTypes DynamoDB table

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment

Resources:
  # Lambda Function
  GetReferenceDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-get-reference-data
      CodeUri: ../../../src/lambdas/services/reference-data-configuration/get-reference-data/
      Handler: app.lambda_handler
      Description: Retrieves reference data for job listings (roles, contracts, categories, employment types)
      Environment:
        Variables:
          JOB_ROLES_TABLE_NAME: !Ref JobRolesTableName
          CONTRACTS_TABLE_NAME: !Ref ContractsTableName
          JOB_CATEGORIES_TABLE_NAME: !Ref JobCategoriesTableName
          EMPLOYMENT_TYPES_TABLE_NAME: !Ref EmploymentTypesTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobRolesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref ContractsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref JobCategoriesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref EmploymentTypesTableName
      Events:
        GetReferenceDataApiLegacy:
          Type: Api
          Properties:
            Path: /reference-data
            Method: GET
            RestApiId: !Ref ReferenceDataApi
        GetReferenceDataApi:
          Type: Api
          Properties:
            Path: /v1/reference-data
            Method: GET
            RestApiId: !Ref ReferenceDataApi
      Tags:
        Name: !Sub ${Environment}-get-reference-data
        Environment: !Ref Environment
        Service: reference-data

  # API Gateway
  ReferenceDataApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${Environment}-reference-data-api
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET, OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
        MaxAge: "'3600'"
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: Reference Data API
          description: API for retrieving reference data (job roles, contracts, categories, employment types)
          version: 1.0.0
        paths:
          /reference-data:
            get:
              summary: Get reference data
              description: Retrieves reference data for job listings
              parameters:
                - name: type
                  in: query
                  description: Optional filter for specific type (jobRoles, contracts, categories, employmentTypes)
                  required: false
                  schema:
                    type: string
                    enum:
                      - jobRoles
                      - contracts
                      - categories
                      - employmentTypes
                - name: activeOnly
                  in: query
                  description: Filter only active items (default true)
                  required: false
                  schema:
                    type: boolean
                    default: true
              responses:
                '200':
                  description: Successful response
                  content:
                    application/json:
                      schema:
                        type: object
                '400':
                  description: Bad request
                '500':
                  description: Internal server error
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetReferenceDataFunction.Arn}/invocations
            options:
              summary: CORS support
              responses:
                '200':
                  description: CORS headers
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: 200
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
          /v1/reference-data:
            get:
              summary: Get reference data
              description: Retrieves reference data for job listings
              parameters:
                - name: type
                  in: query
                  description: Optional filter for specific type (jobRoles, contracts, categories, employmentTypes)
                  required: false
                  schema:
                    type: string
                    enum:
                      - jobRoles
                      - contracts
                      - categories
                      - employmentTypes
                - name: activeOnly
                  in: query
                  description: Filter only active items (default true)
                  required: false
                  schema:
                    type: boolean
                    default: true
              responses:
                '200':
                  description: Successful response
                  content:
                    application/json:
                      schema:
                        type: object
                '400':
                  description: Bad request
                '500':
                  description: Internal server error
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetReferenceDataFunction.Arn}/invocations
            options:
              summary: CORS support
              responses:
                '200':
                  description: CORS headers
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: 200
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"


  # Lambda Permission for API Gateway
  GetReferenceDataApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetReferenceDataFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ReferenceDataApi}/*/*

  # CORS: assicura header CORS anche nelle risposte di errore generate da API Gateway (es. 403, 500)
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref ReferenceDataApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref ReferenceDataApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

Outputs:
  GetReferenceDataFunctionArn:
    Description: ARN of the Get Reference Data Lambda function
    Value: !GetAtt GetReferenceDataFunction.Arn
    Export:
      Name: !Sub ${Environment}-GetReferenceDataFunctionArn

  GetReferenceDataFunctionName:
    Description: Name of the Get Reference Data Lambda function
    Value: !Ref GetReferenceDataFunction
    Export:
      Name: !Sub ${Environment}-GetReferenceDataFunctionName

  ReferenceDataApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ReferenceDataApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/reference-data
    Export:
      Name: !Sub ${Environment}-ReferenceDataApiUrl

  ReferenceDataApiId:
    Description: API Gateway ID
    Value: !Ref ReferenceDataApi
    Export:
      Name: !Sub ${Environment}-ReferenceDataApiId