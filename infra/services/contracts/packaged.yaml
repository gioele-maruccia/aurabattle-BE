AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Contracts API service for CCNL labor contracts calculations
Metadata:
  AWS::ServerlessRepo::Application:
    SemanticVersion: 1.0.0
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - dev-be
    - staging
    - prod
    Description: Environment name
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool for authorization
Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        CONTRACTS_TABLE_NAME:
          Fn::Sub: ${Environment}-Contracts
        COMPANIES_TABLE_NAME:
          Fn::Sub: ${Environment}-Companies
        LOG_LEVEL: INFO
Resources:
  ContractsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-contracts-api
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''GET,POST,PUT,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn:
              Ref: CognitoUserPoolArn
      TracingEnabled: true
    Metadata:
      SamResourceId: ContractsApi
  CalculateBasePayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-contracts-calculate-base-pay
      CodeUri: s3://beezey-prod/contracts/20260420-112409/6b3bbab5a1767b8f6fdb4290700b8773
      Handler: app.lambda_handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Contracts
      - DynamoDBReadPolicy:
          TableName:
            Fn::Sub: ${Environment}-Companies
      Events:
        CalculateBasePayLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: ContractsApi
            Path: /contracts/calculate-base-pay
            Method: POST
        CalculateBasePay:
          Type: Api
          Properties:
            RestApiId:
              Ref: ContractsApi
            Path: /v1/contracts/calculate-base-pay
            Method: POST
    Metadata:
      SamResourceId: CalculateBasePayFunction
  ContractsApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
    Metadata:
      SamResourceId: ContractsApiRole
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId:
        Ref: ContractsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault4XX
  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId:
        Ref: ContractsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault5XX
Outputs:
  ContractsApiUrl:
    Description: API Gateway endpoint URL for Contracts API
    Value:
      Fn::Sub: https://${ContractsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name:
        Fn::Sub: ${Environment}-ContractsApiUrl
  ContractsApiId:
    Description: API Gateway ID
    Value:
      Ref: ContractsApi
    Export:
      Name:
        Fn::Sub: ${Environment}-ContractsApiId
  CalculateBasePayFunctionArn:
    Description: ARN of CalculateBasePay Lambda function
    Value:
      Fn::GetAtt:
      - CalculateBasePayFunction
      - Arn
    Export:
      Name:
        Fn::Sub: ${Environment}-CalculateBasePayFunctionArn
