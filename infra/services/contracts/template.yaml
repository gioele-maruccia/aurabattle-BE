AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Contracts API service for CCNL labor contracts calculations

Metadata:
  AWS::ServerlessRepo::Application:
    SemanticVersion: 1.0.0

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - staging
      - prod
    Description: Environment name

  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool for authorization

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        CONTRACTS_TABLE_NAME: !Sub '${Environment}-Contracts'
        COMPANIES_TABLE_NAME: !Sub '${Environment}-Companies'
        LOG_LEVEL: INFO

Resources:
  # ============================================
  # API GATEWAY
  # ============================================
  ContractsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${Environment}-contracts-api'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
      TracingEnabled: true

  # ============================================
  # LAMBDA FUNCTIONS
  # ============================================
  
  # Calculate Base Pay
  CalculateBasePayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Environment}-contracts-calculate-base-pay'
      CodeUri: ../../../src/lambdas/services/contracts/calculate-base-pay/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub '${Environment}-Contracts'
        - DynamoDBReadPolicy:
            TableName: !Sub '${Environment}-Companies'
      Events:
        CalculateBasePayLegacy:
          Type: Api
          Properties:
            RestApiId: !Ref ContractsApi
            Path: /contracts/calculate-base-pay
            Method: POST
        CalculateBasePay:
          Type: Api
          Properties:
            RestApiId: !Ref ContractsApi
            Path: /v1/contracts/calculate-base-pay
            Method: POST

  # ============================================
  # IAM ROLES & POLICIES
  # ============================================
  ContractsApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # CORS: assicura header CORS anche nelle risposte di errore generate da API Gateway (es. 401, 403, 500)
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref ContractsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref ContractsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

Outputs:
  ContractsApiUrl:
    Description: API Gateway endpoint URL for Contracts API
    Value: !Sub 'https://${ContractsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${Environment}-ContractsApiUrl'

  ContractsApiId:
    Description: API Gateway ID
    Value: !Ref ContractsApi
    Export:
      Name: !Sub '${Environment}-ContractsApiId'

  CalculateBasePayFunctionArn:
    Description: ARN of CalculateBasePay Lambda function
    Value: !GetAtt CalculateBasePayFunction.Arn
    Export:
      Name: !Sub '${Environment}-CalculateBasePayFunctionArn'