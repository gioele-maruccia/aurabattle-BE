AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Matchups API - Sfide dentro una battle, voto e scoring
Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
    - dev-aurabattle
    - prod-aurabattle
  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN
  BattlesTableName:
    Type: String
    Description: DynamoDB Battles table name
  MatchupsTableName:
    Type: String
    Description: DynamoDB Matchups table name
  MatchupVotesTableName:
    Type: String
    Description: DynamoDB Matchup Votes table name
  UserProfilesTableName:
    Type: String
    Description: DynamoDB User Profiles table name
  MatchupConnectionsTableName:
    Type: String
    Description: DynamoDB table for WebSocket connections (live vote updates)
Globals:
  Function:
    Runtime: python3.10
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT:
          Ref: Environment
        BATTLES_TABLE:
          Ref: BattlesTableName
        MATCHUPS_TABLE:
          Ref: MatchupsTableName
        USER_PROFILES_TABLE:
          Ref: UserProfilesTableName
Resources:
  MatchupsWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${Environment}-matchups-websocket-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
    Metadata:
      SamResourceId: MatchupsWebSocketApi
  MatchupsWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: MatchupsWebSocketApi
      StageName:
        Ref: Environment
      AutoDeploy: true
    Metadata:
      SamResourceId: MatchupsWebSocketStage
  OnConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-ws-connect
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/3b225a787f55dbdbc2835832c3f5cfc6
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_CONNECTIONS_TABLE:
            Ref: MatchupConnectionsTableName
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MatchupConnectionsTableName
    Metadata:
      SamResourceId: OnConnectFunction
  OnDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-ws-disconnect
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/b66564b1755c20118e062015f1ef34f2
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_CONNECTIONS_TABLE:
            Ref: MatchupConnectionsTableName
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MatchupConnectionsTableName
    Metadata:
      SamResourceId: OnDisconnectFunction
  OnConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: MatchupsWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnConnectFunction.Arn}/invocations
    Metadata:
      SamResourceId: OnConnectIntegration
  OnConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: MatchupsWebSocketApi
      RouteKey: $connect
      Target:
        Fn::Sub: integrations/${OnConnectIntegration}
    Metadata:
      SamResourceId: OnConnectRoute
  OnConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: OnConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatchupsWebSocketApi}/*/*
    Metadata:
      SamResourceId: OnConnectPermission
  OnDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: MatchupsWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnDisconnectFunction.Arn}/invocations
    Metadata:
      SamResourceId: OnDisconnectIntegration
  OnDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: MatchupsWebSocketApi
      RouteKey: $disconnect
      Target:
        Fn::Sub: integrations/${OnDisconnectIntegration}
    Metadata:
      SamResourceId: OnDisconnectRoute
  OnDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: OnDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatchupsWebSocketApi}/*/*
    Metadata:
      SamResourceId: OnDisconnectPermission
  MatchupsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: Environment
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn:
              Ref: UserPoolArn
      Cors:
        AllowMethods: '''*'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
    Metadata:
      SamResourceId: MatchupsApi
  CreateMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-create
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/d5dec9beeeb80812b1ff90f415fef52a
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MatchupsTableName
      - DynamoDBReadPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId:
              Ref: MatchupsApi
            Path: /v1/battles/{battleId}/matchups
            Method: POST
    Metadata:
      SamResourceId: CreateMatchupFunction
  ListMatchupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-list
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/c26a38013a2dc2aeda87371d50ad8ac9
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: MatchupsTableName
      - DynamoDBReadPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: MatchupsApi
            Path: /v1/battles/{battleId}/matchups
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: ListMatchupsFunction
  GetMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-get
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/88e7dc1343604677a1259a796553bc14
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: MatchupsTableName
      - DynamoDBReadPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: MatchupsApi
            Path: /v1/matchups/{matchupId}
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: GetMatchupFunction
  UpdateMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-update
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/3736c4b8f5ede68ee5181e2415d33885
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MatchupsTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: UserProfilesTableName
      Events:
        Put:
          Type: Api
          Properties:
            RestApiId:
              Ref: MatchupsApi
            Path: /v1/matchups/{matchupId}
            Method: PUT
    Metadata:
      SamResourceId: UpdateMatchupFunction
  DeleteMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-delete
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/c974cb6d63414cec63cfe92d0d506420
      Handler: app.handler
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: BattlesTableName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MatchupsTableName
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId:
              Ref: MatchupsApi
            Path: /v1/matchups/{matchupId}
            Method: DELETE
    Metadata:
      SamResourceId: DeleteMatchupFunction
  CastVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-cast-vote
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/8e0f23d5650a6bdeb775e7234e0aee54
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_VOTES_TABLE:
            Ref: MatchupVotesTableName
          MATCHUP_CONNECTIONS_TABLE:
            Ref: MatchupConnectionsTableName
          WEBSOCKET_API_ENDPOINT:
            Fn::Sub: https://${MatchupsWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: MatchupsTableName
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:UpdateItem
          Resource:
            Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MatchupsTableName}
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MatchupVotesTableName
      - DynamoDBReadPolicy:
          TableName:
            Ref: MatchupConnectionsTableName
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:DeleteItem
          Resource:
            Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MatchupConnectionsTableName}
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
            Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatchupsWebSocketApi}/${Environment}/POST/@connections/*
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId:
              Ref: MatchupsApi
            Path: /v1/matchups/{matchupId}/vote
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: CastVoteFunction
  GetVotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-matchups-get-votes
      CodeUri: s3://aurabattle-prod-artifacts/matchups-prod-aurabattle/20261013-115130/95d7fee85ba97f356e14b321abea4c5d
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_VOTES_TABLE:
            Ref: MatchupVotesTableName
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: MatchupsTableName
      - DynamoDBReadPolicy:
          TableName:
            Ref: MatchupVotesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId:
              Ref: MatchupsApi
            Path: /v1/matchups/{matchupId}/votes
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: GetVotesFunction
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId:
        Ref: MatchupsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault4XX
  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId:
        Ref: MatchupsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault5XX
Outputs:
  ApiEndpoint:
    Value:
      Fn::Sub: https://${MatchupsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ApiId:
    Value:
      Ref: MatchupsApi
  WebSocketEndpoint:
    Description: Endpoint WebSocket per il live dei voti (wss://.../{env}?matchupId={id})
    Value:
      Fn::Sub: wss://${MatchupsWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
