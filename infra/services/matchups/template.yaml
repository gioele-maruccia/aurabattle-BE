AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Matchups API - Sfide dentro una battle, voto e scoring

Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
      - dev-aurabattle
      - prod-aurabattle

  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN

  BattlesTableName:
    Type: String
    Description: DynamoDB Battles table name

  MatchupsTableName:
    Type: String
    Description: DynamoDB Matchups table name

  MatchupVotesTableName:
    Type: String
    Description: DynamoDB Matchup Votes table name

  UserProfilesTableName:
    Type: String
    Description: DynamoDB User Profiles table name

  MatchupConnectionsTableName:
    Type: String
    Description: DynamoDB table for WebSocket connections (live vote updates)

Globals:
  Function:
    Runtime: python3.10
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        BATTLES_TABLE: !Ref BattlesTableName
        MATCHUPS_TABLE: !Ref MatchupsTableName
        USER_PROFILES_TABLE: !Ref UserProfilesTableName
        USER_BLOCKS_TABLE: !Sub ${Environment}-UserBlocks

Resources:
  # ============================================================
  # WEBSOCKET API GATEWAY - live dei voti
  # Il client si connette con wss://.../{env}?matchupId={id} e riceve un
  # messaggio {action: "vote_update", matchup_id, votes_a, votes_b} ogni
  # volta che POST /matchups/{id}/vote viene chiamato con successo.
  # Riceve anche {action: "matchup_update", matchup_id, status, winner,
  # votes_a, votes_b} quando set-battle-live / set-battle-closed (stack
  # battles) o update-matchup (host) aprono o chiudono il matchup.
  # ============================================================
  MatchupsWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${Environment}-matchups-websocket-api'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  MatchupsWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref MatchupsWebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true

  OnConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-ws-connect
      CodeUri: ../../../src/lambdas/services/matchups/on-connect/
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_CONNECTIONS_TABLE: !Ref MatchupConnectionsTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupConnectionsTableName

  OnDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-ws-disconnect
      CodeUri: ../../../src/lambdas/services/matchups/on-disconnect/
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_CONNECTIONS_TABLE: !Ref MatchupConnectionsTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupConnectionsTableName

  OnConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MatchupsWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnConnectFunction.Arn}/invocations'

  OnConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MatchupsWebSocketApi
      RouteKey: $connect
      Target: !Sub 'integrations/${OnConnectIntegration}'

  OnConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OnConnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatchupsWebSocketApi}/*/*'

  OnDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MatchupsWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OnDisconnectFunction.Arn}/invocations'

  OnDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MatchupsWebSocketApi
      RouteKey: $disconnect
      Target: !Sub 'integrations/${OnDisconnectIntegration}'

  OnDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OnDisconnectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatchupsWebSocketApi}/*/*'

  MatchupsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn: !Ref UserPoolArn
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # POST /battles/{battleId}/matchups - Crea un matchup (solo host della battle)
  CreateMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-create
      CodeUri: ../../../src/lambdas/services/matchups/create-matchup/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Sub ${Environment}-UserBlocks
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref MatchupsApi
            Path: /v1/battles/{battleId}/matchups
            Method: POST

  # GET /battles/{battleId}/matchups - Lista i matchup di una battle (no auth)
  ListMatchupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-list
      CodeUri: ../../../src/lambdas/services/matchups/list-matchups/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchupsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref MatchupsApi
            Path: /v1/battles/{battleId}/matchups
            Method: GET
            Auth:
              Authorizer: NONE

  # GET /matchups/{matchupId} - Dettaglio matchup (no auth)
  GetMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-get
      CodeUri: ../../../src/lambdas/services/matchups/get-matchup/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchupsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref MatchupsApi
            Path: /v1/matchups/{matchupId}
            Method: GET
            Auth:
              Authorizer: NONE

  # PUT /matchups/{matchupId} - Aggiorna matchup (solo host della battle); calcola il winner alla chiusura
  # e manda matchup_update ai client WebSocket a ogni cambio di stato
  UpdateMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-update
      CodeUri: ../../../src/lambdas/services/matchups/update-matchup/
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_CONNECTIONS_TABLE: !Ref MatchupConnectionsTableName
          WEBSOCKET_API_ENDPOINT: !Sub 'https://${MatchupsWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupsTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref MatchupConnectionsTableName
        - DynamoDBReadPolicy:
            TableName: !Sub ${Environment}-UserBlocks
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MatchupConnectionsTableName}'
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatchupsWebSocketApi}/${Environment}/POST/@connections/*'
      Events:
        Put:
          Type: Api
          Properties:
            RestApiId: !Ref MatchupsApi
            Path: /v1/matchups/{matchupId}
            Method: PUT

  # DELETE /matchups/{matchupId} - Elimina matchup (solo host della battle)
  DeleteMatchupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-delete
      CodeUri: ../../../src/lambdas/services/matchups/delete-matchup/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BattlesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupsTableName
      Events:
        Delete:
          Type: Api
          Properties:
            RestApiId: !Ref MatchupsApi
            Path: /v1/matchups/{matchupId}
            Method: DELETE

  # POST /matchups/{matchupId}/vote - Vota side A/B (pubblico: voter_id nel body)
  CastVoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-cast-vote
      CodeUri: ../../../src/lambdas/services/matchups/cast-vote/
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_VOTES_TABLE: !Ref MatchupVotesTableName
          MATCHUP_CONNECTIONS_TABLE: !Ref MatchupConnectionsTableName
          WEBSOCKET_API_ENDPOINT: !Sub 'https://${MatchupsWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchupsTableName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MatchupsTableName}'
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchupVotesTableName
        - DynamoDBReadPolicy:
            TableName: !Ref MatchupConnectionsTableName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MatchupConnectionsTableName}'
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MatchupsWebSocketApi}/${Environment}/POST/@connections/*'
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref MatchupsApi
            Path: /v1/matchups/{matchupId}/vote
            Method: POST
            Auth:
              Authorizer: NONE

  # GET /matchups/{matchupId}/votes - Totali + storico a bucket (no auth)
  GetVotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-matchups-get-votes
      CodeUri: ../../../src/lambdas/services/matchups/get-votes/
      Handler: app.handler
      Environment:
        Variables:
          MATCHUP_VOTES_TABLE: !Ref MatchupVotesTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchupsTableName
        - DynamoDBReadPolicy:
            TableName: !Ref MatchupVotesTableName
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref MatchupsApi
            Path: /v1/matchups/{matchupId}/votes
            Method: GET
            Auth:
              Authorizer: NONE

  # CORS su risposte di errore API Gateway
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref MatchupsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref MatchupsApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${MatchupsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  ApiId:
    Value: !Ref MatchupsApi
  WebSocketEndpoint:
    Description: Endpoint WebSocket per il live dei voti (wss://.../{env}?matchupId={id})
    Value: !Sub 'wss://${MatchupsWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
