AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda per iniziare processo upgrade profilo utente
Globals:
  Function:
    Runtime: python3.13
Parameters:
  UserPoolId:
    Type: String
    Description: ID del Cognito User Pool
  UserPoolArn:
    Type: String
    Description: ARN del Cognito User Pool
  UserProfilesTableName:
    Type: String
    Description: Nome della tabella DynamoDB UserProfiles
  Environment:
    Type: String
    Default: dev
    Description: Ambiente di deployment
Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: CognitoAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - cognito-idp:AdminUpdateUserAttributes
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminListGroupsForUser
            Resource:
              Ref: UserPoolArn
      - PolicyName: DynamoDBAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:UpdateItem
            - dynamodb:GetItem
            Resource:
              Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UserProfilesTableName}
    Metadata:
      SamResourceId: LambdaRole
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: Environment
      Cors:
        AllowMethods: '''POST,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
      Auth:
        DefaultAuthorizer: CognitoAuth
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuth:
            UserPoolArn:
              Ref: UserPoolArn
    Metadata:
      SamResourceId: Api
  UpgradeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-user-initiate-upgrade
      Runtime: python3.13
      CodeUri: s3://beezey-prod/profile-upgrade-request/20260420-112915/f23417ef8dfc67799f329c58b39e8193
      Handler: app.lambda_handler
      Role:
        Fn::GetAtt:
        - LambdaRole
        - Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          USER_POOL_ID:
            Ref: UserPoolId
          USER_PROFILES_TABLE:
            Ref: UserProfilesTableName
          ENVIRONMENT:
            Ref: Environment
      Events:
        PostApiLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /initiate-upgrade
            Method: POST
            Auth:
              Authorizer: CognitoAuth
        PostApi:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /v1/initiate-upgrade
            Method: POST
            Auth:
              Authorizer: CognitoAuth
    Metadata:
      SamResourceId: UpgradeFunction
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId:
        Ref: Api
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault4XX
  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId:
        Ref: Api
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'''
    Metadata:
      SamResourceId: GatewayResponseDefault5XX
Outputs:
  ApiEndpoint:
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/initiate-upgrade
  FunctionName:
    Value:
      Ref: UpgradeFunction
