AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  aurabattle-backoffice
  SAM Template for backoffice APIs (user lookup, super admin moderation)

Globals:
  Function:
    Runtime: python3.10
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        REGION: !Ref AWS::Region
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId

  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"  # In produzione: specifica i domini del backoffice

Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
      - dev-aurabattle
      - prod-aurabattle
    Description: Environment name
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID containing user profiles

Resources:
  # ---------------------------
  # API Gateway con autorizzatore Cognito
  # ---------------------------
  BackofficeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${Environment}-backoffice-api"
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
            Header: Authorization
            IdentitySource: method.request.header.Authorization
            AuthType: COGNITO_USER_POOLS
        AddDefaultAuthorizerToCorsPreflight: false

  # ---------------------------
  # LAMBDA: search-users
  # ---------------------------
  SearchUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-backoffice-search-users"
      CodeUri: ../../../src/lambdas/services/backoffice/backoffice-search-users/
      Handler: app.lambda_handler
      Description: Search users in Cognito for backoffice
      Events:
        SearchUsers:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/users/search
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        SearchUsersOptions:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/users/search
            Method: OPTIONS
            Auth:
              Authorizer: NONE
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: CognitoSearchUsers
              Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
              Resource:
                - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'

  # ---------------------------
  # LAMBDA: backoffice-admin (super admin)
  # Un'unica Lambda con router interno per tutte le rotte /v1/admin/*: il
  # controllo del gruppo Cognito `superadmins` sta in un solo punto.
  # L'authorizer accetta qualunque utente del pool: e' la Lambda a
  # rispondere 403 a chi non e' super admin.
  # ---------------------------
  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Environment}-backoffice-admin"
      CodeUri: ../../../src/lambdas/services/backoffice/backoffice-admin/
      Handler: app.lambda_handler
      Description: Super admin moderation API (reports, users, deletion requests)
      Environment:
        Variables:
          REPORTS_TABLE: !Sub "${Environment}-Reports"
          USER_BLOCKS_TABLE: !Sub "${Environment}-UserBlocks"
          MODERATION_LOG_TABLE: !Sub "${Environment}-ModerationLog"
          BATTLES_TABLE: !Sub "${Environment}-Battles"
          MATCHUPS_TABLE: !Sub "${Environment}-Matchups"
          USER_PROFILES_TABLE: !Sub "${Environment}-UserProfiles"
          USERNAMES_TABLE: !Sub "${Environment}-Usernames"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${Environment}-Reports"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${Environment}-ModerationLog"
        - DynamoDBReadPolicy:
            TableName: !Sub "${Environment}-UserBlocks"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${Environment}-Battles"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${Environment}-Matchups"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${Environment}-UserProfiles"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${Environment}-Usernames"
        - Version: '2012-10-17'
          Statement:
            - Sid: CognitoModeration
              Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminUserGlobalSignOut
              Resource:
                - !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
      Events:
        ListReports:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/reports
            Method: GET
        GetReportGroup:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/reports/{targetType}/{targetId}
            Method: GET
        ResolveReports:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/reports/{targetType}/{targetId}/resolve
            Method: POST
        RestoreContent:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/content/{targetType}/{targetId}/restore
            Method: POST
        SearchAdminUsers:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/users
            Method: GET
        GetAdminUser:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/users/{userId}
            Method: GET
        SuspendUser:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/users/{userId}/suspend
            Method: POST
        ReinstateUser:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/users/{userId}/reinstate
            Method: POST
        ListDeletionRequests:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/deletion-requests
            Method: GET
        CompleteDeletion:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/deletion-requests/{userId}/complete
            Method: POST
        Stats:
          Type: Api
          Properties:
            RestApiId: !Ref BackofficeApi
            Path: /v1/admin/stats
            Method: GET

  # CORS anche sulle risposte di errore generate da API Gateway (401/403/5xx),
  # altrimenti il backoffice web non riesce a leggerle.
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref BackofficeApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref BackofficeApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # ---------------------------
  # CloudWatch Alarms
  # ---------------------------
  ApiGatewayErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Environment}-backoffice-api-errors"
      AlarmDescription: High error rate on backoffice API
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Sub "${Environment}-backoffice-api"

Outputs:
  BackofficeApiEndpoint:
    Description: API Gateway endpoint URL for backoffice
    Value: !Sub "https://${BackofficeApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${Environment}-BackofficeApiEndpoint"

  SearchUsersFunctionName:
    Description: Search Users Lambda Function Name
    Value: !Ref SearchUsersFunction
    Export:
      Name: !Sub "${Environment}-SearchUsersFunction"

  ApiEndpoints:
    Description: All API endpoints for easy reference
    Value: !Sub |
      Base URL: https://${BackofficeApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

      Endpoints:
      - GET /v1/users/search (search users)
      - /v1/admin/* (super admin: reports, users, deletion requests, stats)
    Export:
      Name: !Sub "${Environment}-ApiEndpoints"
