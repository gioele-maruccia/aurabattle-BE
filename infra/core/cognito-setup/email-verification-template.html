<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferma il tuo account beebusy</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#0a0e1a;padding:32px 40px;text-align:center;">
              <h1 style="color:#ffffff;margin:0;font-size:28px;font-weight:700;letter-spacing:2px;">beebusy</h1>
              <div style="width:40px;height:3px;background-color:#f5b731;margin:10px auto 0;"></div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 32px;">
              <h2 style="color:#0a0e1a;margin:0 0 16px;font-size:22px;font-weight:700;">Conferma il tuo account</h2>
              <p style="color:#555555;margin:0 0 28px;font-size:15px;line-height:1.6;">
                Benvenuto su beebusy! Usa il codice qui sotto per verificare il tuo indirizzo email e attivare il tuo account.
              </p>

              <!-- Code box -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-bottom:28px;">
                <tr>
                  <td align="center">
                    <div style="display:inline-block;background-color:#eff6ff;border:2px solid #2563eb;border-radius:8px;padding:20px 48px;">
                      <span style="font-size:36px;font-weight:700;letter-spacing:10px;color:#2563eb;font-family:monospace;">{####}</span>
                    </div>
                  </td>
                </tr>
              </table>

              <p style="color:#888888;margin:0 0 8px;font-size:13px;text-align:center;">Il codice scade tra <strong>24 ore</strong>.</p>
              <p style="color:#888888;margin:0;font-size:13px;text-align:center;">Se non hai creato un account su beebusy, ignora questa email.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f8f8fc;padding:20px 40px;text-align:center;border-top:1px solid #eeeeee;">
              <p style="color:#aaaaaa;margin:0;font-size:12px;">&copy; 2026 beebusy &mdash; Tutti i diritti riservati</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
