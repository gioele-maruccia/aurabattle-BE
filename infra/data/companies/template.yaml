AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Companies DynamoDB table and S3 storage for Beezey seasonal job platform

Conditions:
  IsBucketNameProvided: !Not [!Equals [!Ref CompaniesAssetsBucketName, ""]]
  IsProduction: !Equals [!Ref Environment, prod]

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - prod
    Description: Environment name

  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode (PAY_PER_REQUEST recommended for MVP)

  CompaniesAssetsBucketName:
    Type: String
    Description: S3 bucket name for company assets (auto-generated if empty)
    Default: ""
    AllowedPattern: "^[a-z0-9.-]*$"
    ConstraintDescription: Must be a valid S3 bucket name or empty for auto-generation


Resources:
  # ============================================
  # DYNAMODB TABLE
  # ============================================
  CompaniesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Companies'
      BillingMode: !Ref BillingMode
      
      # Backup automatico abilitato
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      # Stream per trigger (es: aggiornamento rating quando arriva recensione)
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      
      # Definizione attributi usati nelle chiavi
      AttributeDefinitions:
        # Primary Key: userId da Cognito (sub)
        - AttributeName: userId
          AttributeType: S
        
        # GSI per cercare company per companyId
        - AttributeName: companyId
          AttributeType: S
      
      # Primary Key
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      
      # Global Secondary Index per query alternative
      GlobalSecondaryIndexes:
        # Cercare una company tramite companyId invece di userId
        # Utile quando hai solo il companyId (es: da JobListing o Review)
        - IndexName: companyId-index
          KeySchema:
            - AttributeName: companyId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      
      # Protezione cancellazione accidentale
      DeletionProtectionEnabled: !If
        - IsProduction
        - true
        - false
      
      # Tags per organizzazione
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey
        - Key: Domain
          Value: Companies
        - Key: ManagedBy
          Value: SAM

  # ============================================
  # S3 BUCKET FOR COMPANY ASSETS
  # ============================================
  CompaniesAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If 
        - IsBucketNameProvided
        - !Ref CompaniesAssetsBucketName
        - !Sub "${AWS::StackName}-assets-${AWS::AccountId}"
      
      # Public read access for images
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      
      # CORS configuration for direct uploads from browser/app
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3000
            ExposedHeaders:
              - ETag
      
      # Lifecycle rules for optimization
      LifecycleConfiguration:
        Rules:
          # Move old images to Infrequent Access after 90 days
          - Id: MoveToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
          
          # Delete incomplete multipart uploads after 7 days
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      
      # Versioning disabled for MVP (can enable later)
      VersioningConfiguration:
        Status: !If
          - IsProduction
          - Enabled
          - Suspended
      
      # Server-side encryption
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      
      # Tags
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey
        - Key: Domain
          Value: Companies
        - Key: ManagedBy
          Value: SAM

  # Bucket Policy for public read access to company images
  CompaniesAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CompaniesAssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Allow public read access to company images
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource: !Sub '${CompaniesAssetsBucket.Arn}/companies/*'

Outputs:
  # DynamoDB Outputs
  CompaniesTableName:
    Description: Nome della tabella Companies
    Value: !Ref CompaniesTable
    Export:
      Name: !Sub '${Environment}-CompaniesTableName'

  CompaniesTableArn:
    Description: ARN della tabella Companies
    Value: !GetAtt CompaniesTable.Arn
    Export:
      Name: !Sub '${Environment}-CompaniesTableArn'

  CompaniesTableStreamArn:
    Description: ARN dello stream DynamoDB per trigger
    Value: !GetAtt CompaniesTable.StreamArn
    Export:
      Name: !Sub '${Environment}-CompaniesTableStreamArn'

  CompaniesGSIName:
    Description: Nome del Global Secondary Index companyId
    Value: companyId-index
    Export:
      Name: !Sub '${Environment}-CompaniesGSIName'

  # S3 Outputs
  CompaniesAssetsBucketName:
    Description: Nome del bucket S3 per assets companies
    Value: !Ref CompaniesAssetsBucket
    Export:
      Name: !Ref CompaniesAssetsBucketName

  CompaniesAssetsBucketArn:
    Description: ARN del bucket S3 per assets companies
    Value: !GetAtt CompaniesAssetsBucket.Arn
    Export:
      Name: !Sub '${Environment}-CompaniesAssetsBucketArn'

  CompaniesAssetsBucketDomainName:
    Description: Domain name del bucket S3
    Value: !GetAtt CompaniesAssetsBucket.DomainName
    Export:
      Name: !Sub '${Environment}-CompaniesAssetsBucketDomainName'

  CompaniesAssetsBucketUrl:
    Description: URL pubblico del bucket S3
    Value: !Sub 'https://${CompaniesAssetsBucket}.s3.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${Environment}-CompaniesAssetsBucketUrl'