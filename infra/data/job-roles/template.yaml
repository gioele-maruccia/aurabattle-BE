AWSTemplateFormatVersion: '2010-09-09'
Description: JobRoles table with ATECO code mapping

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - prod
    Description: Environment name
  
  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode

Resources:
  JobRolesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-JobRoles'
      BillingMode: !Ref BillingMode
      AttributeDefinitions:
        - AttributeName: roleId
          AttributeType: S
        - AttributeName: atecoCode
          AttributeType: S
        - AttributeName: roleName
          AttributeType: S
      KeySchema:
        - AttributeName: roleId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: atecoCode-index
          KeySchema:
            - AttributeName: atecoCode
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: roleName-index
          KeySchema:
            - AttributeName: roleName
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey
        - Key: Service
          Value: JobRoles

# Struttura del record:
# {
#   "roleId": "ROLE#56.10.11#001",                  # PK - formato: ROLE#{atecoCode}#{sequenziale}
#   "atecoCode": "56.10.11",                         # GSI - codice ATECO (es: 56.10.11 - Ristoranti)
#   "atecoDescription": "Ristoranti e attività di ristorazione mobile",
#   "roleName": "Cameriere",                         # GSI - nome della mansione
#   "roleDescription": "Servizio ai tavoli, accoglienza clienti, gestione ordini",
#   "category": "hospitality",                       # categoria generale
#   "skillsRequired": [                              # competenze richieste
#     "Servizio al tavolo",
#     "Gestione POS",
#     "Conoscenza menu"
#   ],
#   "contractTypes": [                               # tipi di contratto applicabili
#     "CCNL#turismo#paragrafo_1#Qa",
#     "CCNL#turismo#paragrafo_1#Qb"
#   ],
#   "isActive": true,
#   "createdAt": "2024-01-01T00:00:00Z",
#   "updatedAt": "2024-01-01T00:00:00Z"
# }

# Esempi di codici ATECO comuni:
# - 56.10.11: Ristoranti e attività di ristorazione mobile
# - 56.10.12: Attività di ristorazione connesse alle aziende agricole
# - 56.21.00: Catering per eventi, banqueting
# - 56.30.00: Bar e altri esercizi simili senza cucina
# - 55.10.00: Alberghi
# - 55.20.10: Villaggi turistici
# - 55.20.51: Affittacamere per brevi soggiorni, case ed appartamenti per vacanze, bed and breakfast