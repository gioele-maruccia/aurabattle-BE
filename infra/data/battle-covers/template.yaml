AWSTemplateFormatVersion: '2010-09-09'
Description: Battle Covers - S3 bucket for custom battle cover uploads

Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
      - dev-aurabattle
      - prod-aurabattle

Resources:
  BattleCoversBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Environment}-battle-covers'
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAbandonedUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: aurabattle

  BattleCoversBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BattleCoversBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadCoversOnly
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${BattleCoversBucket.Arn}/covers/*'

Outputs:
  BucketName:
    Value: !Ref BattleCoversBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Value: !GetAtt BattleCoversBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'
