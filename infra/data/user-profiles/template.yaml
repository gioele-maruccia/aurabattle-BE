AWSTemplateFormatVersion: '2010-09-09'
Description: User Profiles Data - Simple DynamoDB table

Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
      - dev-aurabattle
      - prod-aurabattle

Conditions:
  IsProduction: !Equals [!Ref Environment, prod-aurabattle]

Resources:
  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-UserProfiles'
      BillingMode: PAY_PER_REQUEST
      
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: search_bucket
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: display_name_lower
          AttributeType: S
        - AttributeName: family_name_lower
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

        # Username univoco (lowercase): chiave di ricerca a priorita' massima.
        # L'unicita' NON e' data da questo indice ma dalla tabella Usernames.
        - IndexName: search_bucket-username-index
          KeySchema:
            - AttributeName: search_bucket
              KeyType: HASH
            - AttributeName: username
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - display_name
              - avatar_url

        # search_bucket e' sempre "ALL": indice globale per il prefix-match su
        # display_name (picker partecipanti). Scelta semplice per l'MVP: tutte
        # le query cadono sulla stessa partizione, adeguato fino a qualche
        # migliaio di utenti attivi; da rivedere (es. sharding per iniziale)
        # se la base utenti cresce molto.
        - IndexName: search_bucket-display_name_lower-index
          KeySchema:
            - AttributeName: search_bucket
              KeyType: HASH
            - AttributeName: display_name_lower
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - display_name
              - avatar_url

        # Stesso pattern, ma sul cognome (profile.family_name e' annidato,
        # quindi non indicizzabile direttamente: lo duplichiamo qui top-level).
        - IndexName: search_bucket-family_name_lower-index
          KeySchema:
            - AttributeName: search_bucket
              KeyType: HASH
            - AttributeName: family_name_lower
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - display_name
              - avatar_url

      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: aurabattle

Outputs:
  TableName:
    Value: !Ref UserProfilesTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'
  
  TableArn:
    Value: !GetAtt UserProfilesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'
  
  StreamArn:
    Value: !GetAtt UserProfilesTable.StreamArn
    Export:
      Name: !Sub '${AWS::StackName}-StreamArn'