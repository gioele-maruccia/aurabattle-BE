AWSTemplateFormatVersion: '2010-09-09'
Description: User Profiles Data - Simple DynamoDB table

Parameters:
  Environment:
    Type: String
    Default: dev-aurabattle
    AllowedValues:
      - dev-aurabattle
      - prod-aurabattle

Conditions:
  IsProduction: !Equals [!Ref Environment, prod-aurabattle]

Resources:
  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-UserProfiles'
      BillingMode: PAY_PER_REQUEST
      
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]
      
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: aurabattle

Outputs:
  TableName:
    Value: !Ref UserProfilesTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'
  
  TableArn:
    Value: !GetAtt UserProfilesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'
  
  StreamArn:
    Value: !GetAtt UserProfilesTable.StreamArn
    Export:
      Name: !Sub '${AWS::StackName}-StreamArn'