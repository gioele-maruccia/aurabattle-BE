AWSTemplateFormatVersion: '2010-09-09'
Description: EmploymentTypes table for predefined employment types

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - prod
    Description: Environment name
  
  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode

Resources:
  EmploymentTypesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-EmploymentTypes'
      BillingMode: !Ref BillingMode
      AttributeDefinitions:
        - AttributeName: typeId
          AttributeType: S
      KeySchema:
        - AttributeName: typeId
          KeyType: HASH
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey
        - Key: Service
          Value: EmploymentTypes

# Struttura del record:
# {
#   "typeId": "part_time",                           # PK - identificativo tipo
#   "typeName": "Part-time",                         # nome visualizzato
#   "typeDescription": "Contratto di lavoro a tempo parziale",
#   "hoursPerWeekRange": {                           # range ore settimanali
#     "min": 1,
#     "max": 36
#   },
#   "contractDuration": "determinato_indeterminato", # durata contratto possibile
#   "icon": "clock",                                 # icona UI
#   "sortOrder": 1,                                  # ordine di visualizzazione
#   "isActive": true,
#   "createdAt": "2024-01-01T00:00:00Z",
#   "updatedAt": "2024-01-01T00:00:00Z"
# }

# Tipi di impiego predefiniti da inserire:
# - full_time: Full-time (40 ore/settimana)
# - part_time: Part-time (fino a 36 ore/settimana)
# - seasonal: Stagionale (contratto determinato per stagione)
# - on_call: A chiamata (prestazione occasionale)
# - internship: Stage/Tirocinio
# - apprenticeship: Apprendistato
# - temporary: Temporaneo (sostituzione, picchi)
# - weekend_only: Solo weekend
# - summer_job: Lavoro estivo
# - winter_season: Stagione invernale