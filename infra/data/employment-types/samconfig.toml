version = 0.1

# ============================================
# DEFAULT CONFIGURATION (DEV)
# ============================================

[default]

[default.build.parameters]
use_container = false
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "dev-employment-types-data"
template_file = "infra/data/employment-types/template.yaml"
resolve_s3 = false
s3_prefix = "employment-types"
s3_bucket = "beezey-dev"
region = "eu-south-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
parameter_overrides = [
    "Environment=dev",
	"BillingMode=PAY_PER_REQUEST"
]

