AWSTemplateFormatVersion: '2010-09-09'
Description: User Documents Infrastructure - DynamoDB, S3, and KMS

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - prod
    Description: Environment name

Resources:
  #################################
  # KMS Key for encryption
  #################################
  DocumentsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for ${Environment} user documents encryption"
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: '*'
          - Sid: Allow services to use the key
            Effect: Allow
            Principal:
              Service: 
                - lambda.amazonaws.com
                - s3.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey

  DocumentsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/beezey-${Environment}-user-documents"
      TargetKeyId: !Ref DocumentsKMSKey

  #################################
  # S3 Bucket
  #################################
  UserDocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "beezey-${Environment}-user-documents"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DocumentsKMSKey.Arn
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteQuarantineAfter30Days
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 30
          - Id: TransitionOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey

#################################
  # DynamoDB Table
  #################################
  UserDocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Environment}-UserDocuments"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk          # ← CHANGED from userId
          AttributeType: S
        - AttributeName: sk          # ← CHANGED from documentId
          AttributeType: S
        - AttributeName: uploadedAt
          AttributeType: S
      KeySchema:
        - AttributeName: pk          # ← CHANGED from userId
          KeyType: HASH
        - AttributeName: sk          # ← CHANGED from documentId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: sk-index        # ← CHANGED from documentId-index
          KeySchema:
            - AttributeName: sk
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: pk-uploadedAt-index  # ← CHANGED from userId-uploadedAt-index
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: uploadedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:       # ← ADDED (your Lambda uses ttl)
        AttributeName: ttl
        Enabled: true
      SSESpecification:              # ← ADDED for KMS encryption
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DocumentsKMSKey.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey

Outputs:
  BucketName:
    Description: User Documents S3 Bucket Name
    Value: !Ref UserDocumentsBucket
    Export:
      Name: !Sub "${Environment}-UserDocumentsBucketName"

  BucketArn:
    Description: User Documents S3 Bucket ARN
    Value: !GetAtt UserDocumentsBucket.Arn
    Export:
      Name: !Sub "${Environment}-UserDocumentsBucketArn"

  KMSKeyId:
    Description: KMS Key ID for document encryption
    Value: !Ref DocumentsKMSKey
    Export:
      Name: !Sub "${Environment}-UserDocumentsKMSKeyId"

  KMSKeyArn:
    Description: KMS Key ARN
    Value: !GetAtt DocumentsKMSKey.Arn
    Export:
      Name: !Sub "${Environment}-UserDocumentsKMSKeyArn"

  TableName:
    Description: User Documents Table Name
    Value: !Ref UserDocumentsTable
    Export:
      Name: !Sub "${Environment}-UserDocumentsTableName"

  TableArn:
    Description: User Documents Table ARN
    Value: !GetAtt UserDocumentsTable.Arn
    Export:
      Name: !Sub "${Environment}-UserDocumentsTableArn"

  TableStreamArn:
    Description: User Documents Table Stream ARN
    Value: !GetAtt UserDocumentsTable.StreamArn
    Export:
      Name: !Sub "${Environment}-UserDocumentsTableStreamArn"