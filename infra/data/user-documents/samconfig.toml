version = 0.1

[default]
[default.build.parameters]
use_container = false
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "dev-user-documents-table"
s3_prefix = "user-documents"
s3_bucket = "beezey-dev"
resolve_s3 = false
region = "eu-south-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=dev"

[dev]
[dev.build.parameters]
use_container = false
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "dev-user-documents-table"
s3_prefix = "user-documents"
s3_bucket = "beezey-dev"
resolve_s3 = false
region = "eu-south-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=dev"

[prod]
[prod.build.parameters]
use_container = false
cached = true
parallel = true

[prod.deploy.parameters]
stack_name = "user-documents-table-prod"
s3_prefix = "user-documents"
s3_bucket = "beezey-prod"
resolve_s3 = false
region = "eu-south-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=prod"
