AWSTemplateFormatVersion: '2010-09-09'
Description: Contracts (CCNL) table for labor contracts reference data

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - prod
    Description: Environment name
  
  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode

Resources:
  ContractsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Contracts'
      BillingMode: !Ref BillingMode
      AttributeDefinitions:
        - AttributeName: contractId
          AttributeType: S
        - AttributeName: ccnlType
          AttributeType: S
        - AttributeName: level
          AttributeType: S
      KeySchema:
        - AttributeName: contractId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ccnlType-level-index
          KeySchema:
            - AttributeName: ccnlType
              KeyType: HASH
            - AttributeName: level
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey
        - Key: Service
          Value: Contracts

# Struttura del record:
