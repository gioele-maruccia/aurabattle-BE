version = 0.1

# ============================================
# DEFAULT CONFIGURATION (DEV)
# ============================================

[default]

[default.build.parameters]
use_container = false
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "dev-job-listings-data"
template_file = "infra/data/job-listings/template.yaml"
resolve_s3 = false
s3_prefix = "job-listings"
s3_bucket = "beezey-dev"
region = "eu-south-1"
capabilities = "CAPABILITY_IAM CAPABILITY_AUTO_EXPAND CAPABILITY_NAMED_IAM"
parameter_overrides = [
    "Environment=dev",
	"BillingMode=PAY_PER_REQUEST"
]

