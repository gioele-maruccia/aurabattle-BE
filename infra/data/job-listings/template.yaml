AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: JobListings DynamoDB table for Beezey seasonal job platform

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - prod
    Description: Environment name

  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode (PAY_PER_REQUEST recommended for MVP)

Resources:
  # ============================================
  # DYNAMODB TABLE
  # ============================================
  JobListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-JobListings'
      BillingMode: !Ref BillingMode
      
      # Backup automatico abilitato
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      # Stream per trigger (es: notifiche quando nuovo annuncio, aggiornamento rating company)
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      
      # Definizione attributi usati nelle chiavi
      AttributeDefinitions:
        # Primary Key: listingId
        - AttributeName: listingId
          AttributeType: S
        
        # Attributi per GSI
        - AttributeName: companyId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: publishedAt
          AttributeType: S
        - AttributeName: startDate
          AttributeType: S
        - AttributeName: category
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      
      # Primary Key
      KeySchema:
        - AttributeName: listingId
          KeyType: HASH
      
      # Global Secondary Indexes
      GlobalSecondaryIndexes:
        # 🆕 NUOVO: Per recuperare TUTTI gli annunci di una company (inclusi draft, paused, closed)
        # Usa createdAt come sort key perché è sempre presente (a differenza di publishedAt)
        - IndexName: companyId-createdAt-index
          KeySchema:
            - AttributeName: companyId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per recuperare gli annunci PUBBLICATI di una company ordinati per data pubblicazione
        - IndexName: companyId-publishedAt-index
          KeySchema:
            - AttributeName: companyId
              KeyType: HASH
            - AttributeName: publishedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per ricerca annunci pubblici ordinati per data pubblicazione (feed principale)
        - IndexName: status-publishedAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: publishedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per filtro per data inizio lavoro (ricerca per periodo)
        - IndexName: status-startDate-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: startDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per filtro per categoria/settore
        - IndexName: category-publishedAt-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: publishedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      
      # Time To Live per auto-expire degli annunci scaduti (opzionale)
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      
      # Protezione cancellazione accidentale
      DeletionProtectionEnabled: !If
        - IsProduction
        - true
        - false
      
      # Tags per organizzazione
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey
        - Key: Domain
          Value: JobListings
        - Key: ManagedBy
          Value: SAM

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Outputs:
  # DynamoDB Outputs
  JobListingsTableName:
    Description: Nome della tabella JobListings
    Value: !Ref JobListingsTable
    Export:
      Name: !Sub '${Environment}-JobListingsTableName'

  JobListingsTableArn:
    Description: ARN della tabella JobListings
    Value: !GetAtt JobListingsTable.Arn
    Export:
      Name: !Sub '${Environment}-JobListingsTableArn'

  JobListingsTableStreamArn:
    Description: ARN dello stream DynamoDB per trigger
    Value: !GetAtt JobListingsTable.StreamArn
    Export:
      Name: !Sub '${Environment}-JobListingsTableStreamArn'

  JobListingsGSI0Name:
    Description: Nome del GSI companyId-createdAt (per GET /listings/my - tutti gli stati)
    Value: companyId-createdAt-index
    Export:
      Name: !Sub '${Environment}-JobListingsGSI0Name'

  JobListingsGSI1Name:
    Description: Nome del GSI companyId-publishedAt
    Value: companyId-publishedAt-index
    Export:
      Name: !Sub '${Environment}-JobListingsGSI1Name'

  JobListingsGSI2Name:
    Description: Nome del GSI status-publishedAt
    Value: status-publishedAt-index
    Export:
      Name: !Sub '${Environment}-JobListingsGSI2Name'

  JobListingsGSI3Name:
    Description: Nome del GSI status-startDate
    Value: status-startDate-index
    Export:
      Name: !Sub '${Environment}-JobListingsGSI3Name'

  JobListingsGSI4Name:
    Description: Nome del GSI category-publishedAt
    Value: category-publishedAt-index
    Export:
      Name: !Sub '${Environment}-JobListingsGSI4Name'