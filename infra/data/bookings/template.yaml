AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bookings DynamoDB table for Beezey seasonal job platform

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-be
      - staging
      - prod
    Description: Environment name

  BillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: DynamoDB billing mode (PAY_PER_REQUEST recommended for MVP)

Resources:
  # ============================================
  # DYNAMODB TABLE
  # ============================================
  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Environment}-Bookings'
      BillingMode: !Ref BillingMode
      
      # Backup automatico abilitato
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      
      # Stream per trigger (es: notifiche, aggiornamento contatori listing)
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      
      # Definizione attributi usati nelle chiavi
      AttributeDefinitions:
        # Primary Key: bookingId
        - AttributeName: bookingId
          AttributeType: S
        
        # Attributi per GSI
        - AttributeName: listingId
          AttributeType: S
        - AttributeName: workerId
          AttributeType: S
        - AttributeName: companyId
          AttributeType: S
        - AttributeName: startDate
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      
      # Primary Key
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH
      
      # Global Secondary Indexes
      GlobalSecondaryIndexes:
        # Per recuperare tutti i booking di un annuncio ordinati per data inizio
        # CRITICO: usato per calcolare overlap e disponibilità
        - IndexName: listingId-startDate-index
          KeySchema:
            - AttributeName: listingId
              KeyType: HASH
            - AttributeName: startDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per recuperare tutti i booking di un worker ordinati per data inizio
        - IndexName: workerId-startDate-index
          KeySchema:
            - AttributeName: workerId
              KeyType: HASH
            - AttributeName: startDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per recuperare tutti i booking di una company ordinati per data creazione
        # Utile per backoffice: vedere tutte le assunzioni
        - IndexName: companyId-createdAt-index
          KeySchema:
            - AttributeName: companyId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per filtrare booking per status (es: tutti i "pending" da gestire)
        - IndexName: status-createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        
        # Per recuperare booking di una company filtrati per status
        # Utile per backoffice: "mostra tutte le candidature pending"
        - IndexName: companyId-status-index
          KeySchema:
            - AttributeName: companyId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      
      # Protezione cancellazione accidentale
      DeletionProtectionEnabled: !If
        - IsProduction
        - true
        - false
      
      # Tags per organizzazione
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Beezey
        - Key: Domain
          Value: Bookings
        - Key: ManagedBy
          Value: SAM

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Outputs:
  # DynamoDB Outputs
  BookingsTableName:
    Description: Nome della tabella Bookings
    Value: !Ref BookingsTable
    Export:
      Name: !Sub '${Environment}-BookingsTableName'

  BookingsTableArn:
    Description: ARN della tabella Bookings
    Value: !GetAtt BookingsTable.Arn
    Export:
      Name: !Sub '${Environment}-BookingsTableArn'

  BookingsTableStreamArn:
    Description: ARN dello stream DynamoDB per trigger
    Value: !GetAtt BookingsTable.StreamArn
    Export:
      Name: !Sub '${Environment}-BookingsTableStreamArn'

  BookingsGSI1Name:
    Description: Nome del GSI listingId-startDate
    Value: listingId-startDate-index
    Export:
      Name: !Sub '${Environment}-BookingsGSI1Name'

  BookingsGSI2Name:
    Description: Nome del GSI workerId-startDate
    Value: workerId-startDate-index
    Export:
      Name: !Sub '${Environment}-BookingsGSI2Name'

  BookingsGSI3Name:
    Description: Nome del GSI companyId-createdAt
    Value: companyId-createdAt-index
    Export:
      Name: !Sub '${Environment}-BookingsGSI3Name'

  BookingsGSI4Name:
    Description: Nome del GSI status-createdAt
    Value: status-createdAt-index
    Export:
      Name: !Sub '${Environment}-BookingsGSI4Name'

  BookingsGSI5Name:
    Description: Nome del GSI companyId-status
    Value: companyId-status-index
    Export:
      Name: !Sub '${Environment}-BookingsGSI5Name'