            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sticker added successfully
        '400':
          description: Bad request (invalid sticker type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not authorized for this chat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chats/{chatId}/upload-url:
    get:
      tags:
        - Chat
      summary: Get presigned upload URL
      description: |
        Get a presigned S3 URL for uploading file attachments.

        **Upload Flow:**
        1. Call this endpoint to get uploadUrl and fileUrl
        2. Upload file to uploadUrl using PUT with proper headers
        3. Use fileUrl when sending message with attachment

        **Requirements:**
        - User must be participant in the chat
        - Maximum file size: 10MB
        - Allowed file types: PDF, images, documents

        **Security:**
        - URL expires in 15 minutes
        - Must use HTTPS
        - Server-side encryption (AES256) required

        **Upload Headers Required:**
        ```
        Content-Type: <file MIME type>
        x-amz-server-side-encryption: AES256
        ```
      operationId: getUploadUrl
      security:
        - CognitoAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Chat ID
          schema:
            type: string
            example: \"chat_40f1671d354346a0\"
        - name: fileName
          in: query
          required: true
          description: Original filename with extension
          schema:
            type: string
            example: contract.pdf
        - name: mimeType
          in: query
          required: true
          description: File MIME type
          schema:
            type: string
            example: application/pdf
      responses:
        '200':
          description: Upload URL generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/chat_UploadUrlResponse'
              examples:
                pdf_upload:
                  summary: Upload PDF file
                  value:
                    uploadUrl: https://dev-beezey-chat-attachments.s3.eu-south-1.amazonaws.com/chat123/contract.pdf?X-Amz-Algorithm=...
                    fileUrl: https://dev-beezey-chat-attachments.s3.eu-south-1.amazonaws.com/chat123/contract.pdf
                    expiresIn: 900
        '400':
          description: Bad request (invalid filename or MIME type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not authorized for this chat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /chats/{chatId}/download-url:
    get:
      tags:
        - Chat
      summary: Get download URL for message attachments
      description: |
        Generates presigned S3 download URLs for all attachments in a message.

        **Requirements:**
        - User must be participant in the chat
        - Message must exist and have attachments

        **URL Validity:**
        - Download URLs expire after 7 days (604800 seconds)
        - Can be used multiple times until expiration

        **Use Cases:**
        - Download documents shared in chat
        - Preview images before downloading
        - Access previously uploaded files
      operationId: getDownloadUrl
      security:
        - CognitoAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          description: Chat ID
          schema:
            type: string
            example: chat_40f1671d354346a0
        - name: messageId
          in: query
          required: true
          description: Message ID containing attachments
          schema:
            type: string
            example: msg_abc123def456
      responses:
        '200':
          description: Download URLs generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrls:
                    type: array
                    description: List of download URLs for each attachment
                    items:
                      type: object
                      properties:
                        fileName:
                          type: string
                          description: Original file name
                          example: contract.pdf
                        downloadUrl:
                          type: string
                          format: uri
                          description: Presigned S3 URL for downloading (valid 7 days)
                          example: https://dev-beezey-chat-attachments.s3.amazonaws.com/chat_abc/contract.pdf?X-Amz-...
