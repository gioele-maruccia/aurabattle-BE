                  summary: Confirmed bookings fall outside new date range
                  description: |
                    Returned when startDate/endDate is changed and at least one confirmed booking
                    would no longer be contained within the new date range.
                    Bookings that are fully within the new range are NOT affected.
                  value:
                    error: Conflict
                    errorCode: BOOKING_CONFLICT
                    message: |-
                      Cannot modify dates: 2 confirmed booking(s) would fall outside the new date range (2026-03-16 – 2026-09-30). Please coordinate with the worker(s) or cancel their bookings first.
                      - Worker: worker-uuid-1, Dates: 2026-03-01 to 2026-03-25
                      - Worker: worker-uuid-2, Dates: 2026-03-15 to 2026-03-31
        '500':
