                            displayText:
                              type: string
                              example: Roma, RM, Lazio, IT
                        compensation:
                          type: object
                          properties:
                            base:
                              type: number
                              format: float
                              example: 1228.88
                            contingency:
                              type: number
                              format: float
                              example: 528.26
                            superminimo:
                              type: number
