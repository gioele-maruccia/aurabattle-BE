  /listings/{listingId}:
    get:
      tags:
        - Job listings
      summary: Get job listing by ID (Public)
      description: |
        Retrieve a single job listing by its ID. Public endpoint - no authentication required.

        **Manual vs CCNL Listings:**
        - **CCNL listings** (FIPE companies): Have `contract` object with calculation, level, paragraph
        - **Manual listings** (non-FIPE companies): Have `contract: null` and use `salary` field

        **Returns complete listing details with new CCNL schema:**
        - Full contract information (CCNL calculation, superminimo, paragraph) - null for manual listings
        - Job role details (roleId, roleName, category)
        - Detailed schedule with workTimeSlots
        - Calculated compensation (from contract for CCNL, from salary for manual)
        - Company information with logo and recruiter details
        - Application statistics and view counts

        **New Fields (CCNL Schema):**
        - `contract.calculation`: Complete base pay calculation (CCNL only)
        - `contract.superminimo`: Optional additional pay above CCNL (CCNL only)
        - `contract.paragraph`: I or II - determines increment schedule (CCNL only)
        - `jobRole`: Complete role information from JobRoles table
        - `schedule.workTimeSlots`: Detailed time slots (single/split/flexible)
        - `compensation`: Calculated total compensation (from contract or salary)
        - `compensation.estimatedNet`: Estimated net after IRPEF + INPS (calculated on full grossPay including superminimo)
        - `salary`: Direct salary field for manual listings (when contract is null)

        **Removed Fields:**
        - `tags` (no longer used)
        - `features` (no longer used)

        **Use Cases:**
        - Job seeker viewing job details
        - Display full job description with CCNL details
        - Show company information and recruiter contact
        - View work schedule and compensation breakdown
      operationId: getJobListing
      security: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
