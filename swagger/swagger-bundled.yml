                  value:
                    error: Bad Request
                    message: Cannot update a deleted job listing
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: Unauthorized
                message: Invalid or missing authentication token
        '403':
          description: Forbidden - Not authorized to update this listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              examples:
                not_company:
                  summary: Not a company user
                  value:
                    error: Forbidden
                    message: Only company users can update job listings
                not_owner:
                  summary: Not the listing owner
                  value:
                    error: Forbidden
                    message: You can only update your own job listings
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
