                              example: 2157.14
                            estimatedNet:
                              type: number
                              format: float
                              description: Estimated net monthly pay after IRPEF + INPS. Indicative only.
                              example: 1612.34
                            currency:
                              type: string
                              example: EUR
                            displayText:
                              type: string
                              example: €2,157.14/month
                            includesSuperminimo:
                              type: boolean
                              example: true
                        startDate:
                          type: string
                          format: date
                          example: '2025-06-15'
                        endDate:
                          type: string
                          format: date
                          example: '2025-09-15'
                        category:
                          type: string
                          example: hospitality
                        positions:
                          type: integer
                          example: 2
                        publishedAt:
                          type: string
                          format: date-time
                          nullable: true
                        status:
                          type: string
                          enum:
                            - published
                            - draft
                            - paused
                            - closed
                            - expired
                          example: published
                        isManual:
                          type: boolean
                          description: If true, listing was created with manual salary (non-CCNL sector)
                          example: false
                        vitto:
