          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings/{bookingId}/status:
    patch:
      tags:
        - Bookings
      summary: Update booking status
      description: |
        Update the status of a booking (accept, reject, mark as no-show, etc).

        **Access Control:**
        - Company: Can accept/reject/mark no-show for their listings
        - Backoffice: Can change any status
        - Workers: Cannot change status (must use /cancel endpoint)

        **Status Transitions:**

        From **pending**:
        - → confirmed (company accepts)
        - → rejected (company rejects)
        - → cancelled (see /cancel endpoint)

        From **confirmed**:
        - → completed (automatic after end date or manual)
        - → no_show (company marks worker didn't show up)
        - → cancelled (see /cancel endpoint)

        **Business Rules:**
        - Can only accept if positions available
        - Cannot change status of completed bookings
        - Accepting a booking updates listing positionsFilled count
        - Rejecting/cancelling frees up the position

        **Side Effects:**
        - Updates booking status and timestamps
        - Updates listing positions count
        - Sends notification to worker
        - May trigger contract details form (on accept)
        - ⚡ **NEW:** Automatically sends system message to associated chat when status changes
          to confirmed, rejected, cancelled, or completed. Message includes booking details
          and reason (if provided). Chat message failures do not block booking update.
      operationId: updateBookingStatus
      security:
        - CognitoAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Booking ID
          example: booking_2025_abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - confirmed
                    - rejected
                    - no_show
                    - completed
                  description: New booking status
                message:
                  type: string
                  maxLength: 500
                  description: Optional message to worker (especially for rejections)
                  example: Thank you for applying. Unfortunately, we've selected other candidates.
                contract:
                  type: object
                  description: Contract details (required when confirming)
                  properties:
                    hourlyRate:
                      type: number
                      format: float
                      minimum: 0
                    hoursPerWeek:
                      type: integer
                      minimum: 1
                    startTime:
                      type: string
                      example: '08:00'
                    endTime:
                      type: string
                      example: '16:00'
                    benefits:
                      type: array
                      items:
                        type: string
            examples:
              accept_application:
                summary: Accept application with contract
                value:
                  status: confirmed
                  message: Welcome to our team! We look forward to working with you.
                  contract:
                    hourlyRate: 12.5
                    hoursPerWeek: 40
                    startTime: '08:00'
                    endTime: '16:00'
                    benefits:
                      - Meals included
                      - Accommodation provided
              reject_application:
                summary: Reject application
                value:
                  status: rejected
                  message: Thank you for your interest. We've selected other candidates with more experience.
              mark_no_show:
                summary: Mark worker as no-show
                value:
                  status: no_show
                  message: Worker did not show up on the agreed start date.
      responses:
        '200':
          description: Booking status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Booking status updated to confirmed
                  booking:
                    $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid request or status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_transition:
                  summary: Invalid status transition
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: Cannot change status from completed to confirmed
                no_positions:
                  summary: No positions available
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: 'Cannot confirm booking: no positions remaining'
                missing_contract:
                  summary: Contract details required
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: Contract details are required when confirming a booking
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Not authorized to update this booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings/{bookingId}/cancel:
    patch:
      tags:
        - Bookings
      summary: Cancel a booking
      description: |
        Cancel a booking. Available to both workers and companies.

        **Access Control:**
        - Worker: Can cancel their own pending or confirmed bookings
        - Company: Can cancel any booking for their listings
        - Backoffice: Can cancel any booking

        **Cancellation Rules:**
        - Can only cancel pending or confirmed bookings
        - Cannot cancel completed, rejected, or already cancelled bookings
        - Cancelling confirmed booking frees up the position
        - May have cancellation policy implications (future feature)

        **Side Effects:**
        - Sets booking status to cancelled
        - Updates cancelledAt timestamp
        - Frees up listing position if was confirmed
        - Sends notification to other party
        - Records who cancelled (worker vs company)
      operationId: cancelBooking
      security:
        - CognitoAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Booking ID
          example: booking_2025_abc123
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Optional cancellation reason
                  example: Personal circumstances have changed and I can no longer commit to this period
            examples:
              worker_cancellation:
                summary: Worker cancels with reason
                value:
                  reason: Family emergency requires me to return home
              company_cancellation:
                summary: Company cancels
                value:
                  reason: Position no longer needed due to schedule changes
      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Booking cancelled successfully
                  booking:
                    $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid request - Cannot cancel booking in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_cancelled:
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: Booking is already cancelled
                already_completed:
                  value:
                    statusCode: 400
                    error: Bad Request
                    message: Cannot cancel a completed booking
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Not authorized to cancel this booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /bookings/{bookingId}/dates:
    patch:
      tags:
        - Bookings
      summary: Update booking dates (Worker only)
      description: |
        Allows a worker to update dates for their pending booking.

        **WORKFLOW:**
        - Worker updates dates via THIS endpoint
        - System validates the proposed dates
        - Booking dates are updated immediately in the database
        - An informative message is sent to chat notifying about the change

        **Access Control:**
        - Only the worker who owns the booking can update dates
        - Only bookings in 'pending' status can have dates updated

        **Validations:**
        - End date must be after start date
        - New dates must be within the job listing period
        - Position availability is checked for the new date range
        - No conflicts with other confirmed bookings

        **Side Effects:**
        - Booking dates are updated in the database
        - An informative message is sent to the chat
        - **WebSocket broadcast:** both participants receive `new_message` (the informative chat message) and a personalized `chat_updated` event with the updated booking dates

        **Response:**
        - Updated booking with new dates
      operationId: updateBookingDates
      security:
        - CognitoAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          description: The ID of the booking to update
          schema:
            type: string
            format: uuid
            example: d7a87b92-8011-447b-80fe-6e23b0a3d91d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startDate
                - endDate
              properties:
                startDate:
                  type: string
                  format: date
                  description: New start date in ISO 8601 format (YYYY-MM-DD)
                  example: '2026-02-15'
                endDate:
                  type: string
                  format: date
                  description: New end date in ISO 8601 format (YYYY-MM-DD)
                  example: '2026-02-20'
            examples:
              validRequest:
                summary: Valid date update request
                value:
                  startDate: '2026-02-15'
                  endDate: '2026-02-20'
      responses:
        '200':
          description: Booking dates updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Booking dates updated successfully
                  booking:
                    type: object
                    properties:
                      bookingId:
                        type: string
                        format: uuid
                        example: d7a87b92-8011-447b-80fe-6e23b0a3d91d
                      startDate:
                        type: string
                        format: date
                        example: '2026-02-15'
                      endDate:
                        type: string
                        format: date
                        example: '2026-02-20'
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2026-01-13T10:35:00Z'
        '400':
          description: Bad Request - Invalid input or business rule violation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    error: Bad Request
                    message: 'Missing required fields: startDate, endDate'
                invalidDateFormat:
                  summary: Invalid date format
                  value:
                    error: Bad Request
                    message: Invalid date format. Use ISO 8601 (YYYY-MM-DD)
                endBeforeStart:
                  summary: End date before start date
                  value:
                    error: Bad Request
                    message: End date must be after start date
                notPending:
                  summary: Booking not in pending status
                  value:
                    error: Bad Request
                    message: 'Can only update dates of pending bookings. Current status: confirmed'
                outsideListingPeriod:
                  summary: Dates outside listing period
                  value:
                    error: Bad Request
                    message: New dates must be within job listing period (2026-01-01 to 2026-12-31)
                noPositionsAvailable:
                  summary: No positions available
                  value:
                    error: Bad Request
                    message: No positions available in the new date range (3/3 positions taken)
                minimum_notice_not_met:
                  summary: Minimum notice days requirement not met
                  value:
                    error: BOOKING_MINIMUM_NOTICE_NOT_MET
                    message: 'This job listing requires bookings to be made at least 5 days in advance. Earliest available date: 2025-01-25'
                minimum_duration_not_met:
                  summary: Minimum consecutive days requirement not met
                  value:
                    error: BOOKING_MINIMUM_DURATION_NOT_MET
                    message: This job listing requires a minimum booking period of 7 consecutive days. Your booking is only 3 days.
                nonBookingItem:
                  summary: Item is not a booking
                  value:
                    error: Bad Request
                    message: Cannot update dates of non-booking items
        '403':
          description: Forbidden - User not authorized or rejected booking blocks dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                  conflictingBookingId:
                    type: string
                  conflictingStatus:
                    type: string
                  conflictingDates:
                    type: object
                    properties:
                      startDate:
                        type: string
                      endDate:
                        type: string
              examples:
                notWorker:
                  summary: User is not a worker
                  value:
                    error: Forbidden
                    message: Only worker users can update booking dates
                notOwner:
                  summary: Worker doesn't own the booking
                  value:
                    error: Forbidden
                    message: You can only update your own bookings
                rejectedBooking:
                  summary: Previously rejected booking blocks these dates
                  value:
                    error: Forbidden
                    message: You cannot update to these dates because you have a previously rejected booking in this date range
                    conflictingBookingId: booking_xyz789
                    conflictingStatus: rejected
                    conflictingDates:
                      startDate: '2026-02-15'
                      endDate: '2026-02-20'
        '404':
          description: Not Found - Booking or listing not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
              examples:
                bookingNotFound:
                  summary: Booking not found
                  value:
                    error: Not Found
                    message: Booking not found
                listingNotFound:
                  summary: Job listing not found
                  value:
                    error: Not Found
                    message: Job listing not found
        '409':
          description: Conflict - Date conflicts with existing bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Conflict
                  message:
                    type: string
                  conflictingBookingId:
                    type: string
                  conflictingListingId:
                    type: string
                  conflictingStatus:
                    type: string
                  conflictingDates:
                    type: object
                    properties:
                      startDate:
                        type: string
                      endDate:
                        type: string
              examples:
                pendingSameListing:
                  summary: Another pending booking for same listing
                  value:
                    error: Conflict
                    message: You already have another pending booking for this job listing in the new dates
                    conflictingBookingId: booking_abc123
                    conflictingStatus: pending
                    conflictingDates:
                      startDate: '2026-02-15'
                      endDate: '2026-02-20'
                confirmedSameListing:
                  summary: Confirmed booking for same listing
                  value:
                    error: Conflict
                    message: You already have a confirmed booking for this job listing in the new dates
                    conflictingBookingId: booking_abc456
                    conflictingStatus: confirmed
                    conflictingDates:
                      startDate: '2026-02-15'
                      endDate: '2026-02-20'
                confirmedDifferentListing:
                  summary: Confirmed booking for different listing
                  value:
                    error: Conflict
                    message: You cannot update to these dates because you already have a confirmed booking for another job listing during this period
                    conflictingBookingId: booking_def789
                    conflictingListingId: listing_xyz999
                    conflictingStatus: confirmed
                    conflictingDates:
                      startDate: '2026-02-15'
                      endDate: '2026-02-20'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
              examples:
                fetchError:
                  summary: Error fetching data
                  value:
                    error: Internal Server Error
                    message: Error fetching booking
                updateError:
                  summary: Error updating booking
                  value:
                    error: Internal Server Error
                    message: Error updating booking dates
  /bookings/{bookingId}/confirm-dates:
    patch:
      tags:
        - Bookings
      summary: Confirm proposed booking dates (Company only)
      description: |
        Allows a company representative to confirm date changes proposed by a worker.

        **NEW WORKFLOW (v2):**
        - Worker proposes dates via PATCH /bookings/{id}/dates (validates, sends message with payload)
        - Company confirms dates via THIS endpoint
        - Only when company confirms are the booking dates actually updated

        **Access Control:**
        - Only company representatives can confirm dates
        - Must belong to the company that owns the job listing
        - Only bookings in 'pending' status can have dates confirmed

        **Validations:**
        - Booking must exist and be in 'pending' status
        - End date must be after start date
        - Confirmed dates must be within the job listing period
        - Position availability is re-checked for the confirmed date range

        **Side Effects:**
        - Booking dates are updated in the database
        - Associated chat dates are updated automatically
        - Chat booking_state is synchronized with booking status
        - A confirmation message is sent to the chat
        - **WebSocket broadcast:** both participants receive `new_message` (the confirmation chat message) and a personalized `chat_updated` event with the new booking dates

        **Response:**
        - Updated booking object with confirmed dates
        - Status remains 'pending' or 'confirmed' depending on booking workflow
      operationId: confirmBookingDates
      security:
        - CognitoAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          description: The ID of the booking to confirm dates for
          schema:
            type: string
            format: uuid
            example: d7a87b92-8011-447b-80fe-6e23b0a3d91d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - startDate
                - endDate
              properties:
                startDate:
                  type: string
                  format: date
                  description: Date to confirm in ISO 8601 format (YYYY-MM-DD)
                  example: '2026-02-15'
                endDate:
                  type: string
                  format: date
                  description: Date to confirm in ISO 8601 format (YYYY-MM-DD)
                  example: '2026-02-20'
            examples:
              confirmRequest:
                summary: Confirm proposed dates
                value:
                  startDate: '2026-02-15'
                  endDate: '2026-02-20'
      responses:
        '200':
          description: Booking dates confirmed and updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Booking dates confirmed and updated successfully
                  booking:
                    type: object
                    properties:
                      bookingId:
                        type: string
                        format: uuid
                        example: d7a87b92-8011-447b-80fe-6e23b0a3d91d
                      listingId:
                        type: string
                        format: uuid
                      workerId:
                        type: string
                        format: uuid
                      companyId:
                        type: string
                        format: uuid
                      startDate:
                        type: string
                        format: date
                        example: '2026-02-15'
                      endDate:
                        type: string
                        format: date
                        example: '2026-02-20'
                      status:
                        type: string
                        example: pending
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2026-01-15T14:30:00Z'
        '400':
          description: Bad request - validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidDates:
                  summary: Invalid date range
                  value:
                    error: Bad Request
                    message: End date must be after start date
                datesOutsideListingPeriod:
                  summary: Dates outside listing period
                  value:
                    error: Bad Request
                    message: Confirmed dates must be within job listing period (2026-02-01 to 2026-02-28)
                noAvailability:
                  summary: No positions available
                  value:
                    error: Bad Request
                    message: 'Dates no longer available: No positions available in the date range (3/3 positions taken)'
                wrongStatus:
