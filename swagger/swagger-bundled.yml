                        roleDescription: Personale addetto alla preparazione e cottura alimenti sotto supervisione
                      - roleId: FIPE_L3_003
                        roleName: Cuoco
                        fipeLevel: L3
                        fipeLevelName: Livello 3 - Personale qualificato
                        category: Cucina
                        roleDescription: Personale qualificato per la preparazione di piatti completi
                      - roleId: FIPE_L4_001
                        roleName: Cameriere
                        fipeLevel: L4
                        fipeLevelName: Livello 4 - Personale specializzato
                        category: Sala
                        roleDescription: Personale addetto al servizio di sala
                    totalRoles: 36
                    message: Successfully retrieved 36 applicable job roles
                no_roles:
                  summary: Company with no applicable roles
                  value:
                    companyId: uuid-789
