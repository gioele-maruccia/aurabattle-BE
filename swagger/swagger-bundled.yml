          type: string
          description: MIME type of the file
          example: image/jpeg
          enum:
            - image/jpeg
            - image/png
            - image/jpg
            - application/pdf
        size:
          type: integer
          description: File size in bytes
          example: 2048000
          minimum: 1
          maximum: 10485760
    UploadUrlResponse:
      type: object
