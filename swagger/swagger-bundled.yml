        **Requirements:**
        - Valid booking ID
        - Worker and company IDs match the booking
        - User must be either the worker or company of the booking

        **Business Rules:**
        - Only one chat per booking (idempotent on bookingId)
        - Cannot create chat for someone else's booking
        - Both worker and company have access

