              type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobListing:
      type: object
      description: |
        Job listing object. Can be either CCNL-based (FIPE companies) or manual (non-FIPE companies).

        **CCNL Listings:**
        - Have `contract` object with full CCNL details (level, paragraph, calculation)
        - Compensation calculated from contract.calculation.grossBasePay + superminimo

        **Manual Listings:**
        - Have `contract: null`
        - Use `salary` field directly for compensation
        - Identified by checking if `contract` is null (not by ccnlType field)
      properties:
        listingId:
          type: string
          description: Unique job listing ID
          example: job_2025_abc123
        companyId:
          type: string
          format: uuid
          description: Company UUID
          example: 12345678-1234-1234-1234-123456789012
        title:
          type: string
          maxLength: 200
          example: Cameriere per stagione estiva
        description:
          type: string
          maxLength: 5000
        ccnlType:
          type: string
          enum:
            - turismo
            - manuale
          description: Contract type. 'turismo' for FIPE companies using CCNL Turismo, 'manuale' for non-FIPE manual entry
          example: turismo
        location:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            province:
              type: string
            postalCode:
              type: string
            country:
              type: string
            coordinates:
              type: object
              properties:
                lat:
                  type: number
                lon:
                  type: number
        startDate:
          type: string
          format: date
          example: '2025-06-01'
        endDate:
          type: string
          format: date
          example: '2025-09-30'
        positions:
          type: integer
          description: Total positions available
          example: 3
        positionsFilled:
          type: integer
          description: Number of positions filled
          default: 0
          example: 0
        category:
          type: string
          example: Food & Beverage
        status:
          type: string
          enum:
            - draft
            - published
            - paused
            - closed
            - expired
            - deleted
          example: published
        salary:
          type: number
          description: For manual entry listings - annual gross salary or fixed amount
          example: 35000
        hoursPerWeek:
          type: integer
          description: Hours per week
          example: 40
        employmentType:
          type: string
          description: For manual entry - employment type like full-time, part-time
          example: full-time
        contractId:
          type: string
          description: For manual entry - custom contract identifier
          example: custom_dev_001
        schedule:
          type: object
          properties:
            hoursPerWeek:
              type: integer
            flexibility:
              type: string
            shiftType:
              type: string
        employment:
          type: object
          properties:
            type:
              type: string
            contractType:
              type: string
        responsibilities:
          type: array
          items:
            type: string
          description: For manual entry - array of responsibility strings
        benefits:
          type: string
          maxLength: 2000
        isHousingIncluded:
          type: boolean
          description: Indicates if housing/accommodation is provided by the employer
          default: false
          example: true
        vitto:
          type: boolean
          description: Meals provided by employer
          default: false
          example: true
        alloggio:
          type: boolean
          description: Accommodation available
          default: false
          example: true
        alloggioPricePerDay:
          type: number
          description: Daily accommodation price (if alloggio=true)
          example: 15
        alloggioDescription:
          type: string
          description: Description of accommodation facilities
          example: Camera doppia in residence aziendale
          maxLength: 500
        minConsecutiveDays:
          type: integer
          description: Minimum consecutive booking days required
          example: 7
        minNoticeDays:
          type: integer
          description: Minimum advance notice days for booking
          example: 3
        requirements:
          type: array
          items:
            type: string
          description: For manual entry - array of requirement strings
        tags:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        viewsCount:
          type: integer
          default: 0
          description: Number of views
        applicationsCount:
          type: integer
          default: 0
          description: Number of applications
        createdAt:
          type: string
          format: date-time
          example: '2025-01-17T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2025-01-17T10:30:00Z'
        publishedAt:
          type: string
          format: date-time
          description: When the listing was published
          example: '2025-01-17T10:30:00Z'
        expiresAt:
          type: string
          format: date-time
          description: Automatic expiration (usually endDate + 1 day)
          example: '2025-10-01T00:00:00Z'
        closedAt:
          type: string
          format: date-time
          description: When the listing was closed
        deletedAt:
          type: string
          format: date-time
          description: When the listing was deleted (soft delete)
    ChatListItem:
      type: object
      description: Chat item in personal chat list with interlocutor info
      properties:
        chatId:
          type: string
          format: uuid
          description: Chat ID
          example: chat_abc123
        bookingId:
          type: string
          format: uuid
          description: Associated booking ID
          example: booking_xyz789
        workerId:
          type: string
          format: uuid
          description: Worker user ID (participant in chat)
          example: 263e5210-a051-7047-9fe8-cd1dedc81f5f
        companyRepresentativeId:
          type: string
          format: uuid
          description: Company representative user ID (participant in chat)
          example: c61e42c0-2021-70af-2387-7a07b96c6002
        listingId:
          type: string
          format: uuid
          nullable: true
          description: Associated job listing ID
          example: 450e7400-e19b-41d4-a716-446655440000
        status:
          type: string
          enum:
            - active
            - archived
            - closed
            - deleted
          description: Chat status
          example: active
        jobName:
          type: string
          nullable: true
          description: Job listing title (retrieved dynamically from booking)
          example: Cameriere per evento
        startDate:
          type: string
          format: date
          nullable: true
          description: Booking start date (retrieved dynamically from booking, always up-to-date)
          example: '2026-02-01'
        endDate:
          type: string
          format: date
          nullable: true
          description: Booking end date (retrieved dynamically from booking, always up-to-date)
          example: '2026-02-06'
        bookingStatus:
          type: string
          enum:
            - pending
            - confirmed
            - rejected
            - cancelled
            - completed
          nullable: true
          description: Current booking status (retrieved dynamically from booking)
          example: pending
        createdAt:
          type: string
          format: date-time
          description: Chat creation timestamp
          example: '2025-11-01T10:00:00Z'
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
          description: Last message timestamp
          example: '2025-11-27T14:30:00Z'
        lastMessagePreview:
          type: string
          nullable: true
          description: Preview of last message (first 100 chars)
          example: Il contratto è pronto per la firma
        lastMessageState:
          type: string
          enum:
            - sent
            - delivered
            - read
          nullable: true
          description: State of last message
          example: read
        lastMessageSenderId:
          type: string
          nullable: true
          description: User ID of the sender of the last message
          example: user_789
        lastMessageReadWorker:
          type: boolean
          description: |
            Whether the worker has read the last message. Always `true` when `lastMessageSenderId` is not `beezey_system` (field not applicable). When `lastMessageSenderId == beezey_system` reflects the actual `readWorker` flag stored on that message, initially `false` and set to `true` by PATCH set-state.
          example: false
        lastMessageReadCompany:
          type: boolean
          description: |
            Whether the company representative has read the last message. Always `true` when `lastMessageSenderId` is not `beezey_system` (field not applicable). When `lastMessageSenderId == beezey_system` reflects the actual `readCompany` flag stored on that message, initially `false` and set to `true` by PATCH set-state.
          example: true
        companyId:
          type: string
          format: uuid
          nullable: true
          description: Company ID (only for worker view)
          example: comp_456
        companyName:
          type: string
          nullable: true
          description: Company name (only for worker view)
          example: Hotel Bella Vista
        companyLogo:
          type: string
          format: uri
          nullable: true
          description: Company logo URL (only for worker view)
          example: https://beezey-profiles.s3.amazonaws.com/companies/logo.jpg
        interlocutorId:
          type: string
          format: uuid
          description: ID of the person you're chatting with
          example: user_789
        interlocutorName:
          type: string
          description: Name of interlocutor
          example: Marco Rossi
        interlocutorPhoto:
          type: string
          format: uri
          nullable: true
          description: Profile photo URL of interlocutor
          example: https://beezey-profiles.s3.amazonaws.com/users/avatar.jpg
    CreateChatRequest:
      type: object
      required:
        - booking_id
