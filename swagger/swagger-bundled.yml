                  error:
                    type: string
                    example: Conflict
                  errorCode:
                    type: string
                    enum:
                      - BOOKING_CONFLICT
                    description: Machine-readable error code for the frontend to handle
                    example: BOOKING_CONFLICT
                  message:
                    type: string
                    description: Human-readable explanation with affected booking details (up to 3 shown)
                    example: |-
                      Cannot modify dates: 2 confirmed booking(s) would fall outside the new date range (2026-03-16 – 2026-09-30). Please coordinate with the worker(s) or cancel their bookings first.
                      - Worker: worker-uuid-1, Dates: 2026-03-01 to 2026-03-25
                      - Worker: worker-uuid-2, Dates: 2026-03-15 to 2026-03-31
              examples:
