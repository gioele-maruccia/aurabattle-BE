                      status:
                        type: string
                        example: active
                      verificationStatus:
                        type: string
                        example: pending
                      createdAt:
                        type: string
                        format: date-time
                        example: '2024-03-20T10:30:00Z'
                      updatedAt:
                        type: string
                        format: date-time
                        example: '2024-03-20T10:30:00Z'
                  fipeClassification:
                    type: object
                    properties:
                      category:
                        type: string
                        example: pubblici_esercizi
                      article:
                        type: string
                        example: Art. 1, I
                      table:
                        type: string
                        example: Tabella Standard
                      incrementSchedule:
                        type: string
                        example: giugno
                  rolesInfo:
                    type: object
                    description: Information about aggregated job roles
                    properties:
                      totalApplicableRoles:
                        type: integer
