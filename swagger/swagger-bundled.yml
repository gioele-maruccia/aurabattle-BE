        - Company requests intervention for dispute
        - Technical problems with platform

        **Side Effects:**
        - Sends notification to Beezey support team
        - Creates support ticket (if integrated)
        - Optionally adds Beezey support as participant in chat
        - **WebSocket broadcast:** user message sent to the other participant only (`new_message`); Beezey system response sent to **both** participants (`new_message` + `chat_updated`)

        **Business Rules:**
        - Can be called by either worker or company
        - Creates audit trail in DynamoDB
