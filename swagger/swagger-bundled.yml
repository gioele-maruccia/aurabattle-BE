                          56.30.00:
                            atecoDescription: Bar e altri esercizi simili senza cucina
                            sector: ristorazione
                            fipeCategory: pubblici_esercizi
                      fipeCategory:
                        type: string
                        example: pubblici_esercizi
                      fipeArticle:
                        type: string
                        example: Art. 1, I
                      compensationTable:
                        type: string
                        example: standard
                      tableName:
                        type: string
                        example: Tabella Standard
                      incrementSchedule:
                        type: string
                        example: giugno
                      isSmallBusiness:
                        type: boolean
                        example: false
                      numberOfEmployees:
                        type: integer
