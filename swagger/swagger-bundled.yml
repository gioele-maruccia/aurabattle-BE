                    type: string
        '404':
          description: Support chat not found
    post:
      tags:
        - Support Chat
      summary: Send support message
      description: |
        Sends a message in a support chat. Can be from requester or Beezey staff.

        **Permissions:**
        - Chat requester can always send messages
        - Assigned Beezey staff can send messages
        - Other users get 403 Forbidden
      operationId: sendSupportMessage
      security:
        - CognitoAuth: []
      parameters:
        - name: supportChatId
          in: path
          required: true
          description: Support chat ID
          schema:
            type: string
            example: support_abc123def456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageText:
                  type: string
                  minLength: 1
                  maxLength: 5000
                  description: Message text (required if no attachments)
                  example: Thank you for your help!
                attachments:
                  type: array
                  description: Files uploaded via POST /support-chats/{id}/upload-url
                  items:
                    type: object
                    required:
                      - fileName
                      - fileSize
                      - fileType
                      - s3Url
                    properties:
                      fileName:
                        type: string
                        example: screenshot.png
                      fileSize:
                        type: integer
                        example: 125000
                      fileType:
                        type: string
                        example: image/png
                      s3Url:
                        type: string
                        example: https://dev-beezey-chat-attachments.s3.amazonaws.com/...
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      supportChatId:
                        type: string
                        example: support_abc123
                      messageId:
                        type: string
                        example: msg_xyz789
                      senderId:
                        type: string
                        example: user_123
                      senderType:
                        type: string
                        enum:
                          - worker
                          - company
                          - beezey
                        example: worker
                      messageText:
                        type: string
                        example: Thank you!
                      timestamp:
                        type: string
                        format: date-time
                        example: '2025-12-17T15:30:00.123456+00:00'
                      state:
                        type: string
                        enum:
                          - sent
                          - delivered
                          - read
                        example: sent
                      attachments:
                        type: array
                        items:
                          type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Message text or attachments are required
        '403':
          description: Forbidden - User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: You are not authorized to send messages in this chat
        '404':
          description: Support chat not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Support chat not found
  /support-chats/{supportChatId}/messages/{messageId}/state:
    put:
      tags:
        - Support Chat
      summary: Update support message state
      description: |
        Update delivery/read state of a support message.

        **CRITICAL: Timestamp Requirement**
        You **MUST** provide the original message timestamp (from GET messages),
        not the current time! DynamoDB uses timestamp as sort key.

        **Permissions:**
        - Chat requester can update messages
        - Assigned staff can update messages
      operationId: updateSupportMessageState
      security:
        - CognitoAuth: []
      parameters:
        - name: supportChatId
          in: path
          required: true
          description: Support chat ID
          schema:
            type: string
            example: support_abc123def456
        - name: messageId
          in: path
          required: true
          description: Message ID to update
          schema:
            type: string
            example: msg_xyz789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
                - timestamp
              properties:
                state:
                  type: string
                  enum:
                    - delivered
                    - read
                  description: New message state
                  example: read
                timestamp:
                  type: string
                  format: date-time
                  description: |
                    **REQUIRED**: Original message timestamp (not current time!).
                    Must match the timestamp field of the message from GET messages.
                    Used as DynamoDB sort key.
                  example: '2025-12-17T14:30:00.123456+00:00'
            examples:
              mark_read:
                summary: Mark message as read
                value:
                  state: read
                  timestamp: '2025-12-17T14:30:00.123456+00:00'
      responses:
        '200':
          description: State updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updated
        '400':
          description: Bad request - Invalid state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - 'Invalid state. Must be one of: [''sent'', ''delivered'', ''read'']'
        '403':
          description: Forbidden - User not authorized
        '404':
          description: Message not found (wrong timestamp or messageId)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Message msg_xyz789 not found
  /support-chats/{supportChatId}/messages/{messageId}/sticker:
    put:
      tags:
        - Support Chat
      summary: Set sticker on support message
      description: |
        Add emoji/sticker reaction to a support message.

        **CRITICAL: Timestamp Requirement**
        You **MUST** provide the original message timestamp (from GET messages),
        not the current time! DynamoDB uses timestamp as sort key.

        **Permissions:**
        - Chat requester can add stickers
        - Assigned staff can add stickers
      operationId: setSupportSticker
      security:
        - CognitoAuth: []
      parameters:
        - name: supportChatId
          in: path
          required: true
          description: Support chat ID
          schema:
            type: string
            example: support_abc123def456
        - name: messageId
          in: path
          required: true
          description: Message ID to add sticker to
          schema:
            type: string
            example: msg_xyz789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sticker
                - timestamp
              properties:
                sticker:
                  type: string
                  enum:
                    - thumbs_up
                    - thumbs_down
                    - heart
                    - smile
                    - fire
                    - check
                    - question
                  description: Sticker/emoji to add
                  example: thumbs_up
                timestamp:
                  type: string
                  format: date-time
                  description: |
                    **REQUIRED**: Original message timestamp (not current time!).
                    Must match the timestamp field of the message from GET messages.
                    Used as DynamoDB sort key.
                  example: '2025-12-17T14:30:00.123456+00:00'
            examples:
              add_thumbs_up:
                summary: Add thumbs up reaction
                value:
                  sticker: thumbs_up
                  timestamp: '2025-12-17T14:30:00.123456+00:00'
