        **Requirements:**
        - Only chat participants (worker or company representative) can update status
        - Valid status values: active, archived, closed, deleted

        **Use Cases:**
        - Archive a chat when booking is completed
        - Close a chat when booking is cancelled
        - Delete a chat (soft delete)
        - Reactivate an archived chat

