  /companies/my-applicable-job-roles:
    get:
      tags:
        - Companies
      summary: Get my applicable job roles
      description: |
        Retrieve all job roles applicable to the authenticated user's company.

        Returns detailed information for each role based on the company's ATECO codes.
        The list includes roleId, roleName, fipeLevel, fipeLevelName, category, and roleDescription.

        **Authentication required** - Returns roles for the authenticated user's company only.
      operationId: getMyApplicableJobRoles
      security:
        - CognitoAuth: []
      responses:
        '200':
          description: Applicable job roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  companyId:
                    type: string
                    format: uuid
                    description: Company's unique identifier
                  businessName:
                    type: string
                    description: Company's business name
                  atecoCodes:
                    type: array
                    description: List of company's ATECO codes
                    items:
                      type: string
                      pattern: ^\d{2}\.\d{2}\.\d{2}$
                      example: 56.10.11
                  fipeCategory:
                    type: string
                    description: Company's FIPE category
                    enum:
                      - pubblici_esercizi
                      - ristorazione_collettiva
                      - turismo
                  applicableJobRoles:
                    type: array
                    description: List of job roles applicable to the company
                    items:
                      type: object
                      properties:
                        roleId:
                          type: string
                          description: Unique role identifier
                          example: FIPE_L4_001
                        roleName:
                          type: string
                          description: Name of the job role
                          example: Cameriere
                        fipeLevel:
                          type: string
                          description: FIPE level classification
                          example: L4
                        fipeLevelName:
                          type: string
                          description: Description of the FIPE level
                          example: Livello 4 - Personale qualificato
                        category:
                          type: string
                          description: Job role category
                          example: Sala
                        roleDescription:
                          type: string
                          description: Detailed description of the role
                          example: Personale addetto al servizio di sala con compiti di accoglienza clienti e servizio ai tavoli
                  totalRoles:
                    type: integer
                    description: Total number of applicable roles
                    example: 36
                  message:
                    type: string
                    description: Success message
              examples:
                with_roles:
                  summary: Company with applicable roles
                  value:
                    companyId: b226e325-fd65-48b5-8c19-2611384a1841
                    businessName: OPENAPI S.P.A.
                    atecoCodes:
                      - 56.10.11
