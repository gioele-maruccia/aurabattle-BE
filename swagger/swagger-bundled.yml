          $ref: '#/paths/~1profile/get/responses/401'
  /battles:
    post:
      tags:
        - Battles
      summary: Crea una nuova battle
      description: L'utente autenticato ne diventa l'host. La battle è subito pubblica.
      operationId: createBattle
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - location
                - event_datetime
              properties:
                title:
                  type: string
                  example: Torneo Aura Street
                description:
                  type: string
                  example: Prima battle di prova
                location:
                  type: string
                  example: 'Milano, Parco Sempione'
                event_datetime:
                  type: string
                  format: date-time
                  example: '2026-10-15T18:00:00Z'
      responses:
        '201':
          description: Battle creata
          content:
            application/json:
              schema:
                type: object
                properties:
                  battle_id:
                    type: string
                    format: uuid
                    example: a6d66a62-4bcd-4069-9ba5-6eeff473264f
                  host_id:
                    type: string
                    format: uuid
                    description: user_id dell'utente che ha creato la battle
                    example: 864eb230-a071-708c-ec7e-a1c6446c9cbe
                  title:
                    type: string
                    example: Torneo Aura Street
                  description:
                    type: string
                    example: Prima battle di prova
                  location:
                    type: string
                    example: 'Milano, Parco Sempione'
                  event_datetime:
                    type: string
                    format: date-time
                    example: '2026-10-15T18:00:00Z'
                  status:
                    type: string
                    enum:
                      - published
                      - closed
                    example: published
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Campi obbligatori mancanti
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  error:
                    type: string
        '401':
          $ref: '#/paths/~1profile/get/responses/401'
    get:
      tags:
        - Battles
      summary: Lista pubblica delle battle
      description: 'Ritorna le battle pubblicate, ordinate per data evento (dalla più vicina). Nessuna autenticazione richiesta.'
      operationId: listBattles
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: 'Valore di `next_cursor` ottenuto dalla risposta precedente, per caricare la pagina successiva'
          schema:
            type: string
      responses:
        '200':
          description: Lista battle
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/paths/~1battles/post/responses/201/content/application~1json/schema'
                  count:
                    type: integer
                  next_cursor:
                    type: string
                    nullable: true
                    description: Presente solo se ci sono altri risultati. Passalo come `cursor` alla chiamata successiva.
