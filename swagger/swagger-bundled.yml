                    totalRoles: 0
                    message: No job roles available for your company ATECO codes
        '401':
          description: Unauthorized - Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_Error'
              example:
                statusCode: 401
                error: Unauthorized
                message: Authentication required
        '404':
          description: Company not found for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_Error'
              example:
                statusCode: 404
                error: CompanyNotFound
                message: No company profile found for this user. Please create a company profile first.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_Error'
              example:
                statusCode: 500
                error: InternalServerError
                message: An unexpected error occurred while retrieving job roles
  /listings:
    post:
      tags:
        - Job listings
      summary: Create new job listing
      description: |
        Creates a new job listing with two validation modes depending on company sector.

        ---

        ## 🔹 DUE MODALITÀ DI VALIDAZIONE:

        ### 1️⃣ MODALITÀ COMPLETA - Aziende Turismo/Ristorazione (ATECO 55.xx o 56.xx)

        **Quando:** `jobRole` e `contract` sono presenti e compilati

        #### Campi RICHIESTI:
        - `title`, `description`, `startDate`, `endDate`, `positions`
        - `category` (es: "hospitality")
        - `jobRole` (oggetto completo con roleId, roleName, category)
        - `contract` (oggetto completo con calculation da API calculate_base_pay)
        - `contract.paragraph` ("I" o "II")
        - `location` (oggetto con city, country)
        - `schedule` (oggetto con hoursPerWeek e workTimeSlots)
        - `employment` (oggetto con typeId, typeName)

        #### Campi OPZIONALI:
        - `contract.superminimo` (superminimo aziendale)
        - `location.address`, `location.province`, `location.region`, `location.postalCode`, `location.coordinates`
        - `schedule.workDays`, `schedule.notes`
        - `employment.contractDuration`, `employment.benefits`
        - `responsibilities` (mansioni dettagliate)
        - `requirements` (requisiti e qualifiche)
        - `benefits` (benefit offerti)
        - `vitto`, `alloggio`, `alloggioPricePerDay`, `alloggioDescription`
        - `minConsecutiveDays`, `minNoticeDays`
        - `status` ("draft" o "published", default: "draft")
        - `expiresAt` (data scadenza annuncio)

        #### Validazione:
        - ✅ Livelli CCNL predefiniti: Qa, Qb, 1, 2, 3, 4, 5, 6S, 6, 7
        - ✅ Calcolo stipendio automatico via API `calculate_base_pay`
        - ✅ Validazione contro tabelle di riferimento (JobRoles, JobCategories, Contracts, EmploymentTypes)

        ---

        ### 2️⃣ MODALITÀ SEMPLIFICATA - Altri Settori (ATECO != 55.xx e != 56.xx)

        **Quando:** `jobRole` è `null` o `contract` è `null`

        #### Campi RICHIESTI:
        - `title` (titolo annuncio)
        - `description` (descrizione dettagliata)
        - `startDate`, `endDate` (date ISO 8601)
        - `positions` (numero posizioni)
        - `location` (oggetto con `city` e `country` obbligatori)
        - `salary` (stipendio lordo mensile in EUR - inserimento manuale)

        #### Campi OPZIONALI:
        - `jobRole` (può essere null o presente)
        - `contract` (può essere null o presente)
        - `schedule` (può essere null o presente)
        - `employment` (può essere null o presente)
        - `category` (default: "other")
        - `requirements`, `responsibilities`, `benefits` (stringhe o array)
        - `status` ("draft" o "published", default: "draft")
        - `vitto`, `alloggio`, `alloggioPricePerDay`, `alloggioDescription`
        - `minConsecutiveDays`, `minNoticeDays`

        #### Validazione:
        - ✅ Validazione base su formati e range (title length, date order, positions > 0, salary > 0)
        - ✅ NO validazione FIPE
        - ✅ NO calcolo automatico stipendio (inserimento manuale)
        - ✅ NO validazione tabelle di riferimento

        ---

        ## 📋 WORKFLOW:

        ### Workflow Turismo (jobRole e contract presenti):
        1. Call `POST /calculate-base-pay` API to get calculation details
        2. Copy the `calculation` object to `contract.calculation`
        3. Add optional `superminimo` if offering above CCNL minimum
        4. Submit job listing with complete contract information

        ### Workflow Altri Settori (jobRole o contract null):
        1. Inviare POST con i campi base (title, description, positions, location, dates, salary)
        2. Inserire manualmente lo stipendio lordo mensile nel campo `salary`
        3. Opzionalmente includere jobRole, contract, schedule, employment se disponibili
        4. Il BE salva direttamente senza validazioni FIPE

        ---

        ## 🎯 COME VIENE DETERMINATA LA MODALITÀ:

        Il backend rileva automaticamente la modalità basandosi sui campi inviati:
        - Se `jobRole` è `null` O `contract` è `null` → **Modalità Semplificata**
        - Se `jobRole` E `contract` sono entrambi presenti → **Modalità Completa**

        **Nota:** Non serve inviare nessun campo `ccnlType` o simili. La modalità è auto-rilevata.

        ---

        **Use Cases:**
        - ✅ Ristorante/Hotel crea posizione stagionale CCNL-compliant (modalità completa, stipendio calcolato automaticamente)
        - ✅ Software house crea annuncio per sviluppatore (modalità semplificata, jobRole=null, contract=null, salary inserito manualmente)
        - ✅ Negozio retail cerca commesso (modalità semplificata, salary inserito manualmente)
      operationId: createJobListing
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Job listing schema - supports two validation modes:

                **Modalità Completa**: Richiede jobRole e contract completi
                **Modalità Semplificata**: jobRole e/o contract possono essere null
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 200
                  description: Job listing title
                  example: Cameriere di sala per stagione estiva
                description:
                  type: string
                  minLength: 10
                  maxLength: 5000
                  description: Detailed job description
                  example: Cerchiamo cameriere esperto per la stagione estiva 2025 in hotel 4 stelle a Rimini. Ambiente dinamico, team giovane.
                startDate:
                  type: string
                  format: date
                  description: Job start date (ISO 8601). Cannot be more than 30 days in the past.
                  example: '2025-06-01'
                endDate:
                  type: string
                  format: date
                  description: Job end date (ISO 8601). Must be after startDate. Cannot be more than 2 years in the future.
                  example: '2025-09-30'
                positions:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Number of open positions
                  example: 3
                category:
                  type: string
                  description: |
                    Job category - MUST be a valid categoryId from JobCategories table.
                    Examples: hospitality, tourism, retail, food_service, etc.
                  example: hospitality
                jobRole:
                  type: object
                  required:
                    - roleId
                    - roleName
                    - category
                  description: Job role with simplified structure (ATECO removed, now in company profile)
                  properties:
                    roleId:
                      type: string
                      description: |
                        Role ID from JobRoles table.
                        New format: FIPE_L{level}_{seq} (e.g., FIPE_L4_016)
                      example: FIPE_L4_016
                    roleName:
                      type: string
                      description: Display name of the role
                      example: Cameriere di ristorante
                    category:
                      type: string
                      description: Role category (e.g., sala, cucina, bar, reception)
                      example: sala
                    roleDescription:
                      type: string
                      description: Optional detailed role description
                      example: Cameriere addetto al servizio in sala, ai tavoli e gestione ordini
                contract:
                  type: object
                  required:
                    - contractId
                    - ccnlType
                    - level
                    - levelName
                    - description
                    - paragraph
                    - calculation
                  description: |
                    Labor contract reference (CCNL Turismo) with complete calculation details.

                    **IMPORTANT:** You should first call the `calculate_base_pay` API to get the 
                    calculation object, then include it here along with other contract details.
                  properties:
                    contractId:
                      type: string
                      description: |
                        Contract ID:
                        - Per ccnlType='turismo': Pattern CCNL#turismo#{level} (es. CCNL#turismo#4)
                        - Per ccnlType='manuale': Stringa libera (es. "CONTRATTO_COMMERCIO_L3")

                        Valid levels (solo per turismo): Qa, Qb, 1, 2, 3, 4, 5, 6S, 6, 7
                      example: CCNL#turismo#4
                    ccnlType:
                      type: string
                      enum:
                        - turismo
                        - manuale
                      description: |
                        Type of CCNL:
                        - 'turismo': For tourism/hospitality sector companies (ATECO 55.xx.xx or 56.xx.xx)
                        - 'manuale': For companies in other sectors (manual entry of role and pay)

                        **MODIFICATO**: Ora supporta 'manuale' per aziende non del settore turismo/ristorazione.
                      example: turismo
                    level:
                      type: string
                      description: |
                        Contract level:
                        - Per ccnlType='turismo': Qa, Qb, 1-7, 6S (predefiniti CCNL)
                        - Per ccnlType='manuale': Qualsiasi stringa (es. "L3", "Junior", "Senior")

                        Livelli CCNL Turismo:
                        - Qa, Qb: Quadri (management)
                        - 1-7: Livelli (levels)
                        - 6S: Livello 6 Super (transitional level)
                      example: '4'
                    levelName:
                      type: string
                      description: Full level name as per CCNL
                      example: Livello 4
                    description:
                      type: string
                      description: Job description for this CCNL level
                      example: Mansioni operative con conoscenze tecniche in autonomia esecutiva
                    paragraph:
                      type: string
                      description: |
                        CCNL Paragraph (solo per ccnlType='turismo'):
                        - Paragraph I: Standard companies (increments in June)
                        - Paragraph II: Hotel/accommodation companies (increments in September)

                        Per ccnlType='manuale': Campo opzionale, può essere null o qualsiasi valore.

                        This is determined by the company's FIPE category and should match 
                        the company profile.
                      example: II
                    coefficient:
                      type: number
                      format: decimal
                      description: |
                        Optional: CCNL coefficient for this level.
                        Used for seniority calculations and other contractual purposes.
                      example: 3.36
                    calculation:
                      type: object
                      required:
                        - basePay
                        - contingencyAllowance
                        - grossBasePay
                        - calculationDate
                      description: |
                        Complete base pay calculation details from calculate_base_pay API.

                        **WORKFLOW:**
                        1. Call POST /calculate-base-pay with companyId and level
                        2. Copy the entire 'calculation' object from the response
                        3. Include it here in the contract
                      properties:
                        basePay:
                          type: number
                          format: decimal
                          description: |
                            Monthly base pay (Paga Base Mensile) as per CCNL table.
                            Varies by level and paragraph, updated according to contract schedule.
                          example: 1127.75
                        contingencyAllowance:
                          type: number
                          format: decimal
                          description: |
                            Contingency allowance (Indennità di Contingenza).
                            Fixed amount that varies by level.
                          example: 524.94
                        article162Reduction:
                          type: number
                          format: decimal
                          description: |
                            Optional: Reduction for small businesses (≤15 employees) as per Article 162.
                            Only present if company has isSmallBusiness = true.
                          example: 3.36
                        grossBasePay:
                          type: number
                          format: decimal
                          description: |
                            Total gross base pay (RETRIBUZIONE BASE LORDA MENSILE).
                            Formula: basePay + contingencyAllowance - article162Reduction

                            This is validated by the API to ensure correctness.
                          example: 1649.33
                        calculationDate:
                          type: string
                          format: date-time
                          description: |
                            Date when this calculation was performed (ISO 8601).
                            Important for audit trail and determining which CCNL rates were applied.
                          example: '2025-11-20T00:00:00Z'
                        formula:
                          type: string
                          description: |
                            Optional: Human-readable formula showing the calculation.
                            Useful for documentation and transparency.
                          example: 1127.75 + 524.94 - 3.36 = 1649.33 €
                        explanation:
                          type: string
                          description: |
                            Optional: Detailed explanation of the calculation in Italian.
                            Includes breakdown of each component and applicable notes.
                            Can be displayed to users or stored for compliance.
                          example: |-
                            Calcolo della retribuzione base lorda per il livello 4...

                            1. Paga Base Mensile: 1127.75 €
                            2. Indennità di Contingenza: +524.94 €
                            3. Riduzione Art. 162: -3.36 €

                            RETRIBUZIONE BASE LORDA MENSILE: 1649.33 €
                    superminimo:
                      type: object
                      description: |
                        Optional: Additional pay above CCNL minimum (Superminimo Individuale).
                        This is company-specific extra compensation beyond the contractual minimum.
                        Common reasons: experience, qualifications, market conditions, retention.
                      properties:
                        amount:
                          type: number
                          format: decimal
                          minimum: 0
                          description: Monthly superminimo amount in addition to grossBasePay
                          example: 200
                        currency:
                          type: string
                          enum:
                            - EUR
                            - USD
                            - GBP
                          default: EUR
                          description: Currency (must match basePay currency)
                          example: EUR
                        description:
                          type: string
                          maxLength: 500
                          description: |
                            Reason or description for the superminimo.
                            Best practice: document why this extra pay is offered.
                          example: Superminimo aziendale per esperienza e qualifica superiore
                location:
                  type: object
                  required:
                    - city
                    - country
                  properties:
                    address:
                      type: string
                      maxLength: 200
                      example: Lungomare Augusto 123
                    city:
                      type: string
                      maxLength: 100
                      example: Rimini
                    province:
                      type: string
                      maxLength: 10
                      example: RN
                    region:
                      type: string
                      maxLength: 100
                      example: Emilia-Romagna
                    country:
                      type: string
                      maxLength: 2
                      example: IT
                    postalCode:
                      type: string
                      maxLength: 20
                      example: '47921'
                    coordinates:
                      type: object
                      properties:
                        lat:
                          type: number
                          format: decimal
                          minimum: -90
                          maximum: 90
                          example: 44.0678
                        lon:
                          type: number
                          format: decimal
                          minimum: -180
                          maximum: 180
                          example: 12.5695
                schedule:
                  type: object
                  required:
                    - hoursPerWeek
                    - workTimeSlots
                  description: |
                    Work schedule definition.

                    **Key Concepts:**
                    - `hoursPerWeek`: Total weekly hours (must comply with CCNL limits: 20-48 for most levels)
                    - `workTimeSlots`: Detailed schedule with time slots per day group
                    - `workDays`: Summary list of all working days (should match days in workTimeSlots)
                  properties:
                    hoursPerWeek:
                      type: integer
                      minimum: 20
                      maximum: 48
                      description: |
                        Weekly working hours (must be compatible with contract level).

                        CCNL Turismo limits:
                        - Quadri (Qa, Qb): 40h standard, 24-48h range
                        - Livelli 1-7: 40h standard, 20-48h range
                      example: 40
                    workTimeSlots:
                      type: array
                      minItems: 1
                      description: |
                        Detailed work time slot definitions.

                        Each slot defines:
                        - type: 'single' (continuous), 'split' (with break), or 'flexible'
                        - slots: actual time ranges (HH:MM format, 24h)
                        - days: which days this schedule applies to

                        **Different from workDays:** workTimeSlots allows different schedules 
                        for different day groups (e.g., lunch shift Mon-Wed, dinner shift Thu-Sat).
                      items:
                        type: object
                        required:
                          - type
                          - slots
                        properties:
                          type:
                            type: string
                            enum:
                              - single
                              - split
                              - flexible
                            description: |
                              Shift type:
                              - single: Continuous shift (e.g., 9:00-17:00)
                              - split: Split shift with break (e.g., 11:00-14:00, 18:00-22:00)
                              - flexible: Flexible hours within range
                            example: single
                          slots:
                            type: array
                            minItems: 1
                            description: Time slot ranges
                            items:
                              type: object
                              required:
                                - start
                                - end
                              properties:
                                start:
                                  type: string
                                  pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                                  description: Start time in HH:MM format (24h)
                                  example: '17:00'
                                end:
                                  type: string
                                  pattern: ^([01]\d|2[0-3]):([0-5]\d)$
                                  description: End time in HH:MM format (24h)
                                  example: '23:00'
                          days:
                            type: array
                            items:
                              type: string
                              enum:
                                - monday
                                - tuesday
                                - wednesday
                                - thursday
                                - friday
                                - saturday
                                - sunday
                            description: |
                              Days when THIS specific time slot applies.

                              This allows different schedules for different day groups.
                              Example: lunch shift Mon-Wed, dinner shift Thu-Sat.
                            example:
                              - monday
                              - tuesday
                              - wednesday
                              - thursday
                              - friday
                              - saturday
                      example:
                        - type: single
                          slots:
                            - start: '17:00'
                              end: '23:00'
                          days:
                            - monday
                            - tuesday
                            - wednesday
                            - thursday
                            - friday
                            - saturday
                    workDays:
                      type: array
                      items:
                        type: string
                        enum:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          - sunday
                      description: |
                        Summary: All days when work is performed (union of all days in workTimeSlots).

                        **Purpose:** Quick overview for filtering and display.
                        **Detail:** See workTimeSlots[].days for specific schedules per day group.

                        Best practice: This should be the union of all 'days' arrays in workTimeSlots.
                      example:
                        - monday
                        - tuesday
                        - wednesday
                        - thursday
                        - friday
                        - saturday
                    notes:
                      type: string
                      maxLength: 500
                      description: Additional schedule information (breaks, flexibility, rotation notes)
                      example: Turni serali con un giorno di riposo infrasettimanale. Possibilità di turnazione per eventi speciali.
                employment:
                  type: object
                  required:
                    - typeId
                  description: Employment type (must be valid typeId from EmploymentTypes table)
                  properties:
                    typeId:
                      type: string
                      description: |
                        Employment type ID from EmploymentTypes table.
                        Examples: full_time, part_time, seasonal, on_call, internship, etc.
                      example: seasonal
                    typeName:
                      type: string
                      description: Display name of employment type
                      example: Stagionale
                    contractDuration:
                      type: string
                      enum:
                        - determinato
                        - indeterminato
                      description: |
                        Contract duration type:
                        - determinato: Fixed-term (common for seasonal)
                        - indeterminato: Permanent/indefinite
                      example: determinato
                    benefits:
                      type: array
                      items:
                        type: string
                      description: Additional benefits offered
                      example:
                        - Alloggio incluso
                        - Vitto completo
                        - Bonus produzione fine stagione
                responsibilities:
                  type: string
                  maxLength: 5000
                  description: Job responsibilities and duties
                  example: |-
                    • Accoglienza e gestione clienti con cortesia
                    • Servizio ai tavoli e consulenza sul menù
                    • Gestione ordini e coordinamento con la cucina
                    • Preparazione mise en place sala e tavoli
                requirements:
                  type: string
                  maxLength: 5000
                  description: Job requirements and qualifications
                  example: |-
                    • Esperienza minima 1 anno come cameriere
                    • Disponibilità a lavorare nei weekend
                    • Conoscenza base lingua inglese (B1)
                    • Ottime capacità relazionali
                benefits:
                  type: string
                  maxLength: 5000
                  description: Benefits and perks offered
                  example: |-
                    • Alloggio fornito dalla struttura
                    • Vitto completo incluso
                    • Mance secondo policy aziendale
                    • Bonus fine stagione basato su performance
                salary:
                  type: number
                  format: decimal
                  minimum: 0
                  maximum: 999999
                  description: |
                    Monthly gross salary in EUR (manual entry).

                    **REQUIRED for Modalità Semplificata** (when jobRole is null or contract is null).
                    **NOT used in Modalità Completa** (salary is calculated automatically via contract.calculation).

                    This field allows companies in non-tourism sectors to manually specify 
                    the monthly gross salary for the position.
                  example: 2500
                vitto:
                  type: boolean
                  description: Indicates if meals are provided to workers
                  default: false
                  example: true
                alloggio:
                  type: boolean
                  description: Indicates if accommodation is provided to workers
                  default: false
                  example: true
                alloggioPricePerDay:
                  type: number
                  format: decimal
                  minimum: 0
                  maximum: 500
                  description: |
                    Optional: Price per day for accommodation (if alloggio=true).
                    This is the daily rate charged to workers for the provided accommodation.
                  example: 15
                alloggioDescription:
                  type: string
                  maxLength: 1000
                  description: |
                    Optional: Description of the accommodation (if alloggio=true).
                    Details about rooms, facilities, location, etc.
                  example: Camera doppia in residence a 100m dal lavoro. Wi-Fi, cucina condivisa, biancheria inclusa.
                minConsecutiveDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: |
                    Minimum number of consecutive days required for a booking.
                    If set, workers must book at least this many days consecutively.
                    Example: Setting to 7 means workers must book at least one week.
                  example: 7
                minNoticeDays:
                  type: integer
                  minimum: 0
                  maximum: 90
                  description: |
                    Minimum number of days in advance required for booking.
                    If set, workers cannot book last-minute; they must book at least this many days before the start date.
                    Example: Setting to 5 means workers must book at least 5 days in advance (cannot book for tomorrow).
                  example: 5
                status:
                  type: string
                  enum:
                    - draft
                    - published
                  default: draft
                  description: |
                    Initial listing status:
                    - draft: Not visible to job seekers
                    - published: Immediately visible to job seekers
                  example: published
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional expiration date for the listing (ISO 8601)
                  example: '2025-05-31T23:59:59Z'
            examples:
              seasonalWaiterParagraph2:
                summary: Seasonal waiter - Paragraph II (hotel company)
                description: |
                  Complete example for a seasonal waiter position in a small hotel (≤15 employees).
                  - Uses Paragraph II (hotel company, September increments)
                  - Includes Art. 162 reduction (small business)
                  - Single evening shift
                  - Includes superminimo for experience
                value:
                  title: Cameriere di sala per stagione estiva
                  description: Cerchiamo cameriere esperto per la stagione estiva 2025 in hotel 4 stelle a Rimini. Ambiente dinamico, team giovane. Contratto stagionale con possibilità di rinnovo.
                  startDate: '2025-06-01'
                  endDate: '2025-09-30'
                  positions: 3
                  category: hospitality
                  jobRole:
                    roleId: FIPE_L4_016
                    roleName: Cameriere di ristorante
                    category: sala
                    roleDescription: Cameriere addetto al servizio in sala, ai tavoli e gestione ordini
                  contract:
                    contractId: CCNL#turismo#4
                    ccnlType: turismo
                    level: '4'
                    levelName: Livello 4
                    description: Mansioni operative con conoscenze tecniche in autonomia esecutiva
                    paragraph: II
                    coefficient: 3.36
                    calculation:
                      basePay: 1127.75
                      contingencyAllowance: 524.94
                      article162Reduction: 3.36
                      grossBasePay: 1649.33
                      calculationDate: '2025-11-20T00:00:00Z'
                      formula: 1127.75 + 524.94 - 3.36 = 1649.33 €
                      explanation: |-
                        Calcolo della retribuzione base lorda per il livello 4 (Livello 4):

                        1. Paga Base Mensile (Paragrafo II - aziende alberghiere, incrementi settembre): 1127.75 €
                           - Importo aggiornato alla data 2025-09-01

                        2. Indennità di Contingenza: +524.94 €

                        3. Riduzione Art. 162 (Aziende Minori ≤15 dipendenti): -3.36 €

                        RETRIBUZIONE BASE LORDA MENSILE: 1649.33 €
                    superminimo:
                      amount: 200
                      currency: EUR
                      description: Superminimo aziendale per esperienza e qualifica superiore
                  location:
                    address: Lungomare Augusto 123
                    city: Rimini
                    province: RN
                    region: Emilia-Romagna
                    country: IT
                    postalCode: '47921'
                    coordinates:
                      lat: 44.0678
                      lon: 12.5695
                  schedule:
                    hoursPerWeek: 40
                    workTimeSlots:
                      - type: single
                        slots:
                          - start: '17:00'
                            end: '23:00'
                        days:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                    workDays:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                      - saturday
                    notes: Turni serali con un giorno di riposo infrasettimanale (domenica)
                  employment:
                    typeId: seasonal
                    typeName: Stagionale
                    contractDuration: determinato
