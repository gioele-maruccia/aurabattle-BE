                  sticker:
                    type: string
                    example: thumbs_up
        '400':
          description: Bad request - Invalid sticker
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Invalid sticker. Valid values: [''thumbs_up'', ''heart'', ''smile'', ''fire'', ''check'', ''question'']'
        '403':
          description: Forbidden - User not authorized
        '404':
          description: Message not found (wrong timestamp or messageId)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Message msg_xyz789 not found
  /support-chats/{supportChatId}/upload-url:
    post:
      tags:
        - Support Chat
      summary: Get upload URL for support chat attachment
      description: |
        Generates presigned S3 upload URL for file upload in support chat.

        **Important Differences from Chat Upload:**
        - Uses POST method with JSON body (not GET with query params)
        - Includes file size validation (max 10MB)
        - Returns both upload and download URLs

        **Workflow:**
        1. Call this endpoint to get presigned upload URL
        2. Upload file directly to S3 using returned uploadUrl
        3. Include returned s3Key/downloadUrl in message attachments
      operationId: getSupportUploadUrl
      security:
        - CognitoAuth: []
      parameters:
        - name: supportChatId
          in: path
          required: true
          description: Support chat ID
          schema:
            type: string
            example: support_abc123def456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileName
                - fileType
                - fileSize
              properties:
                fileName:
                  type: string
                  description: Original filename with extension
                  example: screenshot.png
                fileType:
                  type: string
                  description: File MIME type
                  example: image/png
                fileSize:
                  type: integer
                  description: File size in bytes (max 10MB = 10485760)
                  maximum: 10485760
                  example: 125000
      responses:
        '200':
          description: Upload URL generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    format: uri
                    description: Presigned S3 URL for file upload (valid 1 hour)
                    example: https://dev-beezey-chat-attachments.s3.amazonaws.com/support-chat/...
                  downloadUrl:
                    type: string
                    format: uri
                    description: URL to use in message attachment (valid 7 days)
                    example: https://dev-beezey-chat-attachments.s3.amazonaws.com/support-chat/...
                  fileName:
                    type: string
                    description: Original filename
                    example: screenshot.png
                  s3Key:
                    type: string
                    description: S3 object key
                    example: support-chat/support_abc/2025-12-17T15:30:00_uuid_screenshot.png
        '400':
          description: Bad request - File too large or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - File size exceeds maximum allowed size of 10MB
                      - fileName, fileType, and fileSize are required
        '403':
          description: Forbidden - User not authorized
        '404':
          description: Support chat not found
  /support-chats/{supportChatId}/download-url:
    get:
      tags:
        - Support Chat
      summary: Get download URL for support message attachments
      description: |
        Generates presigned S3 download URLs for all attachments in a support chat message.

        **Requirements:**
        - User must be participant in the support chat (client or admin)
        - Message must exist and have attachments

        **URL Validity:**
        - Download URLs expire after 1 hour (3600 seconds)
        - Can be used multiple times until expiration

        **Use Cases:**
        - Download documents shared in support chat
        - Preview images before downloading
        - Access previously uploaded files
      operationId: getSupportDownloadUrl
      security:
        - CognitoAuth: []
      parameters:
        - name: supportChatId
          in: path
          required: true
          description: Support Chat ID
          schema:
            type: string
            example: support_chat_abc123
        - name: messageId
          in: query
          required: true
          description: Message ID containing attachments
          schema:
            type: string
            example: msg_abc123def456
      responses:
        '200':
          description: Download URLs generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    description: List of download URLs for each attachment
                    items:
                      type: object
                      properties:
                        fileName:
                          type: string
                          description: Original file name
                          example: screenshot.png
                        fileType:
                          type: string
                          description: MIME type of the file
                          example: image/png
                        fileSize:
                          type: integer
                          description: File size in bytes
                          example: 248063
                        downloadUrl:
                          type: string
                          format: uri
                          description: Presigned S3 URL for downloading (valid 1 hour)
                          example: https://dev-beezey-chat-attachments.s3.amazonaws.com/support_chat_abc/screenshot.png?X-Amz-...
                  expiresIn:
                    type: integer
                    description: URL expiration in seconds
                    example: 3600
              examples:
                single_attachment:
                  summary: Single image attachment
                  value:
                    attachments:
                      - fileName: screenshot.png
                        fileType: image/png
                        fileSize: 248063
                        downloadUrl: https://dev-beezey-chat-attachments.s3.amazonaws.com/support_chat_abc/screenshot.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&...
                    expiresIn: 3600
                multiple_attachments:
                  summary: Multiple attachments
                  value:
                    attachments:
                      - fileName: issue.pdf
                        fileType: application/pdf
                        fileSize: 158835
                        downloadUrl: https://dev-beezey-chat-attachments.s3.amazonaws.com/support_chat_abc/issue.pdf?...
                      - fileName: log.txt
                        fileType: text/plain
                        fileSize: 2048
                        downloadUrl: https://dev-beezey-chat-attachments.s3.amazonaws.com/support_chat_abc/log.txt?...
                    expiresIn: 3600
        '400':
          description: Bad request - Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: messageId is required
        '403':
          description: Forbidden - User is not authorized to access this support chat
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: You are not authorized to access this support chat
        '404':
          description: Not found - Support chat or message doesn't exist, or message has no attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Message not found or has no attachments
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to generate download URLs
  /reference-data:
    get:
      tags:
        - Reference data
      summary: Get reference data (Public)
      description: |
        Retrieves reference data for job listings including job roles, contracts, 
        job categories, and employment types. This data is typically used for 
        dropdowns and filters in the UI.

        **Returns:**
        - All reference data types by default
        - Specific type if 'type' parameter is provided
        - Only active items by default (use activeOnly=false to include inactive)

        **Useful for:**
        - Populating dropdown menus
        - Building search filters
        - Form validation options
        - Category browsing

        **Data types available:**
        - jobRoles: Available job positions (Chef, Waiter, etc.)
        - contracts: Contract types (Full-time, Part-time, etc.)
        - categories: Job categories (Hospitality, Healthcare, etc.)
        - employmentTypes: Employment types (Permanent, Temporary, etc.)

        **Caching:**
        Response includes Cache-Control header suggesting 1-hour cache.
        This is appropriate as reference data changes infrequently.
      operationId: getReferenceData
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - jobRoles
              - contracts
              - categories
              - employmentTypes
          description: |
            Optional filter to get specific type only.
            If omitted, returns all types.
          example: jobRoles
        - name: activeOnly
          in: query
