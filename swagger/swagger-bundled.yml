openapi: 3.0.3
info:
  title: Aura Battle - API Documentation
  description: |
    API documentation for the Aura Battle platform.

    Endpoints appear here progressively as each backend piece is deployed.

    ---

    ## Authentication
    Use **POST /auth/login/users** with user credentials (Cognito).

    ### How to Authenticate:
    1. Open **POST /auth/login/users**
    2. Click "Try it out"
    3. Enter email and password
    4. Click "Execute"
    5. Copy the `idToken` from the response
    6. Click the "Authorize" button (lock icon) at the top
    7. Paste the token and click "Authorize"
    8. Now you can test all protected endpoints

    **Note:** Token expires after 1 hour. Re-login to get a new token.
  version: 0.1.0
  contact:
    name: API Support
    email: gioele.maruccia@iocivivo.it
servers:
  - url: 'http://localhost:8081'
    description: '[DEV] Local Development (via Auth Proxy)'
  - url: 'http://localhost:8082'
    description: '[PROD] ⚠️ Local Development (via Auth Proxy) - PRODUZIONE REALE'
  - url: 'http://host.docker.internal:8081'
    description: '[DEV] Local Development (via Auth Proxy - Docker-to-Docker)'
  - url: 'https://hk3y2bs3ph.execute-api.eu-south-1.amazonaws.com/dev-aurabattle/v1'
    description: '[DEV-AURABATTLE] User API (Direct)'
  - url: 'https://ln6a4z3lp4.execute-api.eu-south-1.amazonaws.com/dev-aurabattle/v1'
    description: '[DEV-AURABATTLE] Battles API (Direct)'
  - url: 'https://ytgs3hvtrh.execute-api.eu-south-1.amazonaws.com/prod-aurabattle/v1'
    description: '[PROD-AURABATTLE] User API (Direct)'
  - url: 'https://f07ziuaot5.execute-api.eu-south-1.amazonaws.com/prod-aurabattle/v1'
    description: '[PROD-AURABATTLE] Battles API (Direct)'
tags:
  - name: Authentication
    description: Cognito authentication endpoints
  - name: User Profile & Settings
    description: User profile management and preferences
  - name: Battles
    description: Creazione e gestione delle aura battle
components:
  securitySchemes:
    CognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from /auth/login/users endpoint.
        Token expires after 1 hour.
paths:
  /auth/login/users:
    post:
      tags:
        - Authentication
      summary: User Login
      description: |
        Authenticate app users with Cognito.

        **User Pool:** eu-south-1_ULXAFvzY9 (dev-aurabattle)
        **Client ID:** 1si0vr079rbrvtck9ht4cpob78

        **Usage:**
        1. Enter your user credentials
        2. Click "Execute"
        3. Copy the `idToken`
        4. Click "Authorize" at top and paste token
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Cognito username (email)
                  example: user@example.com
                password:
                  type: string
                  format: password
                  description: User password
                  example: YourPassword123
            example:
              username: you@example.com
              password: YourPassword123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  idToken:
                    type: string
                    description: JWT ID token - use this for Authorization header
                    example: eyJraWQiOiJ1SUY5M...
                  accessToken:
                    type: string
                    description: Access token
                  refreshToken:
                    type: string
                    description: Refresh token (valid for 30 days)
                  expiresIn:
                    type: integer
                    description: Token expiration in seconds (3600 = 1 hour)
                    example: 3600
                  tokenType:
                    type: string
                    example: Bearer
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/paths/~1battles/post/responses/400/content/application~1json/schema'
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: User Signup (dev/test only)
      description: |
        Crea un nuovo utente su Cognito.

        Per default (`auto_confirm` assente o `false`) si comporta come farà
        l'app: Cognito invia una mail con un codice, che poi confermi con
        **POST /auth/confirm**. Imposta `auto_confirm: true` solo per bypassare
        la mail e creare rapidamente account di test.

        **Nota:** questo endpoint esiste solo nel proxy locale (`auth-proxy.js`),
        non è un'API AWS reale — è una comodità per lo sviluppo/testing.

        **Usage (flusso reale, default):**
        1. Compila email, password, nome e cognome
        2. Click "Execute"
        3. Controlla la mail per il codice
        4. Usa **POST /auth/confirm** con email e codice
        5. Ora puoi fare login con **POST /auth/login/users**

        **Usage (bypass rapido per test):**
        1. Compila i campi e imposta `auto_confirm: true`
        2. Click "Execute"
        3. L'account viene creato e confermato: ora puoi fare login con
           **POST /auth/login/users**
      operationId: userSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  format: email
                  example: test@example.com
                password:
                  type: string
                  format: password
                  description: 'Minimo 8 caratteri, maiuscola, minuscola, numero'
                  example: TestAura123!
                given_name:
                  type: string
                  example: Mario
                family_name:
                  type: string
                  example: Rossi
                auto_confirm:
                  type: boolean
                  default: false
                  description: |
                    Se false (default), rispecchia il flusso reale dell'app: Cognito
                    invia il codice via mail, confermalo con POST /auth/confirm.
                    Se true, conferma subito senza mail (solo per test rapidi).
                  example: false
      responses:
        '201':
          description: Account creato e confermato
          content:
            application/json:
              schema:
                type: object
                properties:
                  userSub:
                    type: string
                    example: 769ea220-0041-7031-53c8-1695c582b409
                  confirmed:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          description: 'Richiesta non valida (es. password debole, utente già esistente)'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1battles/post/responses/400/content/application~1json/schema'
  /auth/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm Signup (email code)
      description: |
        Conferma la registrazione con il codice ricevuto via email
        (da usare quando il signup è stato fatto con `auto_confirm: false`).

        **Nota:** questo endpoint esiste solo nel proxy locale (`auth-proxy.js`),
        non è un'API AWS reale.
      operationId: userConfirmSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - code
              properties:
                username:
                  type: string
                  format: email
                  example: test@example.com
                code:
                  type: string
                  description: Codice a 6 cifre ricevuto via email
                  example: '123456'
      responses:
        '200':
          description: Account confermato
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          description: Codice non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/paths/~1battles/post/responses/400/content/application~1json/schema'
  /profile:
    get:
      tags:
        - User Profile & Settings
      summary: Get user profile
      description: |
        Retrieve the authenticated user's profile.
      operationId: getUserProfile
      security:
        - CognitoAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  email:
                    type: string
                    format: email
                    example: mario.rossi@example.com
                  profile:
                    $ref: '#/paths/~1profile/put/requestBody/content/application~1json/schema/properties/profile'
                  display_name:
                    type: string
                    description: Nome pubblico mostrato agli altri utenti
                    example: Mario
                  avatar_url:
                    type: string
                    nullable: true
                    example: null
                  account_status:
                    type: string
                    enum:
                      - active
                      - suspended
                      - banned
                    example: active
                  hosted_battles_count:
                    type: integer
                    example: 0
                  joined_battles_count:
                    type: integer
                    example: 0
                  verifications:
                    type: object
                    properties:
                      email_verified:
                        type: boolean
                      phone_verified:
                        type: boolean
                  aura_stats:
                    type: object
                    description: 'Placeholder statistiche aura, da definire con le regole delle battle'
                    properties:
                      level:
                        type: integer
                        example: 0
                      wins:
                        type: integer
                        example: 0
                      losses:
                        type: integer
                        example: 0
                  notification_preferences:
                    $ref: '#/paths/~1settings/patch/requestBody/content/application~1json/schema/properties/notification_preferences'
                  localization:
                    type: object
                    properties:
                      preferred_language:
                        type: string
                        example: it
                      timezone:
                        type: string
                        example: Europe/Rome
                  bookmarked_battles:
                    type: array
                    items:
                      type: string
                    description: Array di ID delle battle salvate dall'utente
                    example: []
                  created_at:
                    type: string
                    format: date-time
                    example: '2026-01-15T10:30:00Z'
                  updated_at:
                    type: string
                    format: date-time
                    example: '2026-01-15T10:30:00Z'
              examples:
                profile:
                  summary: User profile
                  value:
                    user_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    email: mario.rossi@example.com
                    profile:
                      given_name: Mario
                      family_name: Rossi
                      phone_number: '+393331234567'
                    display_name: Mario
                    avatar_url: null
                    account_status: active
                    hosted_battles_count: 0
                    joined_battles_count: 0
                    verifications:
                      email_verified: true
                      phone_verified: false
                    aura_stats:
                      level: 0
                      wins: 0
                      losses: 0
                    notification_preferences:
                      email_enabled: false
                      push_enabled: false
                      channels:
                        new_battles: false
                        battle_reminders: false
                        messages: false
                        marketing: false
                    localization:
                      preferred_language: it
                      timezone: Europe/Rome
                    bookmarked_battles: []
                    created_at: '2026-01-15T10:30:00Z'
                    updated_at: '2026-01-15T10:30:00Z'
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Specific error code for authentication errors
                    example: 401
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: Invalid or missing authentication token
              examples:
                missingToken:
                  summary: Missing token
                  value:
                    code: 401
                    error: Unauthorized
                    message: Authorization header is missing
                invalidToken:
                  summary: Invalid token
                  value:
                    code: 401
                    error: Unauthorized
                    message: Invalid authentication token
                expiredToken:
                  summary: Expired token
                  value:
                    code: 401
                    error: Unauthorized
                    message: Token has expired
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Specific error code (e.g., 4011 for listing not found, 4026 for booking not found)'
                    example: 4011
                  error:
                    type: string
                    example: Not Found
                  message:
                    type: string
                    example: The requested resource was not found
                  resource_type:
                    type: string
                    example: Profile
                  resource_id:
                    type: string
                    nullable: true
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              examples:
                profileNotFound:
                  summary: Profile not found
                  value:
                    code: 4042
                    error: Not Found
                    message: Profile not found
                    resource_type: Profile
                userNotFound:
                  summary: User not found in Cognito
                  value:
                    code: 4026
                    error: Not Found
                    message: User not found in Cognito
                    resource_type: User
                    resource_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Specific error code (e.g., 5003 for booking check error, 5010 for general server error)'
                    example: 5003
                  error:
                    type: string
                    example: Internal Server Error
                  message:
                    type: string
                    example: An unexpected error occurred
              examples:
                generic:
                  summary: Generic error
                  value:
                    code: 5010
                    error: Internal Server Error
                    message: An unexpected error occurred
                databaseError:
                  summary: Database error
                  value:
                    code: 5003
                    error: Database Error
                    message: Unable to access database
                serviceUnavailable:
                  summary: Service unavailable
                  value:
                    code: 5010
                    error: Service Unavailable
                    message: The service is temporarily unavailable
    put:
      tags:
        - User Profile & Settings
      summary: Update user profile
      description: |
        Update user profile information including personal details and address.
        Updates both Cognito (name, phone) and DynamoDB (all fields).
      operationId: updateUserProfile
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: object
                  description: Informazioni base del profilo utente
                  properties:
                    given_name:
                      type: string
                      example: Mario
                    family_name:
                      type: string
                      example: Rossi
                    phone_number:
                      type: string
                      example: '+393331234567'
                address:
                  type: object
                  description: User address information
                  properties:
                    street:
                      type: string
                      maxLength: 200
                      example: Via Roma 123
                    city:
                      type: string
                      maxLength: 100
                      example: Milano
                    postal_code:
                      type: string
                      maxLength: 20
                      example: '20100'
                    province:
                      type: string
                      maxLength: 2
                      example: MI
                    country:
                      type: string
                      maxLength: 2
                      default: IT
                      example: IT
                display_name:
                  type: string
                  description: Nome pubblico mostrato agli altri utenti
                  example: Mario R.
                avatar_url:
                  type: string
                  example: 'https://cdn.example.com/avatars/user123.jpg'
            examples:
              updateName:
                summary: Update name only
                value:
                  profile:
                    given_name: Mario
                    family_name: Rossi
              updateDisplayNameAndAvatar:
                summary: Update display name and avatar
                value:
                  display_name: Mario R.
                  avatar_url: 'https://cdn.example.com/avatars/user123.jpg'
              updateAddress:
                summary: Update address only
                value:
                  address:
                    street: Via Roma 123
                    city: Milano
                    postal_code: '20100'
                    province: MI
                    country: IT
              fullUpdate:
                summary: Update everything
                value:
                  profile:
                    given_name: Mario
                    family_name: Rossi
                    phone_number: '+393331234567'
                  address:
                    street: Via Roma 123
                    city: Milano
                    postal_code: '20100'
                    province: MI
                    country: IT
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Profile updated successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No fields to update
        '401':
          $ref: '#/paths/~1profile/get/responses/401'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: User not found in Cognito
        '500':
          $ref: '#/paths/~1profile/get/responses/500'
  /settings:
    patch:
      tags:
        - User Profile & Settings
      summary: Update user settings
      description: |
        Update user preferences including notifications, localization, translation, and payment settings.
        Supports partial updates - only send fields you want to change.
      operationId: updateUserSettings
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_preferences:
                  type: object
                  description: User notification preferences
                  properties:
                    email_enabled:
                      type: boolean
                      description: Enable email notifications
                      example: false
                    push_enabled:
                      type: boolean
                      description: Enable push notifications
                      example: false
                    channels:
                      type: object
                      description: Notification channels preferences
                      properties:
                        new_battles:
                          type: boolean
                          description: Notify about new battles
                          example: false
                        battle_reminders:
                          type: boolean
                          description: Notify about upcoming battle reminders
                          example: false
                        messages:
                          type: boolean
                          description: Notify about new chat messages
                          example: false
                        marketing:
                          type: boolean
                          description: Receive marketing communications
                          example: false
                      required:
                        - new_battles
                        - battle_reminders
                        - messages
                        - marketing
                  required:
                    - email_enabled
                    - push_enabled
                    - channels
                localization:
                  type: object
                  description: User localization and language preferences
                  properties:
                    preferred_language:
                      type: string
                      enum:
                        - it
                        - en
                        - es
                        - fr
                        - de
                      description: Preferred interface language
                      example: it
                    timezone:
                      type: string
                      description: User timezone (IANA format)
                      example: Europe/Rome
                    currency:
                      type: string
                      enum:
                        - EUR
                        - USD
                        - GBP
                      description: Preferred currency
                      example: EUR
                    auto_translation_enabled:
                      type: boolean
                      description: Enable automatic translation of job listings and chat messages
                      example: false
                  required:
                    - preferred_language
                    - timezone
                    - currency
                    - auto_translation_enabled
                payment_preferences:
                  type: object
                  description: User payment preferences and Stripe integration
                  properties:
                    stripe_customer_id:
                      type: string
                      description: Stripe customer ID
                      example: cus_Qh3K7L8M9N0P1Q
                      nullable: true
                    default_payment_method:
                      type: string
                      description: Stripe payment method ID
                      example: pm_1QrS2tUvWxYz012
                      nullable: true
                    billing_address:
                      type: object
                      description: Billing address for payments
                      nullable: true
                      properties:
                        line1:
                          type: string
                          example: Via Roma 123
                        line2:
                          type: string
                          nullable: true
                          example: Interno 5
                        city:
                          type: string
                          example: Roma
                        state:
                          type: string
                          nullable: true
                          example: RM
                        postal_code:
                          type: string
                          example: '00100'
                        country:
                          type: string
                          maxLength: 2
                          example: IT
                    auto_renew:
                      type: boolean
                      description: Automatically renew premium subscription
                      default: true
                      example: true
            examples:
              enableTranslation:
                summary: Enable auto-translation
                value:
                  localization:
                    auto_translation_enabled: true
              updateNotifications:
                summary: Disable marketing emails
                value:
                  notification_preferences:
                    channels:
                      marketing: false
              updatePayment:
                summary: Set payment method
                value:
                  payment_preferences:
                    stripe_customer_id: cus_Qh3K7L8M9N0P1Q
                    default_payment_method: pm_1QrS2tUvWxYz012
              fullUpdate:
                summary: Update all settings
                value:
                  notification_preferences:
                    email_enabled: true
                    channels:
                      marketing: false
                  localization:
                    preferred_language: en
                    auto_translation_enabled: true
                  payment_preferences:
                    default_payment_method: pm_1QrS2tUvWxYz012
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Settings updated successfully
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No settings to update
        '401':
          $ref: '#/paths/~1profile/get/responses/401'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Profile not found
        '500':
          $ref: '#/paths/~1profile/get/responses/500'
  /profile/delete-account-simple:
    post:
      tags:
        - User Profile & Settings
      summary: Request account deletion (stub)
      description: |
        **Stub endpoint** — marks the account as scheduled for deletion in 15 days.

        This is a placeholder for frontend integration. The full deletion flow
        (grace period, booking suspension, job listing pause, auto-restore on login)
        is handled by the `POST /profile/delete-request` endpoint once fully deployed.
      security:
        - CognitoAuth: []
      responses:
        '200':
          description: Account marked for deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: account marked to be deleted in 15gg
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Internal server error
  '/users/{userId}/fcm-token':
    post:
      tags:
        - User API
      summary: Register FCM Token
      description: |
        Register or update Firebase Cloud Messaging (FCM) token for push notifications.

        **Called after every user login** - the FCM token can change on each login,
        so the app should call this endpoint after each successful authentication.

        The token is stored in the user's profile and used to send push notifications for:

        **1. Chat Messages** - When a new message is received:
        ```json
        {
          "notification": {
            "title": "Francesco Cassano",
            "body": "Ciao, come va?..."
          },
          "data": {
            "actionType": "chat",
            "chatId": "chat-uuid",
            "bookingId": "booking-uuid",
            "bookingStatus": "confirmed",
            "jobListingId": "listing-uuid",
            "senderId": "sender-uuid",
            "senderName": "Francesco Cassano",
            "bookingRange": "2026/02/01 - 2026/10/10",
            "jobListingTitle": "Cameriere per evento",
            "messagePreview": "Ciao, come va?...",
            "timestamp": "1640995200000"
          }
        }
        ```

        **2. Profile Upgrade Status** - When profile verification completes:
        ```json
        {
          "notification": {
            "title": "Profilo verificato!",
            "body": "La verifica del tuo profilo come azienda/lavoratore è andata a buon fine."
          },
          "data": {
            "actionType": "upgrade"
          }
        }
        ```

        **Security**: User can only register token for their own profile.
      operationId: registerFcmToken
      security:
        - CognitoAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: User's Cognito sub (UUID) - must match authenticated user
          schema:
            type: string
            format: uuid
          example: 12345678-1234-1234-1234-123456789abc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcm_token
              properties:
                fcm_token:
                  type: string
                  description: Firebase Cloud Messaging token from the device
                  example: fcm-device-token-from-firebase-sdk
      responses:
        '200':
          description: FCM token registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: FCM token registered successfully
                  user_id:
                    type: string
                    format: uuid
                    example: 12345678-1234-1234-1234-123456789abc
                  fcm_token_updated_at:
                    type: string
                    format: date-time
                    example: '2026-01-16T10:00:00Z'
        '400':
          description: Bad Request - Missing or invalid fcm_token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: BadRequest
                  message:
                    type: string
                    example: fcm_token is required
        '403':
          description: Forbidden - User trying to register token for another user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                    example: You can only register FCM token for your own profile
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: InternalServerError
                  message:
                    type: string
                    example: Failed to register FCM token
  /bookmarks/battles:
