  /reset-profile:
    post:
      tags:
        - Backoffice
      summary: Reset User Profile to Basic
      description: |
        Reset a user's profile from specialized (worker/company) to "basic" status.

        **Blocking Conditions:**
        - Worker: Cannot reset if has active bookings (status: pending, accepted)
        - Company: Cannot reset if has active job listings (status: published, paused) OR active bookings (status: pending, accepted)

        **Data Deleted on Success:**
        - **Worker**: 
          - Inactive bookings (status: rejected, cancelled, completed, blocked)
          - All user documents
        - **Company**: 
          - Inactive job listings (status: draft, deleted, closed, cancelled) and their associated bookings
          - Company record from Companies table
          - All user documents

        **Cognito Changes:**
        - profile_type: changed to "basic"
        - verification_status: removed
        - Moved to "basic_users" group (removed from worker/company groups)
      operationId: resetProfile
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: JSON stringified request body
                  example: '{"userSub":"765e62b0-10b1-7066-02eb-bc9384e17d08"}'
              required:
                - body
      responses:
        '200':
          description: Profile reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Profile reset to basic successfully
                  summary:
                    type: object
                    properties:
                      userSub:
                        type: string
                      previousProfileType:
                        type: string
                        enum:
                          - worker
                          - company
                          - company_representative
                      resetTimestamp:
                        type: string
                        format: date-time
                      deletedItems:
                        type: object
                        properties:
                          bookings:
                            type: integer
                            description: Number of deleted inactive bookings
                          documents:
                            type: integer
                            description: Number of deleted user documents
                          jobListings:
                            type: integer
                            description: Number of deleted inactive job listings (company only)
                          companyRecord:
                            type: boolean
                            description: Whether company record was deleted from Companies table (company only)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Cannot reset profile - active bookings or job listings exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Cannot reset profile: company has active job listings or active bookings'
                  message:
                    type: string
                    example: Please close or delete all active job listings (published/paused) and cancel all active bookings (pending/accepted) before resetting the profile.
                  activeBookings:
                    type: array
                    description: List of active bookings blocking the reset
                    items:
                      type: object
                      properties:
                        bookingId:
                          type: string
                        listingId:
                          type: string
                        jobTitle:
                          type: string
                          nullable: true
                        workerName:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum:
                            - pending
                            - accepted
                        startDate:
                          type: string
                          format: date
                        endDate:
                          type: string
                          format: date
                  activeListings:
                    type: array
                    description: List of active job listings blocking the reset (company only)
                    items:
                      type: object
                      properties:
                        listingId:
                          type: string
                        jobTitle:
                          type: string
                        status:
                          type: string
                          enum:
                            - published
                            - paused
        '500':
          $ref: '#/components/responses/InternalServerError'
  /documents/upload-url:
    post:
      tags:
        - Profile upgrade
      summary: Request presigned upload URL
      description: |
        Generate a presigned S3 URL for uploading a document (profile-upgrade-documents project).

        **App users only** - requires user authentication token.

        The returned URL is valid for 1 hour and must be used with PUT method.
        Include these headers when uploading to S3:
        - Content-Type: {mime type from request}
        - x-amz-server-side-encryption: aws:kms
        - x-amz-server-side-encryption-aws-kms-key-id: alias/aws/s3

        **Automatic Document Cleanup:**
        When a user re-uploads documents after profile verification rejection, old unnecessary documents are automatically deleted:
        - **Worker**: Keeps only `id_card_front`, `id_card_back` (selfie temporaneamente rimosso)
        - **Company**: Keeps only `id_card_front`, `id_card_back` (visura e selfie temporaneamente rimossi)

        > ⚠️ **NOTA:** `selfie` (worker e company) e `visura` (company) sono temporaneamente disabilitati dal flusso di upgrade. I tipi accettati sono: `id_card_front`, `id_card_back`, `passport`, `drivers_license`.
      operationId: createUploadUrl
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
            examples:
              id_card:
                summary: ID Card Front
                value:
                  docType: id_card_front
                  mime: image/jpeg
                  size: 2048000
      responses:
        '200':
          description: Presigned URL created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
              example:
                uploadUrl: https://s3.amazonaws.com/bucket/...
                documentId: doc_123456789
                expiresIn: 3600
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_Error'
              examples:
                invalid_type:
                  summary: Invalid document type
                  value:
                    statusCode: 400
                    message: 'Invalid docType. Must be one of: id_card_front, id_card_back, passport, drivers_license'
                invalid_mime:
                  summary: Invalid MIME type
                  value:
                    statusCode: 400
                    message: 'Invalid mime type. Allowed: image/jpeg, image/png, application/pdf'
                size_too_large:
                  summary: File too large
                  value:
                    statusCode: 400
                    message: File size exceeds maximum allowed (10MB)
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/common_Error'
