                        - thursday
                        - friday
                        - saturday
                        - sunday
                    notes:
                      type: string
                      maxLength: 500
                      description: Additional schedule notes
                      example: Turno spezzato mar-sab, turno unico domenica. Lunedì riposo.
                employment:
                  type: object
                  description: Employment type - typeId must exist in EmploymentTypes table and be active
                  required:
                    - typeId
                  properties:
                    typeId:
                      type: string
                      description: Employment type ID from EmploymentTypes reference table
                      example: seasonal
