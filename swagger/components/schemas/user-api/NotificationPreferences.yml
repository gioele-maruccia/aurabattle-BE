type: object
description: User notification preferences
properties:
  email_enabled:
    type: boolean
    description: Enable email notifications
    example: false
  push_enabled:
    type: boolean
    description: Enable push notifications
    example: false
  channels:
    type: object
    description: Notification channels preferences
    properties:
      new_battles:
        type: boolean
        description: Notify about new battles
        example: false
      battle_reminders:
        type: boolean
        description: Notify about upcoming battle reminders
        example: false
      messages:
        type: boolean
        description: Notify about new chat messages
        example: false
      marketing:
        type: boolean
        description: Receive marketing communications
        example: false
    required:
      - new_battles
      - battle_reminders
      - messages
      - marketing
required:
  - email_enabled
  - push_enabled
  - channels
