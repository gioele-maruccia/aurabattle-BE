LoginRequest:
  type: object
  required:
    - username
    - password
  properties:
    username:
      type: string
      description: Cognito username (email)
      example: "user@example.com"
    password:
      type: string
      format: password
      description: User password
      example: "YourPassword123"

LoginResponse:
  type: object
  properties:
    idToken:
      type: string
      description: JWT ID token - use this for Authorization header
      example: "eyJraWQiOiJ1SUY5M..."
    accessToken:
      type: string
      description: Access token
    refreshToken:
      type: string
      description: Refresh token (valid for 30 days)
    expiresIn:
      type: integer
      description: Token expiration in seconds (3600 = 1 hour)
      example: 3600
    tokenType:
      type: string
      example: "Bearer"

Document:
  type: object
  properties:
    user_sub:
      type: string
      format: uuid
    document_id:
      type: string
    document_type:
      type: string
      enum: [id_card_front, id_card_back, passport, drivers_license]
    status:
      type: string
      enum: [AWAITING_REVIEW, APPROVED, REJECTED]
    uploaded_at:
      type: string
      format: date-time
    reviewed_at:
      type: string
      format: date-time
    reviewed_by:
      type: string
    rejection_reason:
      type: string

UpdateStatusRequest:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [APPROVED, REJECTED]
    rejectionReason:
      type: string
      minLength: 10
      description: Required when status is REJECTED

DownloadRequest:
  type: object
  properties:
    expiresIn:
      type: integer
      default: 3600
      description: URL expiration in seconds
    filename:
      type: string
      description: Custom filename for download
    reason:
      type: string
      description: Reason for downloading (audit log)

Statistics:
  type: object
  description: Document statistics and analytics
  properties:
    overview:
      type: object
      properties:
        total_documents:
          type: integer
          description: Total number of documents in system
        total_users:
          type: integer
          description: Total number of users
        total_workers:
          type: integer
          description: Total users with worker profile
        total_companies:
          type: integer
          description: Total users with company profile
    by_status:
      type: object
      description: Document count by status
      properties:
        awaiting_review:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
    by_type:
      type: object
      description: Document count by type
      properties:
        id_card_front:
          type: integer
        id_card_back:
          type: integer
        passport:
          type: integer
        drivers_license:
          type: integer
    trends:
      type: object
      description: Trends over specified period (days parameter)
      properties:
        daily_uploads:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
        daily_approvals:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
    average_review_time:
      type: string
      description: Average time from upload to approval/rejection
      example: "2 days 3 hours"