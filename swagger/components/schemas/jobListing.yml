        postalCode:
          type: string
        country:
          type: string
        coordinates:
          type: object
          properties:
            lat:
              type: number
            lon:
              type: number
    startDate:
      type: string
      format: date
      description: Cannot update if listing is published and date passed
    endDate:
      type: string
      format: date
    positions:
      type: integer
      minimum: 1
      maximum: 1000
      description: Cannot decrease below positionsFilled
    category:
      type: string
    salary:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        currency:
          type: string
        period:
          type: string
    schedule:
      type: object
      properties:
        hoursPerWeek:
          type: integer
        flexibility:
          type: string
        shiftType:
          type: string
    employment:
      type: object
      properties:
        type:
          type: string
        contractType:
          type: string
    responsibilities:
      type: string
      maxLength: 2000
    benefits:
      type: string
      maxLength: 2000
    isHousingIncluded:
      type: boolean
      description: Indicates if housing/accommodation is provided
      default: false
    
    # Booking/Accommodation Requirements (Optional)
    vitto:
      type: boolean
      description: Meals provided by employer
    alloggio:
      type: boolean
      description: Accommodation available
    alloggioPricePerDay:
      type: number
      description: Daily accommodation price
    alloggioDescription:
      type: string
      description: Accommodation description
      maxLength: 500
    minConsecutiveDays:
      type: integer
      description: Minimum consecutive booking days
    minNoticeDays:
      type: integer
      description: Minimum advance notice days
    
    requirements:
      type: string
      maxLength: 2000
    tags:
      type: array
      maxItems: 10
      items:
        type: string
    features:
      type: array
      items:
        type: string

CreateManualJobListingRequest:
  type: object
  description: "Create job listing with manual entry (ccnlType='manuale'). Used by non-FIPE companies."
  required:
    - title
    - description
    - startDate
    - endDate
    - ccnlType
    - contractId
    - employmentType
    - location
    - salary
    - hoursPerWeek
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 200
      description: Job title
      example: "Software Developer"
    description:
      type: string
      minLength: 10
      maxLength: 5000
      description: Detailed job description
      example: "Looking for a senior software developer with Python experience"
    startDate:
      type: string
      format: date
      description: Job start date (ISO 8601)
      example: "2026-03-01"
    endDate:
      type: string
      format: date
      description: Job end date (ISO 8601)
      example: "2026-12-31"
    ccnlType:
      type: string
      enum: ['manuale']
      description: "Must be 'manuale' for manual entry"
      example: "manuale"
    contractId:
      type: string
      description: "Custom contract identifier (not from CCNL reference)"
      example: "custom_software_dev_001"
    employmentType:
      type: string
      description: "Employment type"
      example: "full-time"
    location:
      type: object
      required:
        - city
        - country
      properties:
        city:
          type: string
          example: "Milano"
        province:
          type: string
          example: "MI"
        country:
          type: string
          example: "IT"
        address:
          type: string
          example: "Via Roma 123"
        coordinates:
          type: object
          properties:
            lat:
              type: number
              example: 45.4642
            lon:
              type: number
              example: 9.1900
    salary:
      type: number
      minimum: 0
      description: "Annual gross salary or fixed amount for the position"
      example: 35000
    hoursPerWeek:
      type: integer
      minimum: 1
      maximum: 168
      description: "Hours per week"
      example: 40
    requirements:
      type: array
      items:
        type: string
      description: "Job requirements as array of strings"
      example: ["Esperienza con Python", "Conoscenza AWS", "Problem solving"]
    responsibilities:
      type: array
      items:
        type: string
      description: "Job responsibilities as array of strings"
      example: ["Sviluppo backend", "Deployment cloud", "Code review"]
    isHousingIncluded:
      type: boolean
      description: Indicates if housing/accommodation is provided
      default: false
    
    # Booking/Accommodation Requirements (Optional)
    vitto:
      type: boolean
      description: Meals provided by employer
    alloggio:
      type: boolean
      description: Accommodation available
    alloggioPricePerDay:
      type: number
      description: Daily accommodation price
    alloggioDescription:
      type: string
      description: Accommodation description
      maxLength: 500
    minConsecutiveDays:
      type: integer
      description: Minimum consecutive booking days
    minNoticeDays:
      type: integer
      description: Minimum advance notice days
    status:
      type: string
      enum: [draft, published]
      default: draft
      example: "draft"