type: object
properties:
  battle_id:
    type: string
    format: uuid
    example: "a6d66a62-4bcd-4069-9ba5-6eeff473264f"
  host_id:
    type: string
    format: uuid
    description: user_id dell'utente che ha creato la battle
    example: "864eb230-a071-708c-ec7e-a1c6446c9cbe"
  title:
    type: string
    example: "Torneo Aura Street"
  description:
    type: string
    example: "Prima battle di prova"
  location:
    type: string
    example: "Milano, Parco Sempione"
  cover:
    type: string
    enum: [arena, crowd, soundwave, turntable, mic, versus, city, street, spark, aura]
    description: >
      Chiave della copertina di repertorio. L'immagine è inclusa nel bundle
      dell'app e risolta localmente da questa chiave: il backend non la
      ospita né la serve. Mutuamente esclusivo con cover_url. Assente se la
      battle non ha copertina.
    example: "arena"
  cover_url:
    type: string
    format: uri
    readOnly: true
    description: >
      URL pubblico della copertina custom caricata dall'host (già
      ridimensionata/compressa a 1200x675). Impostato in automatico dal
      backend dopo l'elaborazione di un upload — non scrivibile direttamente.
      Mutuamente esclusivo con cover. Assente se la battle non ha una cover
      custom.
    example: "https://dev-aurabattle-battle-covers.s3.eu-south-1.amazonaws.com/covers/a6d66a62-4bcd-4069-9ba5-6eeff473264f.jpg?v=1790600000"
  latitude:
    type: number
    format: double
    minimum: -90
    maximum: 90
    example: 45.4719
  longitude:
    type: number
    format: double
    minimum: -180
    maximum: 180
    example: 9.1697
  event_datetime:
    type: string
    format: date-time
    example: "2026-10-15T18:00:00Z"
  status:
    type: string
    enum: [published, closed]
    example: "published"
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
