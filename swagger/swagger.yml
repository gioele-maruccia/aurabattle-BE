openapi: 3.0.3
info:
  $ref: './info.yml'

servers:
  $ref: './servers.yml'

tags:
  - name: Authentication
    description: Cognito authentication endpoints
  - name: User Profile & Settings
    description: User profile management and preferences
  - name: Battles
    description: Creazione e gestione delle aura battle
  - name: Matchups
    description: Sfide dentro una battle, voto e aggiornamento punteggio
  - name: Moderation
    description: Segnalazioni e blocchi lato utente (nessuna azione automatica)
  - name: Backoffice
    description: API del super admin (API Gateway del backoffice)

components:
  securitySchemes:
    CognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from /auth/login/users endpoint.
        Token expires after 1 hour.


paths:

  # ============================================================================
  # AUTHENTICATION
  # ============================================================================

  /auth/login/users:
    $ref: './paths/core/user-auth.yml'

  /auth/signup:
    $ref: './paths/core/user-signup.yml'

  /auth/confirm:
    $ref: './paths/core/user-confirm.yml'

  # ============================================================================
  # USER API - Profile & Settings Management
  # ============================================================================

  /profile:
    get:
      $ref: './paths/user-api/get-profile.yml#/get'
    put:
      $ref: './paths/user-api/update-profile.yml#/put'

  /settings:
    $ref: './paths/user-api/update-settings.yml'

  /profile/delete-account-simple:
    post:
      $ref: './paths/user-api/delete-account-simple.yml#/post'

  /users/{userId}/fcm-token:
    $ref: './paths/user-api/register-fcm-token.yml'

  /bookmarks/battles:
    get:
      $ref: './paths/user-api/list-bookmarks.yml#/get'

  /bookmarks/battles/{battleId}:
    post:
      $ref: './paths/user-api/add-bookmark.yml#/post'
    delete:
      $ref: './paths/user-api/remove-bookmark.yml#/delete'

  /users/search:
    get:
      $ref: './paths/user-api/search-users.yml#/get'

  /users/username-available:
    get:
      $ref: './paths/user-api/check-username.yml#/get'

  /profile/accept-terms:
    post:
      $ref: './paths/user-api/moderation.yml#/accept-terms/post'

  # ============================================================================
  # MODERATION - segnalazioni e blocchi
  # ============================================================================

  /reports:
    post:
      $ref: './paths/user-api/moderation.yml#/create-report/post'

  /public/reports:
    post:
      $ref: './paths/user-api/moderation.yml#/create-public-report/post'

  /blocks:
    get:
      $ref: './paths/user-api/moderation.yml#/list-blocks/get'

  /blocks/{userId}:
    put:
      $ref: './paths/user-api/moderation.yml#/block-user/put'
    delete:
      $ref: './paths/user-api/moderation.yml#/block-user/delete'

  # ============================================================================
  # BATTLES
  # ============================================================================

  /battles:
    post:
      $ref: './paths/battles/create-battle.yml#/post'
    get:
      $ref: './paths/battles/list-battles.yml#/get'

  /battles/my:
    $ref: './paths/battles/get-my-battles.yml'

  /battles/{battleId}/cover-upload-url:
    post:
      $ref: './paths/battles/request-cover-upload-url.yml#/post'

  /battles/{battleId}:
    get:
      $ref: './paths/battles/get-battle.yml#/get'
    put:
      $ref: './paths/battles/update-battle.yml#/put'
    delete:
      $ref: './paths/battles/delete-battle.yml#/delete'

  # ============================================================================
  # MATCHUPS
  # ============================================================================

  /battles/{battleId}/matchups:
    post:
      $ref: './paths/matchups/create-matchup.yml#/post'
    get:
      $ref: './paths/matchups/list-matchups.yml#/get'

  /matchups/{matchupId}:
    get:
      $ref: './paths/matchups/get-matchup.yml#/get'
    put:
      $ref: './paths/matchups/update-matchup.yml#/put'
    delete:
      $ref: './paths/matchups/delete-matchup.yml#/delete'

  /matchups/{matchupId}/vote:
    post:
      $ref: './paths/matchups/cast-vote.yml#/post'

  /matchups/{matchupId}/votes:
    get:
      $ref: './paths/matchups/get-votes.yml#/get'

  # ============================================================================
  # BACKOFFICE - super admin (base URL: API Gateway del backoffice)
  # ============================================================================

  /admin/reports:
    get:
      $ref: './paths/backoffice/admin.yml#/list-reports/get'

  /admin/reports/{targetType}/{targetId}:
    get:
      $ref: './paths/backoffice/admin.yml#/get-report-group/get'

  /admin/reports/{targetType}/{targetId}/resolve:
    post:
      $ref: './paths/backoffice/admin.yml#/resolve-reports/post'

  /admin/content/{targetType}/{targetId}/restore:
    post:
      $ref: './paths/backoffice/admin.yml#/restore-content/post'

  /admin/users:
    get:
      $ref: './paths/backoffice/admin.yml#/search-users/get'

  /admin/users/{userId}:
    get:
      $ref: './paths/backoffice/admin.yml#/get-user/get'

  /admin/users/{userId}/suspend:
    post:
      $ref: './paths/backoffice/admin.yml#/suspend-user/post'

  /admin/users/{userId}/reinstate:
    post:
      $ref: './paths/backoffice/admin.yml#/reinstate-user/post'

  /admin/deletion-requests:
    get:
      $ref: './paths/backoffice/admin.yml#/list-deletion-requests/get'

  /admin/deletion-requests/{userId}/complete:
    post:
      $ref: './paths/backoffice/admin.yml#/complete-deletion/post'

  /admin/stats:
    get:
      $ref: './paths/backoffice/admin.yml#/stats/get'

  # ============================================================================
  # DA SBLOCCARE MAN MANO CHE DEPLOYIAMO I PROSSIMI SERVIZI:
  # - Backoffice (search-users) — pronto, non ancora deployato
  # - Participations (ex bookings)
  # - Chat / Support Chat
  # ============================================================================
