put:
  tags:
    - Support Chat
  summary: Set sticker on support message
  description: |
    Add emoji/sticker reaction to a support message.
    
    **CRITICAL: Timestamp Requirement**
    You **MUST** provide the original message timestamp (from GET messages),
    not the current time! DynamoDB uses timestamp as sort key.
    
    **Permissions:**
    - Chat requester can add stickers
    - Assigned staff can add stickers
    
  operationId: setSupportSticker
  security:
    - CognitoAuth: []
  parameters:
    - name: supportChatId
      in: path
      required: true
      description: Support chat ID
      schema:
        type: string
        example: "support_abc123def456"
    - name: messageId
      in: path
      required: true
      description: Message ID to add sticker to
      schema:
        type: string
        example: "msg_xyz789"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - sticker
            - timestamp
          properties:
            sticker:
              type: string
              enum: [thumbs_up, thumbs_down, heart, smile, fire, check, question]
              description: Sticker/emoji to add
              example: "thumbs_up"
            timestamp:
              type: string
              format: date-time
              description: |
                **REQUIRED**: Original message timestamp (not current time!).
                Must match the timestamp field of the message from GET messages.
                Used as DynamoDB sort key.
              example: "2025-12-17T14:30:00.123456+00:00"
        examples:
          add_thumbs_up:
            summary: Add thumbs up reaction
            value:
              sticker: "thumbs_up"
              timestamp: "2025-12-17T14:30:00.123456+00:00"
          add_fire:
            summary: Add fire emoji
            value:
              sticker: "fire"
              timestamp: "2025-12-17T14:30:00.123456+00:00"
  responses:
    '200':
      description: Sticker added successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "updated"
              sticker:
                type: string
                example: "thumbs_up"
    '400':
      description: Bad request - Invalid sticker
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid sticker. Valid values: ['thumbs_up', 'heart', 'smile', 'fire', 'check', 'question']"
    '403':
      description: Forbidden - User not authorized
    '404':
      description: Message not found (wrong timestamp or messageId)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Message msg_xyz789 not found"
