    '401':
      description: Unauthorized - Invalid or missing JWT token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: "Unauthorized"
            message: "Invalid or missing authentication token"
    
    '403':
      description: Forbidden - Not a company user
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: "Forbidden"
            message: "Only company users can access this endpoint"
    
    '404':
      description: Company profile not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: "Not Found"
            message: "Company profile not found"
    
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
          example:
            error: "Internal Server Error"
            message: "An error occurred while fetching your job listings"