get:
  tags:
    - Reference data
  summary: Get reference data (Public)
  description: |
    Retrieves reference data for job listings including job roles, contracts, 
    job categories, and employment types. This data is typically used for 
    dropdowns and filters in the UI.
    
    **Returns:**
    - All reference data types by default
    - Specific type if 'type' parameter is provided
    - Only active items by default (use activeOnly=false to include inactive)
    
    **Useful for:**
    - Populating dropdown menus
    - Building search filters
    - Form validation options
    - Category browsing
    
    **Data types available:**
    - jobRoles: Available job positions (Chef, Waiter, etc.)
    - contracts: Contract types (Full-time, Part-time, etc.)
    - categories: Job categories (Hospitality, Healthcare, etc.)
    - employmentTypes: Employment types (Permanent, Temporary, etc.)
    
    **Caching:**
    Response includes Cache-Control header suggesting 1-hour cache.
    This is appropriate as reference data changes infrequently.
  operationId: getReferenceData
  parameters:
    - name: type
      in: query
      schema:
        type: string
        enum: 
          - jobRoles
          - contracts
          - categories
          - employmentTypes
      description: |
        Optional filter to get specific type only.
        If omitted, returns all types.
      example: jobRoles
    
    - name: activeOnly
      in: query
      schema:
        type: boolean
        default: true
      description: |
        Filter to return only active items.
        Set to false to include inactive items.
      example: true
  
  responses:
    '200':
      description: Reference data retrieved successfully
      headers:
        Cache-Control:
          schema:
            type: string
            example: "public, max-age=3600"
          description: Cache for 1 hour
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  jobRoles:
                    type: array
                    description: List of available job roles
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "role-001"
                        name:
                          type: string
                          example: "Chef"
                        category:
                          type: string
                          example: "Kitchen"
                        description:
                          type: string
                          example: "Professional cook responsible for kitchen operations"
                        isActive:
                          type: boolean
                          example: true
                  
                  contracts:
                    type: array
                    description: List of contract types
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "contract-001"
                        name:
                          type: string
                          example: "Full-time"
                        description:
                          type: string
                          example: "Full-time employment contract"
                        isActive:
                          type: boolean
                          example: true
                  
                  categories:
                    type: array
                    description: List of job categories
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "cat-001"
                        name:
                          type: string
                          example: "Hospitality"
                        icon:
                          type: string
                          example: "hotel"
                        description:
                          type: string
                          example: "Hotels, restaurants, and tourism"
                        isActive:
                          type: boolean
                          example: true
                  
                  employmentTypes:
                    type: array
                    description: List of employment types
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "emp-001"
                        name:
                          type: string
                          example: "Permanent"
                        description:
                          type: string
                          example: "Permanent employment position"
                        isActive:
                          type: boolean
                          example: true
              
              meta:
                type: object
                properties:
                  type:
                    type: string
                    example: "all"
                    description: Type filter applied (or "all" if none)
                  activeOnly:
                    type: boolean
                    example: true
                    description: Whether only active items were returned
                  timestamp:
                    type: string
                    nullable: true
                    example: null
          
          examples:
            all_data:
              summary: Get all reference data
              value:
                success: true
                data:
                  jobRoles:
                    - id: "role-001"
                      name: "Chef"
                      category: "Kitchen"
                      description: "Professional cook responsible for kitchen operations"
                      isActive: true
                    - id: "role-002"
                      name: "Waiter"
                      category: "Service"
                      description: "Front of house staff serving customers"
                      isActive: true
                    - id: "role-003"
                      name: "Bartender"
                      category: "Service"
                      description: "Prepares and serves beverages"
                      isActive: true
                  contracts:
                    - id: "contract-001"
                      name: "Full-time"
                      description: "Full-time employment contract with standard benefits"
                      isActive: true
                    - id: "contract-002"
                      name: "Part-time"
                      description: "Part-time employment contract with reduced hours"
                      isActive: true
                  categories:
                    - id: "cat-001"
                      name: "Hospitality"
                      icon: "hotel"
                      description: "Hotels, restaurants, bars, and tourism industry"
                      isActive: true
                    - id: "cat-002"
                      name: "Healthcare"
                      icon: "medical"
                      description: "Medical facilities, clinics, hospitals, and care homes"
                      isActive: true
                    - id: "cat-003"
                      name: "Food Service"
                      icon: "restaurant"
                      description: "Restaurants, cafes, catering, and food preparation"
                      isActive: true
                  employmentTypes:
                    - id: "emp-001"
                      name: "Permanent"
                      description: "Permanent employment position with no fixed end date"
                      isActive: true
                    - id: "emp-002"
                      name: "Temporary"
                      description: "Temporary position for a limited period"
                      isActive: true
                    - id: "emp-003"
                      name: "Seasonal"
                      description: "Employment for specific seasons"
                      isActive: true
                meta:
                  type: "all"
                  activeOnly: true
                  timestamp: null
            
            only_job_roles:
              summary: Get only job roles
              value:
                success: true
                data:
                  jobRoles:
                    - id: "role-001"
                      name: "Chef"
                      category: "Kitchen"
                      description: "Professional cook responsible for kitchen operations"
                      isActive: true
                    - id: "role-002"
                      name: "Sous Chef"
                      category: "Kitchen"
                      description: "Second in command in the kitchen, assists the head chef"
                      isActive: true
                    - id: "role-003"
                      name: "Waiter"
                      category: "Service"
                      description: "Front of house staff serving customers"
                      isActive: true
                    - id: "role-004"
                      name: "Bartender"
                      category: "Service"
                      description: "Prepares and serves beverages"
                      isActive: true
                    - id: "role-005"
                      name: "Receptionist"
                      category: "Front Desk"
                      description: "Welcomes guests and handles check-ins"
                      isActive: true
                meta:
                  type: "jobRoles"
                  activeOnly: true
                  timestamp: null
            
            only_contracts:
              summary: Get only contracts
              value:
                success: true
                data:
                  contracts:
                    - id: "contract-001"
                      name: "Full-time"
                      description: "Full-time employment contract with standard benefits"
                      isActive: true
                    - id: "contract-002"
                      name: "Part-time"
                      description: "Part-time employment contract with reduced hours"
                      isActive: true
                    - id: "contract-003"
                      name: "Freelance"
                      description: "Independent contractor agreement"
                      isActive: true
                meta:
                  type: "contracts"
                  activeOnly: true
                  timestamp: null
            
            include_inactive:
              summary: Get all data including inactive items
              value:
                success: true
                data:
                  jobRoles:
                    - id: "role-001"
                      name: "Chef"
                      category: "Kitchen"
                      description: "Professional cook"
                      isActive: true
                    - id: "role-099"
                      name: "Deprecated Role"
                      category: "Other"
                      description: "This role is no longer used"
                      isActive: false
                  contracts:
                    - id: "contract-001"
                      name: "Full-time"
                      description: "Full-time contract"
                      isActive: true
                  categories:
                    - id: "cat-001"
                      name: "Hospitality"
                      icon: "hotel"
                      description: "Hotels and restaurants"
                      isActive: true
                  employmentTypes:
                    - id: "emp-001"
                      name: "Permanent"
                      description: "Permanent position"
                      isActive: true
                meta:
                  type: "all"
                  activeOnly: false
                  timestamp: null
    
    '400':
      description: Invalid query parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Bad Request"
              message:
                type: string
                example: "Invalid parameter: type must be one of: jobRoles, contracts, categories, employmentTypes"
          examples:
            invalid_type:
              summary: Invalid type parameter
              value:
                error: "Bad Request"
                message: "Invalid parameter: type must be one of: jobRoles, contracts, categories, employmentTypes"
    
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Internal Server Error"
              message:
                type: string
                example: "An unexpected error occurred"
          examples:
            server_error:
              summary: Generic server error
              value:
                error: "Internal Server Error"
                message: "An unexpected error occurred"
            
            table_error:
              summary: Database table error
              value:
                error: "Internal Server Error"
                message: "Unable to access reference data tables"
