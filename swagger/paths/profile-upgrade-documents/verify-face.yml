post:
  tags:
    - Profile upgrade
  summary: "[DISABILITATO] Verify selfie matches ID document"
  description: |
    > ⚠️ **TEMPORANEAMENTE DISABILITATO** — il selfie è stato rimosso dal flusso di profile-upgrade
    > (worker e company). L'endpoint risponde sempre `success: true` con `quality_check: "bypassed"`.
    > Sarà riabilitato in futuro.

    ~~Verify that the selfie contains a real face and matches the face in the uploaded ID card front.~~
    ~~Uses AWS Rekognition: face detection + face comparison against id_card_front.~~
  operationId: verifyFace
  security:
    - CognitoAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/profile-upgrade-documents.yml#/VerifyFaceRequest'
        examples:
          base64_selfie:
            summary: Selfie as Base64
            value:
              selfie_base64: "/9j/4AAQSkZJRgABAQEAAAAAAAD..."
          s3_selfie:
            summary: Selfie already in S3
            value:
              selfie_s3_key: "docs/12345678-1234-1234-1234-123456789abc/1234567890_selfie.jpg"
  responses:
    '200':
      description: Verification completed successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/profile-upgrade-documents.yml#/VerifyFaceResponse'
          examples:
            success:
              summary: Verification successful (bypassed)
              value:
                success: true
                verification:
                  face_detected: true
                  face_confidence: 99.0
                  face_match: true
                  similarity: 99.0
                  quality_check: "bypassed"
                  threshold_used: 0
                message: "Verifica selfie temporaneamente disabilitata."
    '400':
      description: Verification failed or invalid request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
          examples:
            missing_selfie:
              summary: Missing selfie parameter
              value:
                success: false
                error_code: "MISSING_SELFIE"
                message: "Devi fornire selfie_base64 o selfie_s3_key"
            invalid_base64:
              summary: Invalid base64 image
              value:
                success: false
                error_code: "INVALID_BASE64"
                message: "Immagine selfie non valida"
            face_not_detected:
              summary: No face detected in selfie
              value:
                success: false
                error_code: "FACE_NOT_DETECTED"
                message: "Nessun volto rilevato nel selfie. Assicurati di essere ben inquadrato."
                details:
                  hint: "Scatta una nuova foto con buona illuminazione"
            multiple_faces:
              summary: Multiple faces detected
              value:
                success: false
                error_code: "MULTIPLE_FACES"
                message: "Rilevati più volti nel selfie. Devi essere l'unico nel frame."
            quality_check_failed:
              summary: Quality check failed
              value:
                success: false
                error_code: "QUALITY_CHECK_FAILED"
                message: "La qualità del selfie è insufficiente"
                details:
                  issues:
                    - "Immagine troppo scura"
                    - "Volto troppo ruotato"
            id_card_not_found:
              summary: ID card not uploaded yet
              value:
                success: false
                error_code: "ID_CARD_NOT_FOUND"
                message: "Documento identità (fronte) non trovato. Caricalo prima di verificare il selfie."
            no_face_in_document:
              summary: No face in ID document
              value:
                success: false
                error_code: "NO_FACE_IN_DOCUMENT"
                message: "Nessun volto rilevato nel documento identità"
            face_mismatch:
              summary: Faces don't match
              value:
                success: false
                error_code: "FACE_MISMATCH"
                message: "Il volto nel selfie non corrisponde al documento. Similarità: 45.2%"
                details:
                  similarity: 45.2
                  threshold: 80.0
            image_too_large:
              summary: Image too large
              value:
                success: false
                error_code: "IMAGE_TOO_LARGE"
                message: "Immagine troppo grande. Massimo 5MB"
    '401':
      description: Unauthorized - invalid or missing token
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
          examples:
            rekognition_error:
              summary: AWS Rekognition error
              value:
                success: false
                error_code: "REKOGNITION_ERROR"
                message: "Errore nel servizio di riconoscimento facciale"
            internal_error:
              summary: Internal error
              value:
                success: false
                error_code: "INTERNAL_ERROR"
                message: "Errore interno del server"
