    post:
      tags:
        - Profile upgrade
      summary: Initiate user profile upgrade
      description: |
        Initiate the process to upgrade a user profile to worker or company type (profile-upgrade-request project).
        
        **App users only** - requires user authentication token.
        
        This endpoint:
        1. Updates user's Cognito attributes (custom:profile_type, custom:verification_status)
        2. Adds user to appropriate Cognito group (workers or companies)
        3. Records the upgrade request in DynamoDB
        
        After calling this endpoint, the user should proceed to upload required documents.
      operationId: initiateProfileUpgrade
      security:
        - CognitoAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/profile-upgrade-request.yml#/InitiateUpgradeRequest'
            examples:
              worker_upgrade:
                summary: Upgrade to Worker
                value:
                  username: "user@example.com"
                  upgrade_type: "worker"
              company_upgrade:
                summary: Upgrade to Company
                value:
                  username: "company@example.com"
                  upgrade_type: "company"
      responses:
        '200':
          description: Upgrade process initiated successfully
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/profile-upgrade-request.yml#/InitiateUpgradeResponse'
              examples:
                worker_success:
                  summary: Worker upgrade initiated
                  value:
                    username: "user@example.com"
                    profile_type: "worker"
                    verification_status: "pending_documents"
                    group: "workers"
                    timestamp: "2024-01-15T10:30:00Z"
                    message: "Profile upgrade initiated. Please upload required documents."
                company_success:
                  summary: Company upgrade initiated
                  value:
                    username: "company@example.com"
                    profile_type: "company"
                    verification_status: "pending_documents"
                    group: "companies"
                    timestamp: "2024-01-15T10:30:00Z"
                    message: "Profile upgrade initiated. Please upload required documents."
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'
              examples:
                invalid_type:
                  summary: Invalid upgrade type
                  value:
                    statusCode: 400
                    message: "Invalid upgrade_type. Must be 'worker' or 'company'"
                    error: "CLIENT_ERROR"
                missing_username:
                  summary: Missing username
                  value:
                    statusCode: 400
                    message: "Username is required"
                    error: "CLIENT_ERROR"
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'
              example:
                statusCode: 404
                message: "User not found in Cognito User Pool"
                error: "NOT_FOUND"
        '409':
          description: Conflict - user already has this profile type or upgrade in progress
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'
              example:
                statusCode: 409
                message: "User already has an upgrade request in progress"
                error: "CONFLICT"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'
              example:
                statusCode: 500
                message: "Failed to update user attributes"
                error: "INTERNAL_ERROR"