    get:
      tags:
        - Companies
      summary: Get company profile by companyId (public)
      description: |
        Get company profile by companyId - **public endpoint, no authentication required**.
        
        Used by the app to display company information to workers viewing job listings.
        
        Returns only public information (no sensitive data).
      operationId: getCompanyById
      parameters:
        - name: companyId
          in: path
          required: true
          description: Company UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Company profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/company.yml#/Company'
              example:
                companyId: "uuid-456"
                businessName: "KFC Belgium"
                description: "Fast food chain dedicated to quality meals"
                location:
                  city: "Mechelen"
                  country: "Belgium"
                  coordinates:
                    lat: 51.0259
                    lon: 4.4773
                media:
                  profileImageUrl: "https://dev-beezey-companies-assets.s3.eu-south-1.amazonaws.com/companies/uuid-456/profile.jpg"
                  galleryImages:
                    - "https://dev-beezey-companies-assets.s3.eu-south-1.amazonaws.com/companies/uuid-456/gallery/1.jpg"
                stats:
                  averageRating: 4.8
                  totalReviews: 129
                  activeListingsCount: 3
                status: "active"
                representative:
                  sub: "661e52a0-00d1-7090-36f7-a17f57334cdf"
                  firstName: "Mario"
                  lastName: "Rossi"
                  email: "mario.rossi@example.com"
                  birthdate: "1990-01-15"
                  photoUrl: "https://prod-beezey-profiles.s3.eu-south-1.amazonaws.com/profiles/661e52a0-.../avatar.jpg?..."
                  userStatus: "CONFIRMED"
                  enabled: true
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'
              example:
                statusCode: 404
                error: "CompanyNotFound"
                message: "Company not found"