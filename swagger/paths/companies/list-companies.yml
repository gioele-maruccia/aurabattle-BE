  tags:
    - Companies
  summary: List all companies
  description: |
    List all companies with pagination (for backoffice use).
    
    **Authentication required** - Typically for admin/backoffice users.
  operationId: listCompanies
  security:
    - CognitoAuth: []
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of companies per page
    - name: lastKey
      in: query
      schema:
        type: string
      description: Pagination token (userId from last result)
  responses:
    '200':
      description: Companies list retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              companies:
                type: array
                items:
                  $ref: '../../components/schemas/company.yml#/Company'
              count:
                type: integer
                description: Number of companies in current page
              lastKey:
                type: string
                description: Token for next page (if more results available)
          example:
            companies:
              - userId: "user-1"
                companyId: "comp-1"
                businessName: "Restaurant A"
                status: "active"
              - userId: "user-2"
                companyId: "comp-2"
                businessName: "Hotel B"
                status: "active"
            count: 2
            lastKey: "user-2"
    '500':
      $ref: '../../components/responses/InternalServerError.yml'