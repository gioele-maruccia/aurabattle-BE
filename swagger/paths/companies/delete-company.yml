  tags:
    - Companies
  summary: Delete company profile (soft delete)
  description: |
    Soft delete a company profile by setting status to 'deleted'.
    
    This preserves data for audit/recovery while hiding from public view.
    
    **Authorization**: User can only delete their own company profile.
  operationId: deleteCompany
  security:
    - CognitoAuth: []
  parameters:
    - name: userId
      in: path
      required: true
      description: User's Cognito sub (must match authenticated user)
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Company deleted successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              companyId:
                type: string
                format: uuid
              deletedAt:
                type: string
                format: date-time
              note:
                type: string
          example:
            message: "Company deleted successfully"
            companyId: "uuid-456"
            deletedAt: "2025-01-20T10:30:00Z"
            note: "This is a soft delete. Contact support within 30 days to restore your profile."
    '403':
      description: Forbidden - User not authorized to delete this company
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
          example:
            statusCode: 403
            error: "Forbidden"
            message: "You are not authorized to delete this company"
    '404':
      description: Company not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
          example:
            statusCode: 404
            error: "CompanyNotFound"
            message: "Company profile not found"
    '500':
      $ref: '../../components/responses/InternalServerError.yml'