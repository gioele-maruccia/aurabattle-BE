post:
  tags:
    - Battles
  summary: Crea una nuova battle
  description: L'utente autenticato ne diventa l'host. La battle è subito pubblica.
  operationId: createBattle
  security:
    - CognitoAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - title
            - location
            - latitude
            - longitude
            - event_datetime
          properties:
            title:
              type: string
              example: "Torneo Aura Street"
            description:
              type: string
              example: "Prima battle di prova"
            location:
              type: string
              example: "Milano, Parco Sempione"
            cover:
              type: string
              enum: [arena, crowd, soundwave, turntable, mic, versus, city, street, spark, aura]
              description: Chiave della copertina di repertorio (opzionale). Se assente, l'app mostra un gradiente generato dal battle_id.
              example: "arena"
            stream_url:
              type: string
              format: uri
              description: Link allo streaming live (YouTube, Twitch, ecc.), opzionale.
              example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            latitude:
              type: number
              format: double
              minimum: -90
              maximum: 90
              example: 45.4719
            longitude:
              type: number
              format: double
              minimum: -180
              maximum: 180
              example: 9.1697
            event_datetime:
              type: string
              format: date-time
              example: "2026-10-15T18:00:00Z"
            end_datetime:
              type: string
              format: date-time
              example: "2026-10-15T20:00:00Z"
              description: "Orario di fine, opzionale. Dopo l'inizio e nel futuro. A quell'ora la battle passa a 'closed' e i suoi matchup vengono chiusi (vincitore e aura_stats calcolati). Senza, nessuna chiusura automatica."
  responses:
    '201':
      description: Battle creata
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/battles/Battle.yml'
    '400':
      description: Campi obbligatori mancanti
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
    '401':
      $ref: '../../components/responses/Unauthorized.yml'
