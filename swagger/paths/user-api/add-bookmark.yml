post:
  tags:
    - User Profile & Settings
  summary: Salva una battle nei bookmark
  operationId: addBookmark
  security:
    - CognitoAuth: []
  parameters:
    - name: battleId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Bookmark aggiunto (idempotente)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              bookmarked_battles:
                type: array
                items:
                  type: string
    '404':
      description: Battle non trovata
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
    '401':
      $ref: '../../components/responses/Unauthorized.yml'
