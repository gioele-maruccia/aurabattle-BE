post:
  tags:
    - User Profile & Settings
  summary: Request account deletion
  description: |
    Records the deletion request: sets `account_status = deletion_requested`
    and `deletion_requested_at` (a second request keeps the first date).

    Nothing is deleted here. The super admin sees the request in the
    backoffice (`GET /admin/deletion-requests`), deletes the account by hand
    within 15 days (Cognito user + profile) and then marks it as completed.
  security:
    - CognitoAuth: []
  responses:
    '200':
      description: Account marked for deletion
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "account marked to be deleted in 15gg"
              deletion_days:
                type: integer
                example: 15
    '401':
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized"
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Internal server error"
