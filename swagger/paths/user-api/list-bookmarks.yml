get:
  tags:
    - User Profile & Settings
  summary: Lista le battle salvate nei bookmark
  description: Ritorna i dati completi delle battle salvate dall'utente.
  operationId: listBookmarks
  security:
    - CognitoAuth: []
  responses:
    '200':
      description: Lista battle salvate
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '../../components/schemas/battles/Battle.yml'
              count:
                type: integer
    '401':
      $ref: '../../components/responses/Unauthorized.yml'
