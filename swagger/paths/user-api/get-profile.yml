get:
  tags:
    - User Profile & Settings
  summary: Get user profile
  description: |
    Retrieve the authenticated user's profile.
  operationId: getUserProfile
  security:
    - CognitoAuth: []

  responses:
    '200':
      description: User profile retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
                example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              email:
                type: string
                format: email
                example: "mario.rossi@example.com"
              profile:
                $ref: '../../components/schemas/user-api/ProfileInfo.yml'
              display_name:
                type: string
                description: Nome pubblico mostrato agli altri utenti
                example: "Mario"
              avatar_url:
                type: string
                nullable: true
                example: null
              account_status:
                type: string
                enum: [active, suspended, banned]
                example: "active"
              hosted_battles_count:
                type: integer
                example: 0
              joined_battles_count:
                type: integer
                example: 0
              verifications:
                type: object
                properties:
                  email_verified:
                    type: boolean
                  phone_verified:
                    type: boolean
              aura_stats:
                type: object
                description: Placeholder statistiche aura, da definire con le regole delle battle
                properties:
                  level:
                    type: integer
                    example: 0
                  wins:
                    type: integer
                    example: 0
                  losses:
                    type: integer
                    example: 0
              notification_preferences:
                $ref: '../../components/schemas/user-api/NotificationPreferences.yml'
              localization:
                type: object
                properties:
                  preferred_language:
                    type: string
                    example: "it"
                  timezone:
                    type: string
                    example: "Europe/Rome"
              bookmarked_battles:
                type: array
                items:
                  type: string
                description: Array di ID delle battle salvate dall'utente
                example: []
              created_at:
                type: string
                format: date-time
                example: "2026-01-15T10:30:00Z"
              updated_at:
                type: string
                format: date-time
                example: "2026-01-15T10:30:00Z"
          examples:
            profile:
              summary: User profile
              value:
                user_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                email: "mario.rossi@example.com"
                profile:
                  given_name: "Mario"
                  family_name: "Rossi"
                  phone_number: "+393331234567"
                display_name: "Mario"
                avatar_url: null
                account_status: "active"
                hosted_battles_count: 0
                joined_battles_count: 0
                verifications:
                  email_verified: true
                  phone_verified: false
                aura_stats:
                  level: 0
                  wins: 0
                  losses: 0
                notification_preferences:
                  email_enabled: false
                  push_enabled: false
                  channels:
                    new_battles: false
                    battle_reminders: false
                    messages: false
                    marketing: false
                localization:
                  preferred_language: "it"
                  timezone: "Europe/Rome"
                bookmarked_battles: []
                created_at: "2026-01-15T10:30:00Z"
                updated_at: "2026-01-15T10:30:00Z"

    '404':
      $ref: '../../components/responses/NotFound.yml'

    '401':
      $ref: '../../components/responses/Unauthorized.yml'

    '500':
      $ref: '../../components/responses/InternalServerError.yml'
