delete:
  tags:
    - User Profile & Settings
  summary: Rimuove una battle dai bookmark
  operationId: removeBookmark
  security:
    - CognitoAuth: []
  parameters:
    - name: battleId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Bookmark rimosso (idempotente)
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              bookmarked_battles:
                type: array
                items:
                  type: string
    '401':
      $ref: '../../components/responses/Unauthorized.yml'
