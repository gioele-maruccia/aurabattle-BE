get:
  tags:
    - User Profile & Settings
  summary: Cerca utenti registrati (picker partecipanti)
  description: |
    Richiede autenticazione, ma qualsiasi utente loggato può usarlo — non è
    un endpoint admin. Ritorna solo dati pubblici (user_id, display_name,
    avatar_url): mai email, stato account o altri dati sensibili.

    Tre modalità, in base al contenuto di `q`:
    - contiene `@` → match **esatto** sull'email (nessuna enumerazione:
      digitare `a@` non restituisce nulla, serve l'indirizzo completo)
    - altrimenti → prefix match case-insensitive su **nome e cognome**,
      risultati uniti e deduplicati (es. "rossi" trova "Mario Rossi" anche
      se il suo `display_name` è solo "Mario")
  operationId: searchUsers
  security:
    - CognitoAuth: []
  parameters:
    - name: q
      in: query
      required: true
      description: Minimo 2 caratteri
      schema:
        type: string
        minLength: 2
      example: "mar"
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 50
  responses:
    '200':
      description: Utenti trovati
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                      format: uuid
                    display_name:
                      type: string
                      example: "Mario"
                    avatar_url:
                      type: string
                      nullable: true
              count:
                type: integer
    '400':
      description: q troppo corto
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common.yml#/Error'
    '401':
      $ref: '../../components/responses/Unauthorized.yml'
