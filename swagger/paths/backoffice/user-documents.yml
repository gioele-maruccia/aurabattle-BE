    get:
      tags:
        - Backoffice
      summary: Get user documents
      description: Get all documents for a specific user (backoffice-api-sam project)
      operationId: getUserDocuments
      security:
        - CognitoAuth: []
      parameters:
        - name: user_sub
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [AWAITING_REVIEW, APPROVED, REJECTED]
      responses:
        '200':
          description: User documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  userSub:
                    type: string
                    description: User subscription ID
                  userInfo:
                    type: object
                    properties:
                      sub:
                        type: string
                      fullName:
                        type: string
                      email:
                        type: string
                      profileType:
                        type: string
                        enum: [basic, worker, company, company_representative]
                      userStatus:
                        type: string
                  documents:
                    type: array
                    items:
                      $ref: '../../components/schemas/backoffice.yml#/Document'
                  count:
                    type: integer
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'