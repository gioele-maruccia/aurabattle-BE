    get:
      tags:
        - Backoffice
      summary: List documents
      description: Get list of documents with optional status filter (backoffice-api-sam project)
      operationId: listDocuments
      security:
        - CognitoAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [AWAITING_REVIEW, APPROVED, REJECTED]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '../../components/schemas/backoffice.yml#/Document'
                  count:
                    type: integer
                  filters:
                    type: object
                    properties:
                      status:
                        type: string
                      profileType:
                        type: string
                      limit:
                        type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../../components/schemas/common.yml#/Error'