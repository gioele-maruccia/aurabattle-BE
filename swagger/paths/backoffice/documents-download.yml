    post:
      tags:
        - Backoffice
      summary: Get download URL
      description: Generate presigned S3 URL for document download (backoffice-api-sam project)
      operationId: getDownloadUrl
      security:
        - CognitoAuth: []
      parameters:
        - name: user_sub
          in: path
          required: true
          schema:
            type: string
        - name: document_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/backoffice.yml#/DownloadRequest'
      responses:
        '200':
          description: Download URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expires_at:
                    type: string
        '404':
          description: Document not found